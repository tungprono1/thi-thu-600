<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Thi thử 600 câu sát hạch lái xe</title>
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1f2937; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#dbeafe;
    --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
    --warn:#d97706; --warn-soft:#fef3c7; --flag:#ea580c;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 6px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:15px;font-weight:600;transition:.15s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand);color:#fff;padding:14px 22px}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:12px 18px}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .hidden{display:none!important}

  /* ---------- START ---------- */
  .hero{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:34px 26px;margin-top:24px;text-align:center}
  .hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
  .hero .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .rules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left;margin:22px 0}
  .rule{display:flex;gap:12px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px}
  .rule .ic{font-size:22px;line-height:1}
  .rule b{display:block;font-size:15px}
  .rule span{font-size:13px;color:var(--muted)}
  .passnote{background:var(--brand-soft);color:var(--brand-d);border-radius:12px;padding:12px;font-size:14px;font-weight:600;margin-bottom:22px}

  /* ---------- HEADER BAR ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(238,242,247,.9);backdrop-filter:blur(8px);
    padding:10px 0;margin:-16px -16px 0;border-bottom:1px solid var(--line)}
  .topbar .row{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:104px;justify-content:center}
  .timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .progress-mini{flex:1;font-size:13px;color:var(--muted)}
  .progress-mini b{color:var(--ink);font-size:15px}
  .bar{height:6px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

  /* ---------- PALETTE ---------- */
  .palette{background:#eef4ff;border:1px solid #c7d7fe;border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-top:16px}
  .palette h3{margin:0 0 10px;font-size:13px;color:var(--brand-d);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
  .cell{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;
    color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}
  .cell.answered{background:var(--brand);border-color:var(--brand);color:#fff}
  .cell.flagged{background:var(--warn-soft);border-color:var(--flag);color:#9a3412}
  .cell.flagged::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:11px}
  .cell.current{outline:3px solid var(--brand-soft);border-color:var(--brand)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1.5px solid var(--line)}
  .lg-ans{background:var(--brand);border-color:var(--brand)}
  .lg-flag{background:var(--warn-soft);border-color:var(--flag)}
  .lg-empty{background:#fff}

  /* ---------- QUESTION CARD ---------- */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-top:16px}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .qnum{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:99px}
  .chip{font-size:11px;color:var(--muted);background:#f1f5f9;padding:4px 10px;border-radius:99px;max-width:55%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flagbtn{background:#fff;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;display:flex;gap:6px;align-items:center}
  .flagbtn.on{background:var(--warn-soft);border-color:var(--flag);color:#9a3412}
  .qtext{font-size:18px;font-weight:600;line-height:1.5;margin:6px 0 16px}
  .qimg{width:100%;max-width:420px;display:block;margin:0 auto 18px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;text-align:left;font-weight:500;font-size:15.5px;color:var(--ink);width:100%}
  .opt:hover{border-color:var(--brand)}
  .opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:#f1f5f9;color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .key{background:var(--brand);color:#fff}
  /* review states */
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .key{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad);color:#fff}
  .opt .mark{margin-left:auto;font-weight:800;align-self:center}

  .navrow{display:flex;gap:10px;margin-top:18px}
  .navrow button{flex:1;padding:13px}
  .submitrow{margin-top:14px}
  .submitrow button{width:100%;padding:15px;background:var(--ok);color:#fff}
  .submitrow button:hover{background:#15803d}
  #qcard{scroll-margin-top:78px}
  #qcard .card{background:#fffefb;border-top:4px solid var(--brand)}   /* khu vực câu hỏi: nền kem + viền xanh nhấn */
  .submitrow button{background:var(--ok);color:#fff}

  /* ---------- EXPLANATION ---------- */
  .exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .exp .easy{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 14px;font-size:14px}
  .exp .easy b,.exp .detail b{color:var(--brand-d)}
  .exp .detail{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:10px}
  .exp details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}

  /* ---------- RESULT ---------- */
  .result{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:30px 24px;margin-top:24px;text-align:center}
  .verdict{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border-radius:99px;display:inline-block}
  .verdict.pass{background:var(--ok-soft);color:var(--ok)}
  .verdict.fail{background:var(--bad-soft);color:var(--bad)}
  .score{font-size:56px;font-weight:900;letter-spacing:-.03em;margin:14px 0 2px}
  .score small{font-size:24px;color:var(--muted);font-weight:700}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
  .stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 6px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.g b{color:var(--ok)} .stat.r b{color:var(--bad)} .stat.o b{color:var(--flag)}
  .reviewhead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 4px}
  .reviewhead h2{font-size:18px;margin:0}
  .filterbtns{display:flex;gap:6px}
  .filterbtns button{font-size:12px;padding:7px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .filterbtns button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .rv-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
  .rv-tag.c{background:var(--ok-soft);color:var(--ok)}
  .rv-tag.w{background:var(--bad-soft);color:var(--bad)}
  .rv-tag.s{background:var(--warn-soft);color:var(--flag)}
  /* nền thẻ xem lại theo kết quả từng câu */
  .card.rv-correct{background:#f2fdf6;border-left:5px solid var(--ok)}
  .card.rv-wrong{background:#fff5f5;border-left:5px solid var(--bad)}
  .card.rv-skip{background:#fffbef;border-left:5px solid var(--flag)}
  /* nền màn kết quả theo đỗ/trượt */
  .result.pass{background:linear-gradient(180deg,#eafdf0 0%,#ffffff 55%)}
  .result.fail{background:linear-gradient(180deg,#fdeeee 0%,#ffffff 55%)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 0}

  /* ---------- ENDING POPUP ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.74);backdrop-filter:blur(5px);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .25s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:22px;max-width:440px;width:100%;padding:26px 22px 22px;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.25,.4,1)}
  @keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:23px;margin:0 0 16px;line-height:1.35;letter-spacing:-.01em}
  .modal .egif{width:100%;max-width:360px;max-height:300px;object-fit:contain;border-radius:16px;display:block;margin:0 auto 16px;background:#f1f5f9;border:1px solid var(--line)}
  .modal .etext{font-size:18px;font-weight:700;margin:0 6px 22px}
  .modal .ebtns{display:flex;flex-direction:column;gap:10px}
  .modal .ebtns button{width:100%;padding:14px}
  @media(max-width:560px){
    .rules{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(6,1fr)}
    .statgrid{grid-template-columns:repeat(2,1fr)}
    .qtext{font-size:17px}
    .hero h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
window.EXAM_META={"title":"600 câu hỏi sát hạch 2025 - Giải thích dễ hiểu + giải thích chi tiết","source":"Bộ Công an - Cục Cảnh sát giao thông, 600 câu hỏi dùng cho sát hạch lái xe cơ giới đường bộ, Hà Nội 2025"};
window.QUESTIONS=[{"id":1,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Phần của đường bộ được sử dụng cho phương tiện giao thông đường bộ đi lại là gì?","o":["Phần mặt đường và lề đường.","Phần đường xe chạy.","Phần đường xe cơ giới."],"a":2,"img":null,"ee":"Hiểu đơn giản: phần đường xe chạy là phần mặt đường dành để xe đi lại. Lề đường nằm bên cạnh nên không tính là phần xe chạy bình thường.","ed":"Câu này hỏi tên của phần đường dùng cho phương tiện đi lại nói chung. “Phần đường xe chạy” là phần nằm trong mặt đường dành cho xe chạy. “Mặt đường và lề đường” rộng hơn khái niệm cần hỏi vì lề đường không phải phần xe chạy bình thường; còn “phần đường xe cơ giới” lại hẹp hơn vì chỉ nói tới xe cơ giới. Vì vậy phương án 2 vừa đúng đối tượng vừa đúng phạm vi."},{"id":2,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Làn đường là gì?","o":["Là một phần của phần đường xe chạy được chia theo chiều dọc của đường, sử dụng cho xe chạy.","Là một phần của phần đường xe chạy được chia theo chiều dọc của đường, có đủ chiều rộng cho xe chạy an toàn.","Là đường cho xe ô tô chạy, dừng, đỗ an toàn."],"a":2,"img":null,"ee":"Một làn đường là một dải chạy theo chiều dọc của đường và phải đủ rộng để một xe đi an toàn. Vì vậy chỉ nói “chia theo chiều dọc” vẫn chưa đủ định nghĩa.","ed":"Định nghĩa “làn đường” cần đủ ba ý: nó thuộc phần đường xe chạy, được chia theo chiều dọc và phải đủ chiều rộng để xe chạy an toàn. Phương án 1 mới nói việc chia theo chiều dọc nhưng chưa có điều kiện “đủ chiều rộng”. Phương án 3 biến làn đường thành nơi ô tô chạy, dừng, đỗ nên sai bản chất. Vì thế chọn phương án 2."},{"id":3,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khổ giới hạn của đường bộ được hiểu như thế nào là đúng?","o":["Khổ giới hạn của đường bộ là khoảng trống có kích thước giới hạn về chiều rộng, chiều cao của đường bộ để các xe, bao gồm cả hàng hoá xếp trên xe đi qua được an toàn và được xác định theo quy chuẩn, tiêu chuẩn kỹ thuật của đường bộ.","Là khoảng trống có kích thước giới hạn về chiều rộng của đường, cầu, bến phà, hầm trên đường b ộ để các xe kể cả hàng hóa xếp trên xe đi qua được an toàn.","Là khoảng trống có kích thước giới hạn về chiều cao của cầu, bến phà, hầm trên đường bộ để các xe đi qua được an toàn."],"a":1,"img":null,"ee":"Khổ giới hạn giống như một “khung vô hình” có cả chiều rộng và chiều cao. Xe và hàng trên xe phải lọt trong khung đó mới đi qua đường, cầu hay hầm an toàn.","ed":"Hãy hình dung khổ giới hạn như một khung không gian mà cả xe và hàng xếp trên xe phải lọt qua. Khung này có cả chiều rộng lẫn chiều cao và được xác định theo quy chuẩn, tiêu chuẩn kỹ thuật. Phương án 2 chỉ nói chiều rộng, phương án 3 chỉ nói chiều cao nên đều thiếu. Phương án 1 đủ cả hai kích thước và cả hàng hóa trên xe nên đúng."},{"id":4,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Dải phân cách được lắp đặt để làm gì?","o":["Để phân chia các làn đường dành cho xe cơ giới và xe thô sơ trên đường cao tốc.","Để phân chia phần đường xe chạy thành hai chiều riêng biệt hoặc để phân chia phần đường dành cho xe cơ giới và xe thô sơ hoặc của nhiều loại xe khác nhau trên cùng một chiều đường.","Để phân tách phần đường xe chạy và hành lang an toàn giao thông."],"a":2,"img":null,"ee":"Dải phân cách dùng để tách các dòng xe: tách hai chiều ngược nhau hoặc tách phần dành cho các nhóm xe khác nhau. Hãy hình dung dải bê tông/cây xanh ở giữa đường.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Để phân chia phần đường xe chạy thành hai chiều riêng biệt hoặc để phân chia phần đường dành cho xe cơ giới và xe thô sơ hoặc của nhiều loại xe khác nhau trên cùng một chiều đường. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":5,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Vạch kẻ đường là gì?","o":["Là báo hiệu đường bộ để hỗ trợ cảnh báo nguy hiểm cho người tham gia giao thông đường bộ.","Là vạch chỉ sự phân chia làn đường, vị trí hoặc hướng đi, vị trí dừng lại.","Là báo hiệu cho người tham gia giao thông đường bộ về các thông tin của đường bộ.","Cả ba ý trên."],"a":2,"img":null,"ee":"Vạch kẻ đường là các nét sơn ngay trên mặt đường để chia làn, chỉ hướng hoặc chỉ vị trí phải dừng. Nó là một loại báo hiệu mà người lái nhìn trực tiếp dưới bánh xe.","ed":"Đây là dạng câu định nghĩa nên cần giữ đủ phạm vi và điều kiện trong câu chữ. Nội dung đầy đủ mà bộ đề xác định là: “Là vạch chỉ sự phân chia làn đường, vị trí hoặc hướng đi, vị trí dừng lại”. Phương án dễ nhầm là “Là báo hiệu cho người tham gia giao thông đường bộ về các thông tin của đường bộ”, nhưng phương án đó thường thiếu một điều kiện hoặc làm hẹp/rộng khái niệm so với đáp án đầy đủ. Khi làm bài, ưu tiên phương án mô tả trọn vẹn khái niệm, không chọn câu chỉ đúng một phần."},{"id":6,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ được hiểu như thế nào là đúng?","o":["Là người điều khiển xe cơ giới, người điều khiển xe thô sơ, người điều khiển xe máy chuyên dùng.","Là người được giao nhiệm vụ hướng dẫn giao thông trên đường bộ.","Cả hai ý trên."],"a":1,"img":null,"ee":"“Người điều khiển phương tiện” là người đang điều khiển xe cơ giới, xe thô sơ hoặc xe máy chuyên dùng. Người đứng hướng dẫn giao thông không thuộc khái niệm này.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Là người điều khiển xe cơ giới, người điều khiển xe thô sơ, người điều khiển xe máy chuyên dùng. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":7,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe được hiểu như thế nào là đúng?","o":["Là người điều khiển xe cơ giới.","Là người điều khiển xe thô sơ.","Là người điều khiển xe máy chuyên dùng."],"a":1,"img":null,"ee":"“Người lái xe” là khái niệm hẹp hơn: chỉ người điều khiển xe cơ giới. Người đi xe đạp hay điều khiển xe máy chuyên dùng được gọi theo nhóm khác.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Là người điều khiển xe cơ giới. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":8,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trong nhóm các phương tiện giao thông đường bộ dưới đây, nhóm phương tiện nào là xe cơ giới?","o":["Xe ô tô; máy kéo; xe mô tô hai bánh; xe mô tô ba bánh; xe gắn máy; xe cơ giới dùng cho người khuyết tật và xe máy chuyên dùng; xe đạp, xe đạp máy, xe đạp điện.","Xe ô tô; rơ moóc được kéo bởi xe ô tô; sơ mi rơ moóc được kéo bởi ô tô đầu kéo; xe chở người bốn bánh có gắn động cơ; xe chở hàng bốn bánh có gắn động cơ; xe mô tô, xe gắn máy và các loại xe tương tự."],"a":2,"img":null,"ee":"Xe cơ giới ở câu này là nhóm phương tiện chạy bằng động cơ như ô tô, mô tô, xe gắn máy và các loại rơ moóc/sơ mi rơ moóc đi kèm ô tô. Nếu phương án trộn xe đạp vào thì sai nhóm.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Xe ô tô; rơ moóc được kéo bởi xe ô tô; sơ mi rơ moóc được kéo bởi ô tô đầu kéo; xe chở người bốn bánh có gắn động cơ; xe chở hàng bốn bánh có gắn động cơ; xe mô tô, xe gắn máy và các loại xe tương tự. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":9,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trong nhóm các phương tiện giao thông đường bộ dưới đây, nhóm phương tiện nào là xe thô sơ?","o":["Xe đạp, xe đạp máy, xe đạp điện; xe xích lô; xe lăn dùng cho người khuyết tật; xe vật nuôi kéo và các loại xe tương tự.","Xe đạp (kể cả xe đạp máy, xe đạp điện), xe gắn máy, xe cơ giới dùng cho người khuyết tật và xe máy chuyên dùng.","Xe ô tô, máy kéo, rơ moóc hoặc sơ mi rơ moóc được kéo bởi xe ô tô, máy kéo."],"a":1,"img":null,"ee":"Xe thô sơ là nhóm không phải ô tô/mô tô: xe đạp, xích lô, xe lăn, xe vật nuôi kéo… Vì vậy thấy xe gắn máy hoặc ô tô chen vào phương án thì không còn là nhóm thô sơ.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Xe đạp, xe đạp máy, xe đạp điện; xe xích lô; xe lăn dùng cho người khuyết tật; xe vật nuôi kéo và các loại xe tương tự. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":10,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Phương tiện giao thông đường bộ gồm những loại nào?","o":["Phương tiện giao thông cơ giới đường bộ.","Phương tiện giao thông thô sơ đường bộ, xe máy chuyên dùng và các loại xe tương tự.","Cả hai ý trên."],"a":3,"img":null,"ee":"Phương tiện giao thông đường bộ gồm cả nhóm cơ giới và nhóm thô sơ, đồng thời có xe máy chuyên dùng. Vì hai ý đều là các phần của khái niệm nên chọn “Cả hai ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Phương tiện giao thông cơ giới đường bộ; ý 2: Phương tiện giao thông thô sơ đường bộ, xe máy chuyên dùng và các loại xe tương tự. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":11,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người tham gia giao thông đường bộ gồm những đối tượng nào?","o":["Người điều khiển, người được chở trên phương tiện tham gia giao thông đường bộ.","Người điều khiển, dẫn dắt vật nuôi trên đường bộ; người đi bộ trên đường bộ.","Cả hai ý trên."],"a":3,"img":null,"ee":"“Người tham gia giao thông” rất rộng: không chỉ người lái/người ngồi trên xe mà còn có người đi bộ và người dẫn dắt vật nuôi. Vì cả hai nhóm đều tham gia vào giao thông nên chọn cả hai.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người điều khiển, người được chở trên phương tiện tham gia giao thông đường bộ; ý 2: Người điều khiển, dẫn dắt vật nuôi trên đường bộ; người đi bộ trên đường bộ. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":12,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ gồm những đối tượng nào dưới đây?","o":["Người điều khiển xe cơ giới, người điều khiển xe thô sơ.","Người điều khiển xe máy chuyên dùng.","Cả hai ý trên."],"a":3,"img":null,"ee":"Người điều khiển phương tiện gồm người lái xe cơ giới, xe thô sơ và người điều khiển xe máy chuyên dùng. Hai phương án đang chia cùng một nhóm thành hai phần nên cả hai đều đúng.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người điều khiển xe cơ giới, người điều khiển xe thô sơ; ý 2: Người điều khiển xe máy chuyên dùng. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":13,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển giao thông đường bộ được hiểu như thế nào là đúng?","o":["Là người điều khiển phương tiện tham gia giao thông đường bộ.","Là Cảnh sát giao thông và người được giao nhiệm vụ hướng dẫn giao thông trên đường bộ.","Là người tham gia giao thông đường bộ."],"a":2,"img":null,"ee":"Người điều khiển giao thông là CSGT hoặc người được giao nhiệm vụ hướng dẫn giao thông. Đây là người ra hiệu lệnh cho dòng xe, không phải bất kỳ người nào đang tham gia giao thông.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Là Cảnh sát giao thông và người được giao nhiệm vụ hướng dẫn giao thông trên đường bộ. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":14,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Dừng xe được hiểu như thế nào là đúng?","o":["Là trạng thái đứng yên của xe không giới hạn thời gian để cho người lên, xuống xe, xếp dỡ hàng hóa hoặc thực hiện công việc khác.","Là trạng thái đứng yên tạm thời của xe trong một khoảng thời gian cần thiết đủ để cho người lên xe, xuống xe, xếp dỡ hàng hóa, kiểm tra kỹ thuật xe hoặc hoạt động khác. Khi dừng xe không được tắt máy và không được rời khỏi vị trí lái, trừ trường hợp rời khỏi vị trí lái để đóng, mở cửa xe, xếp dỡ hàng hóa, kiểm tra kỹ thuật xe nhưng phải sử dụng phanh đỗ xe hoặc thực hiện biện pháp an toàn khác.","Là trạng thái đứng yên của xe không giới hạn thời gian giữa 02 lần vận chuyển hàng hóa hoặc hành khách."],"a":2,"img":null,"ee":"Dừng xe là đứng yên tạm thời trong thời gian cần thiết, ví dụ cho người lên xuống hoặc xếp dỡ hàng. Đỗ xe thì có thể đứng yên lâu hơn; đây là điểm dễ nhầm nhất giữa “dừng” và “đỗ”.","ed":"Đây là dạng câu định nghĩa nên cần giữ đủ phạm vi và điều kiện trong câu chữ. Nội dung đầy đủ mà bộ đề xác định là: “Là trạng thái đứng yên tạm thời của xe trong một khoảng thời gian cần thiết đủ để cho người lên xe, xuống xe, xếp dỡ hàng hóa, kiểm tra kỹ thuật xe hoặc hoạt động khác. Khi dừng xe không được tắt máy và không được rời khỏi vị trí lái, trừ…”. Phương án dễ nhầm là “Là trạng thái đứng yên của xe không giới hạn thời gian để cho người lên, xuống xe, xếp dỡ hàng hóa hoặc thực hiện…”, nhưng phương án đó thường thiếu một điều kiện hoặc làm hẹp/rộng khái niệm so với đáp án đầy đủ. Khi làm bài, ưu tiên phương án mô tả trọn vẹn khái niệm, không chọn câu chỉ đúng một phần."},{"id":15,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Đỗ xe được hiểu như thế nào là đúng?","o":["Là trạng thái đứng yên của xe có giới hạn thời gian trong một khoảng thời gian cần thiết đủ để cho người lên, xuống xe đó, xếp dỡ hàng hóa hoặc thực hiện công việc khác.","Là trạng thái đứng yên của xe không giới hạn thời gian. Khi đỗ xe, người điều khiển phương tiện tham gia giao thông đường bộ chỉ được rời khỏi xe khi đã sử dụng phanh đỗ xe hoặc thực hiện biện pháp an toàn khác. Xe đỗ trên đoạn đường dốc phải đánh lái về phía lề đường, chèn bánh."],"a":2,"img":null,"ee":"Đỗ xe là để xe đứng yên không giới hạn thời gian. Vì có thể rời vị trí lái nên phải dùng phanh đỗ; trên dốc còn phải chèn bánh/đánh lái để xe không tự trôi.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Là trạng thái đứng yên của xe không giới hạn thời gian. Khi đỗ xe, người điều khiển phương tiện tham gia giao thông đường bộ chỉ được rời khỏi xe khi đã sử dụng phanh đỗ xe hoặc thực hiện biện pháp an toàn khác. Xe đỗ trên đoạn đường…. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":16,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Đường cao tốc được hiểu như thế nào là đúng?","o":["Là một cấp kỹ thuật của đường bộ, chỉ dành cho một số loại xe cơ giới, xe máy chuyên dùng tham gia giao thông theo quy định của pháp luật. Có dải phân cách phân chia hai chiều xe chạy riêng biệt, không giao nhau cùng mức với một hoặc các đường khác, chỉ cho xe ra, vào ở những điểm nhất định. Có hàng rào bảo vệ, trang thiết bị phục vụ, bảo đảm giao thông liên tục, an toàn, rút ngắn thời gian hành trình.","Là đường nối liền Thủ đô Hà Nội với trung tâm hành chính cấp tỉnh; đường nối triển kinh tế- xã hội, bảo đảm quốc phòng, an ninh của vùng, khu vực."],"a":1,"img":null,"ee":"Hãy hình dung cao tốc là đường “khép kín”: hai chiều tách riêng, không giao cắt cùng mức, chỉ ra vào ở điểm quy định. Vì vậy mô tả kiểu “đường nối các tỉnh” không phải định nghĩa của cao tốc.","ed":"Câu này là phân loại đối tượng, nên không suy từ kích thước hay cảm giác “xe lớn/xe nhỏ”; phải xem đúng nhóm mà bộ đề liệt kê. Đáp án đúng gom đúng các đối tượng thuộc nhóm được hỏi: Là một cấp kỹ thuật của đường bộ, chỉ dành cho một số loại xe cơ giới, xe máy chuyên dùng tham gia giao thông theo quy định của pháp luật. Có dải phân cách phân chia hai chiều xe chạy riêng biệt, không giao nhau cùng mức với một hoặc…. Các phương án khác thường trộn thêm một loại phương tiện/người thuộc nhóm khác."},{"id":17,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Thiết bị an toàn cho trẻ em được hiểu như thế nào là đúng?","o":["Là thiết bị có đủ khả năng bảo đảm an toàn cho trẻ em ở tư thế ngồi hoặc nằm trên xe ô tô, được thiết kế để giảm nguy cơ chấn thương cho người dùng trong trường hợp xảy ra va chạm hoặc xe ô tô giảm tốc độ đột ngột, bằng cách hạn chế sự di chuyển của cơ thể trẻ em.","Là thiết bị có đủ khả năng bảo đảm an toàn cho trẻ em ở tư thế đứng hoặc nằm trên xe ô tô, được thiết kế để giảm nguy cơ chấn thương cho người dùng trong trường hợp xe ô tô lưu thông bình thường."],"a":1,"img":null,"ee":"Thiết bị an toàn trẻ em giữ cơ thể trẻ không bị văng mạnh khi va chạm hoặc phanh gấp. Trẻ phải được cố định ở tư thế ngồi/nằm phù hợp, không phải đứng tự do trên xe.","ed":"Đây là dạng câu định nghĩa nên cần giữ đủ phạm vi và điều kiện trong câu chữ. Nội dung đầy đủ mà bộ đề xác định là: “Là thiết bị có đủ khả năng bảo đảm an toàn cho trẻ em ở tư thế ngồi hoặc nằm trên xe ô tô, được thiết kế để giảm nguy cơ chấn thương cho người dùng trong trường hợp xảy ra va chạm hoặc xe ô tô giảm tốc độ đột ngột, bằng cách hạn chế sự di…”. Phương án dễ nhầm là “Là thiết bị có đủ khả năng bảo đảm an toàn cho trẻ em ở tư thế đứng hoặc nằm trên xe ô tô, được thiết kế để giảm…”, nhưng phương án đó thường thiếu một điều kiện hoặc làm hẹp/rộng khái niệm so với đáp án đầy đủ. Khi làm bài, ưu tiên phương án mô tả trọn vẹn khái niệm, không chọn câu chỉ đúng một phần."},{"id":18,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo chức năng phục vụ thì đường bộ được phân loại như thế nào?","o":["Đường chính, đường nhánh, đường gom, đường bên, đường dành cho giao thông công cộng, đường nội bộ, đường dành riêng cho người đi bộ, người đi xe đạp và các đường khác.","Đường chính, đường nhánh, đường gom, đường dành cho giao thông công cộng, đường nội bộ, đường dành riêng cho người đi bộ, người đi xe đạp và các đường khác.","Đường chính, đường nhánh, đường gom, đường bên, đường dành cho giao thông công cộng, đường dành riêng cho người đi bộ, người đi xe đạp và các đường khác."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Đường chính, đường nhánh, đường gom, đường bên, đường dành cho giao thông công cộng, đường nội bộ, đường dành riêng cho người đi bộ, người đi xe đạp và các đường khác. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Đây là dạng câu định nghĩa nên cần giữ đủ phạm vi và điều kiện trong câu chữ. Nội dung đầy đủ mà bộ đề xác định là: “Đường chính, đường nhánh, đường gom, đường bên, đường dành cho giao thông công cộng, đường nội bộ, đường dành riêng cho người đi bộ, người đi xe đạp và các đường khác”. Phương án dễ nhầm là “Đường chính, đường nhánh, đường gom, đường dành cho giao thông công cộng, đường nội bộ, đường dành riêng cho người…”, nhưng phương án đó thường thiếu một điều kiện hoặc làm hẹp/rộng khái niệm so với đáp án đầy đủ. Khi làm bài, ưu tiên phương án mô tả trọn vẹn khái niệm, không chọn câu chỉ đúng một phần."},{"id":19,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi nào dưới đây bị nghiêm cấm?","o":["Sử dụng xe đạp đi trên các tuyến quốc lộ.","Rải vật sắc nhọn, đổ chất gây trơn trượt trên đường bộ.","Cả hai ý trên."],"a":2,"img":null,"ee":"Rải đinh, vật sắc nhọn hoặc đổ chất làm trơn đường có thể khiến xe nổ lốp, mất lái nên bị nghiêm cấm. Đi xe đạp trên quốc lộ tự nó không phải hành vi bị cấm trong câu này.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Rải vật sắc nhọn, đổ chất gây trơn trượt trên đường bộ. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":20,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi đưa xe cơ giới, xe máy chuyên dùng tham gia giao thông đường bộ nào dưới đây bị cấm?","o":["Không có chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường.","Hết niên hạn sử dụng.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Không có chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường; (2) Hết niên hạn sử dụng. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Không có chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường; ý 2: Hết niên hạn sử dụng. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":21,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tổ chức đua xe được phép thực hiện khi nào?","o":["Trên đường phố không có người qua lại.","Được người dân ủng hộ.","Được cơ quan có thẩm quyền cấp phép."],"a":3,"img":null,"ee":"Đua xe chỉ hợp pháp khi CƠ QUAN CÓ THẨM QUYỀN CẤP PHÉP; đường vắng hay dân ủng hộ không thay được giấy phép","ed":"Bộ đề xác định nội dung đúng là: “Được cơ quan có thẩm quyền cấp phép”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Được người dân ủng hộ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":22,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi đua xe trái phép bị xử lý như thế nào?","o":["Chỉ bị nhắc nhở.","Tùy theo mức độ của hành vi vi phạm có thể bị xử lý hành chính hoặc xử lý"],"a":2,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Tùy theo mức độ của hành vi vi phạm có thể bị xử lý hành chính hoặc xử lý. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Tùy theo mức độ của hành vi vi phạm có thể bị xử lý hành chính hoặc xử lý”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Chỉ bị nhắc nhở” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":23,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi của người điều khiển xe ô tô và các loại xe tương tự khi tham gia giao thông đường bộ mà trong cơ thể có chất ma túy thì bị áp dụng hình thức xử phạt vi phạm hành chính nào dưới đây?","o":["Bị phạt tiền.","Bị tước giấy phép lái xe.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bị phạt tiền; (2) Bị tước giấy phép lái xe. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bị phạt tiền; ý 2: Bị tước giấy phép lái xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":24,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ mà trong máu hoặc hơi thở có nồng độ cồn có bị nghiêm cấm không?","o":["Bị nghiêm cấm.","Không bị nghiêm cấm.","Không bị nghiêm cấm, nếu nồng độ cồn trong máu ở mức nhẹ, có thể điều khiển phương tiện tham gia giao thông."],"a":1,"img":null,"ee":"Quy tắc là “đã lái xe thì không có nồng độ cồn”. Không có mức “uống ít vẫn được lái”, nên chỉ cần có cồn trong máu hoặc hơi thở là thuộc trường hợp bị cấm.","ed":"Cồn làm giảm khả năng phán đoán, kéo dài thời gian phản ứng và làm điều khiển phương tiện kém chính xác, nên bộ đề áp dụng nguyên tắc cấm khi điều khiển phương tiện. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Bị nghiêm cấm. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":25,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi của người điều khiển xe ô tô và các loại xe tương tự khi tham gia giao thông đường bộ mà trong máu hoặc hơi thở có nồng độ cồn thì bị áp dụng hình thức xử phạt vi phạm hành chính nào dưới đây?","o":["Bị phạt tiền.","Có thể bị tước giấy phép lái xe.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bị phạt tiền; (2) Có thể bị tước giấy phép lái xe. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bị phạt tiền; ý 2: Có thể bị tước giấy phép lái xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":26,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo Luật Phòng chống tác hại của rượu, bia, đối tượng nào dưới đây bị cấm sử dụng rượu, bia khi tham gia giao thông?","o":["Người điều khiển xe ô tô, xe mô tô, xe đạp, xe gắn máy.","Người được chở trên xe cơ giới.","Cả hai ý trên."],"a":1,"img":null,"ee":"Cồn làm chậm phản xạ và giảm khả năng phán đoán nên quy định cấm khi điều khiển phương tiện. Vì vậy nội dung bị cấm trong câu là: Người điều khiển xe ô tô, xe mô tô, xe đạp, xe gắn máy.","ed":"Cồn làm giảm khả năng phán đoán, kéo dài thời gian phản ứng và làm điều khiển phương tiện kém chính xác, nên bộ đề áp dụng nguyên tắc cấm khi điều khiển phương tiện. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Người điều khiển xe ô tô, xe mô tô, xe đạp, xe gắn máy. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":27,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi giao xe ô tô, mô tô cho người nào sau đây tham gia giao thông đường bộ bị nghiêm cấm?","o":["Người chưa đủ tuổi theo quy định.","Người không có giấy phép lái xe.","Người có giấy phép lái xe nhưng đã bị trừ hết 12 điểm.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Người chưa đủ tuổi theo quy định; 2) Người không có giấy phép lái xe; 3) Người có giấy phép lái xe nhưng đã bị trừ hết 12 điểm. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người chưa đủ tuổi theo quy định; ý 2: Người không có giấy phép lái xe; ý 3: Người có giấy phép lái xe nhưng đã bị trừ hết 12 điểm. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":28,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi nào sau đây bị nghiêm cấm?","o":["Điều khiển xe cơ giới lạng lách, đánh võng, rú ga liên tục khi tham gia giao thông trên đường.","Xúc phạm, đe dọa, cản trở, chống đối hoặc không chấp hành hiệu lệnh, hướng an toàn giao thông đường bộ.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Điều khiển xe cơ giới lạng lách, đánh võng, rú ga liên tục khi tham gia giao thông trên…; (2) Xúc phạm, đe dọa, cản trở, chống đối hoặc không chấp hành hiệu lệnh, hướng an toàn giao…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Điều khiển xe cơ giới lạng lách, đánh võng, rú ga liên tục khi tham gia giao thông trên đường; ý 2: Xúc phạm, đe dọa, cản trở, chống đối hoặc không chấp hành hiệu lệnh, hướng an toàn giao thông đường bộ. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":29,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Các hành vi nào sau đây bị cấm đối với phương tiện tham gia giao thông đường bộ?","o":["Cải tạo xe ô tô loại khác thành xe ô tô chở người phục vụ mục đích quốc phòng, an ninh.","Cải tạo trái phép; cố ý can thiệp làm sai lệch chỉ số trên đồng hồ báo quãng đường đã chạy của xe ô tô; cắt, hàn, tẩy xóa, đục sửa, đóng lại trái phép số khung, số động cơ của xe cơ giới, xe máy chuyên dùng."],"a":2,"img":null,"ee":"Quy định cấm nội dung này để tránh nguy hiểm hoặc gian lận trong giao thông. Ở câu này, hành vi/điều kiện bị cấm là: Cải tạo trái phép.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Cải tạo trái phép; cố ý can thiệp làm sai lệch chỉ số trên đồng hồ báo quãng đường đã chạy của xe ô tô; cắt, hàn, tẩy xóa, đục sửa, đóng lại trái phép số khung, số động cơ của xe cơ giới, xe máy chuyên dùng. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":30,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Hành vi nào sau đây bị cấm?","o":["Lắp đặt, sử dụng thiết bị âm thanh, ánh sáng trên xe cơ giới, xe máy chuyên dùng gây mất trật tự, an toàn giao thông đường bộ.","Cản trở người, phương tiện tham gia giao thông trên đường bộ; ném gạch, đất, đá, cát hoặc vật thể khác vào người, phương tiện đang tham gia giao thông trên đường bộ.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Lắp đặt, sử dụng thiết bị âm thanh, ánh sáng trên xe cơ giới, xe máy chuyên dùng gây mất…; (2) Cản trở người, phương tiện tham gia giao thông trên đường bộ. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Lắp đặt, sử dụng thiết bị âm thanh, ánh sáng trên xe cơ giới, xe máy chuyên dùng gây mất trật tự, an toàn giao thông đường bộ; ý 2: Cản trở người, phương tiện tham gia giao thông trên đường bộ; ném gạch, đất, đá, cát hoặc vật thể khác vào người, phương tiện đang tham gia giao…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":31,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc sản xuất, sử dụng, mua, bán trái phép biển số xe có bị nghiêm cấm hay không?","o":["Không bị nghiêm cấm.","Bị nghiêm cấm.","Bị nghiêm cấm tuỳ trường hợp."],"a":2,"img":null,"ee":"Quy định cấm nội dung này để tránh nguy hiểm hoặc gian lận trong giao thông. Ở câu này, hành vi/điều kiện bị cấm là: Bị nghiêm cấm.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Bị nghiêm cấm. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":32,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển phương tiện tham gia giao thông, những hành vi nào dưới đây bị nghiêm cấm?","o":["Thay đổi tốc độ của xe nhiều lần.","Điều khiển phương tiện sau 23 giờ trong ngày.","Lạng lách, đánh võng, rú ga liên tục."],"a":3,"img":null,"ee":"Các động tác này làm xe đổi hướng đột ngột, người khác khó đoán và rất dễ va chạm. Vì vậy nội dung bị cấm trong câu là: Lạng lách, đánh võng, rú ga liên tục.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Lạng lách, đánh võng, rú ga liên tục. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":33,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Có bao nhiêu nhóm biển báo hiệu đường bộ?","o":["Ba nhóm: Biển báo cấm, biển báo nguy hiểm và biển hiệu lệnh.","Bốn nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh và biển phụ.","Năm nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh, biển chỉ dẫn, biển phụ."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Năm nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh, biển chỉ dẫn, biển phụ. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Năm nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh, biển chỉ dẫn, biển phụ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Bốn nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh và biển phụ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":34,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại nơi có vạch kẻ đường hoặc tại nơi mà người đi bộ, xe lăn của người khuyết tật đang qua đường, người điều khiển phương tiện tham gia giao thông phải thực hiện như thế nào?","o":["Giảm tốc độ và nhường đường cho người đi bộ, xe lăn của người khuyết tật qua","Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn cho người đi bộ, xe lăn của người khuyết tật qua đường.","Quan sát, tăng tốc độ và điều khiển phương tiện nhanh chóng đi qua."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn cho người đi bộ, xe lăn của người khuyết tật qua đường.","ed":"Bộ đề xác định nội dung đúng là: “Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn cho người đi bộ, xe lăn của người khuyết tật qua đường”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Giảm tốc độ và nhường đường cho người đi bộ, xe lăn của người khuyết tật qua” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":35,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển xe mô tô phải phải quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn trong các trường hợp nào dưới đây?","o":["Đường hẹp, đường vòng, đường quanh co, đường đèo, dốc.","Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ.","Trời mưa, gió, sương, khói, bụi, mặt đường trơn trượt, lầy lội, có nhiều đất đá, vật liệu rơi vãi ảnh hưởng đến an toàn giao thông đường bộ.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Đường hẹp, đường vòng, đường quanh co, đường đèo, dốc; 2) Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; 3) Trời mưa, gió, sương, khói, bụi, mặt đường trơn trượt, lầy lội, có nhiều đất đá, vật liệu…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Đường hẹp, đường vòng, đường quanh co, đường đèo, dốc; ý 2: Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; ý 3: Trời mưa, gió, sương, khói, bụi, mặt đường trơn trượt, lầy lội, có nhiều đất đá, vật liệu rơi vãi ảnh hưởng đến an toàn giao thông đường bộ. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":36,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi gặp hiệu lệnh điều khiển của Cảnh sát giao thông như hình dưới đây thì người tham gia giao thông đường bộ phải đi như thế nào là đúng quy tắc giao thông?","o":["Người tham gia giao thông đường bộ ở các hướng phải dừng lại.","Người tham gia giao thông đường bộ ở các hướng được đi theo chiều gậy chỉ của Cảnh sát giao thông.","Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển được đi tất cả các hướng; người tham gia giao thông đường bộ ở phía bên phải và phía bên trái người điều khiển phải dừng lại.","Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển phải dừng lại; người tham gia giao thông đường bộ ở phía bên phải và phía bên trái người điều khiển được đi tất cả các hướng."],"a":4,"img":"q36.webp","ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển phải dừng lại. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển phải dừng lại; người tham gia giao thông đường bộ ở phía bên phải và phía bên trái người điều khiển được đi tất cả các hướng."},{"id":37,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi gặp hiệu lệnh điều khiển của Cảnh sát giao thông như hình dưới đây thì người tham gia giao thông đường bộ phải đi như thế nào là đúng quy tắc giao thông?","o":["Người tham gia giao thông đường bộ ở phía sau Cảnh sát giao thông được đi, các hướng khác phải dừng lại.","Người tham gia giao thông đường bộ được rẽ phải theo chiều mũi tên màu xanh ở bục Cảnh sát giao thông.","Người tham gia giao thông đường bộ ở tất cả các hướng phải dừng lại, trừ các xe đã ở trong khu vực giao nhau.","Người tham gia giao thông đường bộ ở phía trước Cảnh sát giao thông phải dừng lại, các hướng khác được đi."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Người tham gia giao thông đường bộ ở tất cả các hướng phải dừng lại, trừ các xe đã ở trong khu vực giao nhau. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Người tham gia giao thông đường bộ ở tất cả các hướng phải dừng lại, trừ các xe đã ở trong khu vực giao nhau."},{"id":38,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi hiệu lệnh của người điều khiển giao thông trái với tín hiệu đèn giao thông hoặc biển báo hiệu đường bộ thì người tham gia giao thông đường bộ phải chấp hành báo hiệu đường bộ nào dưới đây?","o":["Theo hiệu lệnh của người điều khiển giao thông.","Theo tín hiệu đèn giao thông.","Theo biển báo hiệu đường bộ."],"a":1,"img":null,"ee":"Khi CSGT/người điều khiển giao thông ra hiệu khác với đèn hoặc biển, nghe người điều khiển giao thông trước. Lý do là họ đang xử lý tình huống thực tế ngay tại nút giao.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Theo hiệu lệnh của người điều khiển giao thông."},{"id":39,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi ở một vị trí vừa có biển báo hiệu đặt cố định vừa có biển báo hiệu tạm thời mà hai biển có ý nghĩa khác nhau, người tham gia giao thông đường bộ phải chấp hành hiệu lệnh của biển báo hiệu nào?","o":["Biển báo hiệu đặt cố định.","Biển báo hiệu tạm thời.","Theo quyết định của người tham gia giao thông nhưng phải bảo đảm an toàn."],"a":2,"img":null,"ee":"Biển tạm thời phản ánh cách tổ chức giao thông đang áp dụng ngay lúc đó, ví dụ đang sửa đường. Vì thế nếu biển tạm khác biển cố định thì đi theo biển tạm.","ed":"Bộ đề xác định nội dung đúng là: “Biển báo hiệu tạm thời”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Biển báo hiệu đặt cố định” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":40,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại nơi đường giao nhau, khi đèn điều khiển giao thông có tín hiệu màu vàng, người điều khiển phương tiện tham gia giao thông phải chấp hành như thế nào là đúng quy tắc giao thông?","o":["Dừng lại trước vạch dừng; trường hợp đang đi trên vạch dừng hoặc đã đi qua vạch dừng mà tín hiệu đèn màu vàng thì được đi tiếp; trường hợp tín hiệu đèn màu vàng nhấp nháy, người điều khiển phương tiện tham gia giao thông đường bộ được đi nhưng phải quan sát, giảm tốc độ hoặc dừng lại nhường đường cho người đi bộ, xe lăn của người khuyết tật qua đường hoặc các phương tiện khác.","Tăng tốc độ nhanh chóng vượt qua nút giao.","Quan sát, giảm tốc độ, từ từ vượt qua nút giao."],"a":1,"img":null,"ee":"Đèn vàng sáng liên tục: dừng trước vạch nếu còn dừng an toàn được; nếu đã ở trên hoặc qua vạch thì đi tiếp. Đèn vàng nhấp nháy: được đi nhưng phải chậm và quan sát để nhường khi cần.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Dừng lại trước vạch dừng; trường hợp đang đi trên vạch dừng hoặc đã đi qua vạch dừng mà tín hiệu đèn màu vàng thì được đi tiếp; trường hợp tín hiệu đèn màu vàng nhấp nháy, người điều khiển phương tiện tham gia giao…."},{"id":41,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe trên đường cần chấp hành quy định về tốc độ tối đa như thế nào?","o":["Chỉ lớn hơn tốc độ tối đa cho phép khi đường vắng.","Chỉ lớn hơn tốc độ tối đa cho phép khi vào ban đêm.","Không vượt quá tốc độ tối đa cho phép."],"a":3,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Không vượt quá tốc độ tối đa cho phép.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Không vượt quá tốc độ tối đa cho phép."},{"id":42,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi chở trẻ em dưới 10 tuổi và chiều cao dưới 1,35 mét trên xe ô tô, người lái xe phải thực hiện quy tắc nào dưới đây để bảo đảm an toàn?","o":["Không được cho trẻ em ngồi cùng hàng ghế với người lái xe, trừ loại xe ô tô chỉ có một hàng ghế; người lái xe phải sử dụng, hướng dẫn sử dụng thiết bị an toàn phù hợp cho trẻ em.","Cho trẻ em ngồi cùng hàng ghế với người lái xe, người lái xe phải sử dụng, hướng dẫn sử dụng thiết bị an toàn phù hợp cho trẻ em."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Không được cho trẻ em ngồi cùng hàng ghế với người lái xe, trừ loại xe ô tô chỉ có một hàng ghế. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Không được cho trẻ em ngồi cùng hàng ghế với người lái xe, trừ loại xe ô tô chỉ có một hàng ghế; người lái xe phải sử dụng, hướng dẫn sử dụng thiết bị an toàn phù hợp cho trẻ em”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Cho trẻ em ngồi cùng hàng ghế với người lái xe, người lái xe phải sử dụng, hướng dẫn sử dụng thiết bị an toàn phù…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":43,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Phương tiện tham gia giao thông đường bộ di chuyển với tốc độ thấp hơn phải đi như thế nào?","o":["Đi về bên trái theo chiều đi của mình.","Đi về bên phải theo chiều đi của mình.","Đi ở bất cứ bên nào nhưng phải bấm đèn cảnh báo nguy hiểm để báo hiệu cho các phương tiện khác."],"a":2,"img":null,"ee":"Xe chạy chậm đi bên phải để chừa phía trái cho dòng xe nhanh hơn. Đây là logic chung giúp các xe không cản nhau trên cùng chiều đường.","ed":"Bộ đề xác định nội dung đúng là: “Đi về bên phải theo chiều đi của mình”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đi về bên trái theo chiều đi của mình” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":44,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên một chiều đường có vạch kẻ phân làn đường, người lái xe cơ giới, xe máy chuyên dùng phải điều khiển xe đi trên làn đường nào?","o":["Đi trên làn đường bên phải trong cùng.","Đi trên làn đường bên trái.","Đi ở bất cứ làn nào nhưng phải bảo đảm tốc độ cho phép."],"a":2,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Đi trên làn đường bên trái. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Đi trên làn đường bên trái”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đi trên làn đường bên phải trong cùng” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":45,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe phải giảm tốc độ, có tín hiệu rẽ phải và đi sát về bên phải của phần đường xe chạy trong các trường hợp nào dưới đây?","o":["Khi xe chạy phía trước có tín hiệu vượt xe khác.","Khi phía trước có xe chạy ngược chiều.","Khi xe sau xin vượt nếu đủ điều kiện an toàn.","Khi xe sau có tín hiệu vượt bên phải."],"a":3,"img":null,"ee":"Xe sau xin vượt và đủ an toàn thì xe trước phải “nhường khoảng trống”: giảm tốc, báo phải và đi sát bên phải. Không được tăng tốc để tranh đường với xe đang vượt.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Khi xe sau xin vượt nếu đủ điều kiện an toàn."},{"id":46,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Vượt xe là gì?","o":["Là tình huống giao thông trên đường mà mỗi chiều đường xe chạy chỉ có một làn đường dành cho xe cơ giới, xe đi phía sau di chuyển sang bên trái để di chuyển lên trước xe phía trước.","Là tình huống giao thông trên đường có từ hai làn đường dành cho xe cơ giới lên trước xe phía trước theo quy tắc sử dụng làn đường."],"a":1,"img":null,"ee":"Rút định nghĩa còn CƠ GIỚI → LÀN → TRÁI. Đáp án thiếu một mắt xích trong cụm này thì loại","ed":"Đây là dạng câu định nghĩa nên cần giữ đủ phạm vi và điều kiện trong câu chữ. Nội dung đầy đủ mà bộ đề xác định là: “Là tình huống giao thông trên đường mà mỗi chiều đường xe chạy chỉ có một làn đường dành cho xe cơ giới, xe đi phía sau di chuyển sang bên trái để di chuyển lên trước xe phía trước”. Phương án dễ nhầm là “Là tình huống giao thông trên đường có từ hai làn đường dành cho xe cơ giới lên trước xe phía trước theo quy tắc…”, nhưng phương án đó thường thiếu một điều kiện hoặc làm hẹp/rộng khái niệm so với đáp án đầy đủ. Khi làm bài, ưu tiên phương án mô tả trọn vẹn khái niệm, không chọn câu chỉ đúng một phần."},{"id":47,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe được phép vượt xe trên cầu hẹp có một làn đường, đường cong có tầm nhìn bị hạn chế hay không?","o":["Được phép vượt khi đường vắng.","Không được phép vượt.","Được phép vượt khi có việc gấp."],"a":2,"img":null,"ee":"Cầu hẹp một làn hoặc đường cong khuất tầm nhìn đều không đủ điều kiện để vượt an toàn. Bạn có thể gặp xe ngược chiều nhưng không còn chỗ hoặc thời gian để tránh.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Không được phép vượt. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":48,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Muốn vượt xe phía trước, người lái xe mô tô phải có tín hiệu như thế nào dưới đây để bảo đảm an toàn?","o":["Bấm còi liên tục để xe phía trước biết xe mình xin vượt.","Rú ga liên tục để xe phía trước biết xe mình xin vượt.","Báo hiệu nhấp nháy bằng đèn chiếu sáng phía trước hoặc còi."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Báo hiệu nhấp nháy bằng đèn chiếu sáng phía trước hoặc còi. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Báo hiệu nhấp nháy bằng đèn chiếu sáng phía trước hoặc còi."},{"id":49,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi lái xe trong khu đông dân cư, khu vực cơ sở khám bệnh, chữa bệnh trừ các khu vực có biển cấm sử dụng còi, người lái xe được sử dụng còi trong thời gian nào?","o":["Từ 22 giờ ngày hôm trước đến 05 giờ ngày hôm sau.","Từ 05 giờ đến 22 giờ.","Từ 23 giờ ngày hôm trước đến 05 giờ sáng hôm sau."],"a":2,"img":null,"ee":"Trong đô thị/khu khám chữa bệnh, thời gian được dùng còi (nơi không cấm): 05:00 - 22:00","ed":"Bộ đề xác định nội dung đúng là: “Từ 05 giờ đến 22 giờ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Từ 22 giờ ngày hôm trước đến 05 giờ ngày hôm sau” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":50,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Phương tiện tham gia giao thông đường bộ chỉ được sử dụng tín hiệu còi trong các trường hợp nào sau đây?","o":["Để báo hiệu cho người tham gia giao thông đường bộ khi xuất hiện tình huống có thể mất an toàn giao thông hoặc báo hiệu chuẩn bị vượt xe.","Để báo hiệu cho người tham gia giao thông đường bộ từ 22 giờ ngày hôm trước đến 05 giờ ngày hôm sau trong khu đông dân cư, khu vực cơ sở khám bệnh, chữa bệnh, trừ xe ưu tiên.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Để báo hiệu cho người tham gia giao thông đường bộ khi xuất hiện tình huống có thể mất an toàn giao thông hoặc báo hiệu chuẩn bị vượt xe. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Để báo hiệu cho người tham gia giao thông đường bộ khi xuất hiện tình huống có thể mất an toàn giao thông hoặc báo hiệu chuẩn bị vượt xe."},{"id":51,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe sử dụng đèn như thế nào khi đi trên các đoạn đường qua khu đông dân cư có hệ thống chiếu sáng đang hoạt động?","o":["Chỉ bật đèn chiếu xa (đèn pha).","Bật đèn chiếu xa (đèn pha) khi đường vắng, bật đèn chiếu gần (đèn cốt) khi có xe đi ngược chiều.","Chỉ bật đèn chiếu gần (đèn cốt)."],"a":3,"img":null,"ee":"Có chiếu sáng trong khu đông dân cư → CHỈ ĐÈN CỐT, không bật pha","ed":"Bộ đề xác định nội dung đúng là: “Chỉ bật đèn chiếu gần (đèn cốt)”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Chỉ bật đèn chiếu xa (đèn pha)” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":52,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển phương tiện tham gia giao thông, hành vi nào sau đây bị cấm?","o":["Dùng tay cầm và sử dụng điện thoại hoặc thiết bị điện tử khác.","Chỉ được chở người trên thùng xe ô tô chở hàng trong trường hợp chở người đi"],"a":1,"img":null,"ee":"Cầm điện thoại làm mất tay điều khiển và phân tán mắt khỏi đường. Vì vậy nội dung bị cấm trong câu là: Dùng tay cầm và sử dụng điện thoại hoặc thiết bị điện tử khác.","ed":"Cầm và sử dụng điện thoại vừa chiếm tay điều khiển vừa kéo mắt và sự chú ý khỏi đường, nên làm tăng rõ nguy cơ xử lý chậm. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Dùng tay cầm và sử dụng điện thoại hoặc thiết bị điện tử khác. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":53,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe không được vượt xe khác khi gặp trường hợp nào dưới đây?","o":["Trên cầu hẹp có một làn đường; nơi đường giao nhau, đường bộ giao nhau cùng mức với đường sắt; khi gặp xe ưu tiên.","Trên cầu có từ 02 làn xe trở lên.","Trên đường có 02 làn đường được phân chia làn bằng vạch kẻ nét đứt."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Trên cầu hẹp có một làn đường. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Trên cầu hẹp có một làn đường; nơi đường giao nhau, đường bộ giao nhau cùng mức với đường sắt; khi gặp xe ưu tiên."},{"id":54,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Nơi nào cấm quay đầu xe?","o":["Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, gầm cầu vượt, ngầm.","Tại nơi đường bộ giao nhau cùng mức với đường sắt, đường hẹp, đường dốc, đoạn đường cong tầm nhìn bị che khuất, trên đường cao tốc, trong hầm đường bộ, trên đường một chiều.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, gầm cầu vượt, ngầm; (2) Tại nơi đường bộ giao nhau cùng mức với đường sắt, đường hẹp, đường dốc, đoạn đường cong…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, gầm cầu vượt, ngầm; ý 2: Tại nơi đường bộ giao nhau cùng mức với đường sắt, đường hẹp, đường dốc, đoạn đường cong tầm nhìn bị che khuất, trên đường cao tốc, trong hầm đường…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":55,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe không được quay đầu xe trong các trường hợp nào dưới đây?","o":["Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, trên đường cao tốc, tại nơi đường bộ giao nhau cùng mức với đường sắt, đường hẹp, đường dốc.","Ở phía trước hoặc phía sau của phần đường dành cho người đi bộ qua đường, trên đường quốc lộ.","Cả hai ý trên."],"a":1,"img":null,"ee":"Gạch chân hướng trước: CAO TỐC → ĐƯỜNG SẮT → Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, trên đường cao tốc, tại nơi…","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Ở phần đường dành cho người đi bộ qua đường, trên cầu, đầu cầu, trên đường cao tốc, tại nơi đường bộ giao nhau cùng mức với đường sắt, đường hẹp, đường dốc."},{"id":56,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trước khi cho xe chuyển hướng, người lái xe phải làm gì để bảo đảm an toàn giao thông?","o":["Phải quan sát, bảo đảm khoảng cách an toàn với xe phía sau.","Giảm tốc độ và có tín hiệu báo hướng rẽ.","Chuyển dần sang làn gần nhất với hướng rẽ. Khi bảo đảm an toàn, không gây trở ngại cho người và phương tiện khác mới được chuyển hướng.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Phải quan sát, bảo đảm khoảng cách an toàn với xe phía sau; 2) Giảm tốc độ và có tín hiệu báo hướng rẽ; 3) Chuyển dần sang làn gần nhất với hướng rẽ. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Phải quan sát, bảo đảm khoảng cách an toàn với xe phía sau; ý 2: Giảm tốc độ và có tín hiệu báo hướng rẽ; ý 3: Chuyển dần sang làn gần nhất với hướng rẽ. Khi bảo đảm an toàn, không gây trở ngại cho người và phương tiện khác mới được chuyển hướng. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":57,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi chuyển làn đường, người lái xe phải bật đèn tín hiệu báo rẽ như thế nào là đúng quy tắc giao thông?","o":["Khi bắt đầu chuyển làn đường.","Trước khi thay đổi làn đường.","Sau khi thay đổi làn đường."],"a":2,"img":null,"ee":"Xi-nhan phải bật trước khi đổi làn để xe phía sau kịp biết ý định của bạn. Bật khi xe đã sang làn thì thông báo đã quá muộn.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Trước khi thay đổi làn đường."},{"id":58,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe không được lùi xe ở những khu vực nào dưới đây?","o":["Ở đường một chiều, khu vực cấm dừng, trên phần đường dành cho người đi bộ qua đường.","Nơi đường bộ giao nhau, đường bộ giao nhau cùng mức với đường sắt.","Nơi tầm nhìn bị che khuất, trong hầm đường bộ, trên đường cao tốc.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Ở đường một chiều, khu vực cấm dừng, trên phần đường dành cho người đi bộ qua đường; 2) Nơi đường bộ giao nhau, đường bộ giao nhau cùng mức với đường sắt; 3) Nơi tầm nhìn bị che khuất, trong hầm đường bộ, trên đường cao tốc. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Ở đường một chiều, khu vực cấm dừng, trên phần đường dành cho người đi bộ qua đường; ý 2: Nơi đường bộ giao nhau, đường bộ giao nhau cùng mức với đường sắt; ý 3: Nơi tầm nhìn bị che khuất, trong hầm đường bộ, trên đường cao tốc. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":59,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông không được dừng xe, đỗ xe ở những vị trí nào sau đây?","o":["Trên miệng cống thoát nước, miệng hầm của đường điện thoại, điện cao thế, chỗ dành riêng cho xe chữa cháy lấy nước.","Trong phạm vi an toàn của đường sắt.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Trên miệng cống thoát nước, miệng hầm của đường điện thoại, điện cao thế, chỗ dành riêng…; (2) Trong phạm vi an toàn của đường sắt. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Trên miệng cống thoát nước, miệng hầm của đường điện thoại, điện cao thế, chỗ dành riêng cho xe chữa cháy lấy nước; ý 2: Trong phạm vi an toàn của đường sắt. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":60,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường phố, người điều khiển phương tiện tham gia giao thông đường bộ được dừng xe, đỗ xe sát theo lề đường, vỉa hè phía bên phải theo chiều đi của mình; bánh xe gần nhất không được cách xa lề đường, vỉa hè không quá bao nhiêu mét trong các trường hợp dưới đây và không gây cản trở, nguy hiểm cho người và phương tiện tham gia giao thông đường bộ?","o":["0,25 mét.","0,3 mét.","0,4 mét.","0,5 mét."],"a":1,"img":null,"ee":"0,25 m chính là 25 cm - chỉ khoảng một gang tay lớn. Quy định này buộc xe đỗ sát lề, tránh chiếm quá nhiều phần đường xe chạy.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: 0,25 mét."},{"id":61,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi dừng, đỗ xe trên đường phố hẹp, người lái xe ô tô phải dừng, đỗ xe ở vị trí cách xe ô tô đang đỗ ngược chiều khoảng cách tối thiểu là bao nhiêu mét trong các trường hợp dưới đây để bảo đảm an toàn?","o":["10 mét.","15 mét.","20 mét.","25 mét."],"a":3,"img":null,"ee":"Hai xe đỗ đối diện trên đường hẹp phải cách nhau ít nhất 20 m để vẫn còn khoảng trống cho xe khác đi qua và tránh nhau an toàn.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: 20 mét."},{"id":62,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ không được dừng xe, đỗ xe tại các vị trí nào sau đây?","o":["Nơi có lề đường rộng hoặc khu đất ở bên ngoài phần đường xe chạy.","Song song cùng chiều với một xe khác đang dừng, đỗ trên đường; trên đoạn đường cong hoặc gần đầu dốc mà tầm nhìn bị che khuất; bên trái đường một chiều.","Cả hai ý trên."],"a":2,"img":null,"ee":"Khi tầm nhìn kém, người lái phát hiện nguy hiểm muộn hơn nên cần giảm tốc hoặc dừng. Do đó phương án phù hợp là: Song song cùng chiều với một xe khác đang dừng, đỗ trên đường.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Song song cùng chiều với một xe khác đang dừng, đỗ trên đường; trên đoạn đường cong hoặc gần đầu dốc mà tầm nhìn bị che khuất; bên trái đường một chiều."},{"id":63,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy có được phép sử dụng xe để kéo hoặc đẩy các phương tiện khác khi tham gia giao thông không?","o":["Được phép.","Nếu phương tiện được kéo, đẩy có khối lượng nhỏ hơn phương tiện của mình.","Tùy trường hợp.","Không được phép."],"a":4,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Không được phép.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Không được phép. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":64,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy, những hành vi nào sau đây không được phép?","o":["Buông cả hai tay; đứng, nằm trên xe điều khiển xe; sử dụng chân chống hoặc vật khác quệt xuống đường khi xe đang chạy.","Chở tối đa hai người phía sau khi chở người bệnh đi cấp cứu, áp giải người có hành vi vi phạm pháp luật, trẻ em dưới 12 tuổi và người già yếu hoặc người khuyết tật."],"a":1,"img":null,"ee":"Buông hai tay làm mất khả năng điều khiển hướng và phanh kịp thời. Vì vậy nội dung bị cấm trong câu là: Buông cả hai tay.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Buông cả hai tay; đứng, nằm trên xe điều khiển xe; sử dụng chân chống hoặc vật khác quệt xuống đường khi xe đang chạy. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":65,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy, những hành vi nào sau đây không được phép?","o":["Buông cả hai tay; sử dụng xe để kéo, đẩy xe khác, vật khác; sử dụng chân chống hoặc vật khác quệt xuống đường khi xe đang chạy.","Sử dụng xe để chở người hoặc hàng hóa; để chân chạm xuống đất khi khởi hành.","Đội mũ bảo hiểm; chạy xe đúng tốc độ quy định và chấp hành đúng quy tắc giao thông đường bộ.","Chở người ngồi sau dưới 16 tuổi."],"a":1,"img":null,"ee":"Buông hai tay làm mất khả năng điều khiển hướng và phanh kịp thời. Vì vậy nội dung bị cấm trong câu là: Buông cả hai tay.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Buông cả hai tay; sử dụng xe để kéo, đẩy xe khác, vật khác; sử dụng chân chống hoặc vật khác quệt xuống đường khi xe đang chạy. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":66,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người được chở trên xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy khi tham gia giao thông đường bộ không được thực hiện hành vi nào sau đây?","o":["Mang, vác vật cồng kềnh.","Bám, kéo hoặc đẩy các phương tiện khác.","Dùng tay cầm điện thoại hoặc các thiết bị điện tử khác.","Ý 1 và ý 2."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Mang, vác vật cồng kềnh; (2) Bám, kéo hoặc đẩy các phương tiện khác. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 2.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Mang, vác vật cồng kềnh; ý 2: Bám, kéo hoặc đẩy các phương tiện khác. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 2.”."},{"id":67,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người được chở trên xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy khi tham gia giao thông đường bộ có được bám, kéo hoặc đẩy các phương tiện khác không?","o":["Được phép.","Được bám trong trường hợp phương tiện của mình bị hỏng.","Được kéo, đẩy trong trường hợp phương tiện khác bị hỏng.","Không được phép."],"a":4,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Không được phép.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Không được phép. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":68,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe, người được chở trên xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy phải thực hiện quy định nào dưới đây?","o":["Đội mũ bảo hiểm theo đúng quy chuẩn kỹ thuật quốc gia và cài quai đúng quy cách.","Người lái xe phải đội mũ bảo hiểm, người được chở trên xe không nhất thiết phải đội mũ bảo hiểm.","Phải đội mũ bảo hiểm nhưng không nhất thiết phải cài quai."],"a":1,"img":null,"ee":"Cả người lái và người ngồi sau xe mô tô/xe gắn máy đều phải đội mũ đạt chuẩn và cài quai đúng cách. Đội mũ mà không
