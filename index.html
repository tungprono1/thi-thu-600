hình của câu này, hai biển thỏa điều kiện là biển 1 và biển 2."},{"id":303,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cấm máy kéo?","o":["Biển 1.","Biển 2 và biển 3.","Biển 1 và biển 3.","Cả ba biển."],"a":2,"img":"q303.webp","ee":"Máy kéo là một nhóm phương tiện riêng. Câu này cần xem biển nào có hình/phạm vi cấm máy kéo; trong hình là Biển 2 và Biển 3.","ed":"Bước 1 xác định loại phương tiện đang hỏi; bước 2 xác định phạm vi của từng biển. Nguyên tắc quan trọng: biển cấm ô tô nói chung bao gồm các loại ô tô như xe con, xe tải, xe khách; nhưng biển cấm riêng xe tải/xe con/taxi thì chỉ xét đúng đối tượng của biển đó. Đối chiếu hình câu này, đáp án là: Biển 2 và biển 3."},{"id":304,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào báo hiệu cấm xe mô tô ba bánh chở hàng đi qua?","o":["Biển 1 và biển 2.","Biển 1 và biển 3.","Biển 2 và biển 3."],"a":1,"img":"q304.webp","ee":"Đừng gộp “mô tô ba bánh chở hàng” với mô tô hai bánh. Trong nhóm hình này, Biển 1 và Biển 2 đều có phạm vi cấm đúng loại xe ba bánh chở hàng.","ed":"Bước 1 xác định loại phương tiện đang hỏi; bước 2 xác định phạm vi của từng biển. Nguyên tắc quan trọng: biển cấm ô tô nói chung bao gồm các loại ô tô như xe con, xe tải, xe khách; nhưng biển cấm riêng xe tải/xe con/taxi thì chỉ xét đúng đối tượng của biển đó. Đối chiếu hình câu này, đáp án là: Biển 1 và biển 2."},{"id":305,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào dưới đây xe gắn máy được phép đi vào?","o":["Biển 1.","Biển 2.","Cả hai biển."],"a":3,"img":"q305.webp","ee":"Xe gắn máy khác xe mô tô. Hai biển trong câu không cấm xe gắn máy nên xe gắn máy đều được đi vào ở cả hai biển.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Biển 1; ý 2: Biển 2. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai biển.”."},{"id":306,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào báo hiệu cấm xe mô tô hai bánh đi vào?","o":["Biển 1.","Biển 2.","Biển 3."],"a":1,"img":"q306.webp","ee":"Biển 1 cấm mô tô hai bánh. Khi làm nhóm này, xác định đúng loại xe trên hình biển trước; “mô tô” và “xe gắn máy” không phải lúc nào cũng bị cấm giống nhau.","ed":"Bước 1 xác định loại phương tiện đang hỏi; bước 2 xác định phạm vi của từng biển. Nguyên tắc quan trọng: biển cấm ô tô nói chung bao gồm các loại ô tô như xe con, xe tải, xe khách; nhưng biển cấm riêng xe tải/xe con/taxi thì chỉ xét đúng đối tượng của biển đó. Đối chiếu hình câu này, đáp án là: Biển 1."},{"id":307,"ch":5,"ct":"Báo hiệu đường bộ","q":"Khi gặp biển nào thì xe mô tô hai bánh được đi vào?","o":["Không biển nào.","Biển 1 và biển 2.","Biển 2 và biển 3.","Cả ba biển."],"a":3,"img":"q307.webp","ee":"Biển 1 là biển cấm mô tô; Biển 2 và 3 không cấm mô tô nên mô tô được đi ở hai biển đó. Cách làm là loại biển có đúng biểu tượng loại xe đang hỏi.","ed":"Đây là câu hỏi “được phép”, nên cần loại những biển đang cấm đúng phương tiện/hướng được hỏi. Nếu biển không áp dụng cho xe hoặc hành vi đó thì xe vẫn được đi, nhưng phải đọc đúng phạm vi từng biển. Đối chiếu hình, đáp án là: Biển 2 và biển 3."},{"id":308,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cho phép xe ô tô con được vượt?","o":["Biển 1 và biển 2.","Biển 2.","Biển 1 và biển 3.","Biển 2 và biển 3."],"a":3,"img":"q308.webp","ee":"Đây là câu nhận dạng biển: nhìn biểu tượng chính trước, sau đó mới xét con số/biển phụ nếu có. Biển phù hợp với mô tả của câu là: Biển 1 và biển 3.","ed":"Đọc biển theo bốn bước: hình dạng → màu nền/viền → biểu tượng chính → biển phụ đi kèm. Sau đó đối chiếu đúng nội dung câu hỏi là cấm, nguy hiểm, hiệu lệnh hay chỉ dẫn. Theo hình của câu này, đáp án đúng là: Biển 1 và biển 3."},{"id":309,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào không cho phép xe ô tô con vượt?","o":["Biển 1.","Biển 2.","Biển 3."],"a":2,"img":"q309.webp","ee":"Đây là câu “ô tô con có được vượt không”. Biển 2 cấm vượt đối với ô tô con, nên gặp biển này xe con không được vượt dù phía trước có vẻ trống.","ed":"Đọc biển theo bốn bước: hình dạng → màu nền/viền → biểu tượng chính → biển phụ đi kèm. Sau đó đối chiếu đúng nội dung câu hỏi là cấm, nguy hiểm, hiệu lệnh hay chỉ dẫn. Theo hình của câu này, đáp án đúng là: Biển 2."},{"id":310,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cấm xe ô tô tải vượt?","o":["Biển 1.","Biển 1 và biển 2.","Biển 1 và biển 3.","Biển 2 và biển 3."],"a":4,"img":"q310.webp","ee":"Với biển cấm xe, hãy hỏi: “loại xe này có nằm trong nhóm bị cấm không?”. Biển cấm ô tô nói chung cũng cấm xe tải/xe khách/xe con vì chúng đều là ô tô; còn biển cấm riêng loại nào thì chỉ xét đúng loại đó. Trong câu này: Biển 2 và biển 3.","ed":"Bước 1 xác định loại phương tiện đang hỏi; bước 2 xác định phạm vi của từng biển. Nguyên tắc quan trọng: biển cấm ô tô nói chung bao gồm các loại ô tô như xe con, xe tải, xe khách; nhưng biển cấm riêng xe tải/xe con/taxi thì chỉ xét đúng đối tượng của biển đó. Đối chiếu hình câu này, đáp án là: Biển 2 và biển 3."},{"id":311,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cấm xe tải vượt?","o":["Biển 1.","Biển 2.","Cả hai biển."],"a":3,"img":"q311.webp","ee":"Hai ý đều đúng: (1) Biển 1; (2) Biển 2. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai biển.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Biển 1; ý 2: Biển 2. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai biển.”."},{"id":312,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào xe ô tô con được phép vượt?","o":["Biển 1.","Biển 2."],"a":2,"img":"q312.webp","ee":"Xét ngược lại biển cấm: nếu biển không cấm đúng loại xe/hướng đang hỏi thì xe được đi. Đối chiếu các biển trong hình, đáp án là: Biển 2.","ed":"Đây là câu hỏi “được phép”, nên cần loại những biển đang cấm đúng phương tiện/hướng được hỏi. Nếu biển không áp dụng cho xe hoặc hành vi đó thì xe vẫn được đi, nhưng phải đọc đúng phạm vi từng biể  quả là: Xe của bạn và xe con, xe tải."},{"id":552,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Khi muốn vượt xe tải, người lái xe phải làm gì là đúng quy tắc giao thông?","o":["Tăng tốc cho xe chạy vượt qua.","Bật tín hiệu báo hiệu bằng đèn hoặc còi, khi đủ điều kiện an toàn, tăng tốc cho xe chạy vượt qua.","Đánh lái sang làn bên trái và tăng tốc cho xe chạy vượt qua."],"a":2,"img":"q552.webp","ee":"Vượt xe chỉ được thực hiện khi vạch/biển cho phép, tầm nhìn đủ và không có xung đột phía trước. Đối chiếu các điều kiện đó trong hình, kết luận là: Bật tín hiệu báo hiệu bằng đèn hoặc còi, khi đủ điều kiện an toàn, tăng tốc cho xe chạy vượt qua.","ed":"Quan sát vạch đường, xe đang vượt, xe ngược chiều và khoảng trống phía trước. Chỉ khi toàn bộ điều kiện cho phép mới được vượt; nếu có một xung đột đang diễn ra thì phải chờ. Đối chiếu hình, kết luận đúng là: Bật tín hiệu báo hiệu bằng đèn hoặc còi, khi đủ điều kiện an toàn, tăng tốc cho xe chạy vượt qua."},{"id":553,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Theo tín hiệu đèn, xe nào phải dừng lại là đúng quy tắc giao thông?","o":["Xe khách, xe mô tô.","Xe tải, xe mô tô.","Xe con, xe tải."],"a":3,"img":"q553.webp","ee":"Vị trí đúng/sai của chính hình: Xe con, xe tải. Rà lề đường, vạch dừng và chỗ che khuất trước khi chọn","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe con, xe tải."},{"id":554,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Trong hình dưới, những xe nào chấp hành quy tắc giao thông?","o":["Xe tải ( D), xe con (B).","Xe con (A), xe con (C), xe con (E), xe buýt (G).","Xe con (A), xe con (B), xe tải (D)."],"a":2,"img":"q554.webp","ee":"Đầu tiên đọc đèn, biển, vạch và hướng mũi tên trong hình; sau đó đối chiếu từng xe với phần đường/hướng được phép. Theo hình này, đáp án là: Xe con (A), xe con (C), xe con (E), xe buýt (G).","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe con (A), xe con (C), xe con (E), xe buýt (G)."},{"id":555,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Người lái xe có được phép vượt xe tải để đi thẳng trong trường hợp này không?","o":["Được vượt.","Cấm vượt."],"a":2,"img":"q555.webp","ee":"Vượt xe chỉ được thực hiện khi vạch/biển cho phép, tầm nhìn đủ và không có xung đột phía trước. Đối chiếu các điều kiện đó trong hình, kết luận là: Cấm vượt.","ed":"Quan sát vạch đường, xe đang vượt, xe ngược chiều và khoảng trống phía trước. Chỉ khi toàn bộ điều kiện cho phép mới được vượt; nếu có một xung đột đang diễn ra thì phải chờ. Đối chiếu hình, kết luận đúng là: Cấm vượt."},{"id":556,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn có được phép vượt xe mô tô phía trước không?","o":["Cho phép.","Không được vượt."],"a":2,"img":"q556.webp","ee":"Vượt xe chỉ được thực hiện khi vạch/biển cho phép, tầm nhìn đủ và không có xung đột phía trước. Đối chiếu các điều kiện đó trong hình, kết luận là: Không được vượt.","ed":"Quan sát vạch đường, xe đang vượt, xe ngược chiều và khoảng trống phía trước. Chỉ khi toàn bộ điều kiện cho phép mới được vượt; nếu có một xung đột đang diễn ra thì phải chờ. Đối chiếu hình, kết luận đúng là: Không được vượt."},{"id":557,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Người lái xe dừng tại vị trí nào là đúng quy tắc giao thông?","o":["Vị trí A và B.","Vị trí A và C.","Vị trí B và C.","Cả ba vị trí A, B, C."],"a":3,"img":"q557.webp","ee":"Vị trí đúng/sai của chính hình: Vị trí B và C. Rà lề đường, vạch dừng và chỗ che khuất trước khi chọn","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Vị trí B và C."},{"id":558,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn được dừng xe ở vị trí nào trong tình huống này?","o":["Được phép dừng ở vị trí A.","Được phép dừng ở vị trí B.","Được phép dừng ở vị trí A và B.","Không được dừng."],"a":4,"img":"q558.webp","ee":"Đây là câu về vị trí dừng xe, không phải thứ tự ưu tiên. Quan sát lề/vạch và vị trí trong hình: chỗ này thuộc vị trí không được dừng nên đáp án là “Không được dừng”.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Không được dừng."},{"id":559,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Theo tín hiệu đèn của xe cơ giới, xe nào vi phạm quy tắc giao thông?","o":["Xe mô tô.","Xe ô tô con.","Không xe nào vi phạm.","Cả hai xe."],"a":4,"img":"q559.webp","ee":"Hai ý đều đúng: (1) Xe mô tô; (2) Xe ô tô con. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai xe.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Xe mô tô; ý 2: Xe ô tô con. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai xe.”."},{"id":560,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Các xe đi theo hướng mũi tên, xe nào vi phạm quy tắc giao thông?","o":["Xe con.","Xe tải.","Xe con, xe tải."],"a":2,"img":"q560.webp","ee":"Dùng “Nhất chớm - nhì ưu - tam đường - tứ hướng”: xét xe đã chớm vào giao lộ trước, rồi xe ưu tiên, đường ưu tiên/đường chính, cuối cùng mới xét hướng đi. Áp dụng vào hình này được: Xe tải.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước 72.webp","ee":"Rẽ phải nhưng phía trước có tải + xe đạp → GIẢM TỐC, ĐI SAU, không chen lên","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Giảm tốc độ, rẽ phải sau xe tải và xe đạp."},{"id":573,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn xử lý như thế nào trong trường hợp này?","o":["Tăng tốc độ, rẽ phải trước xe con màu xanh phía trước và người đi bộ.","Giảm tốc độ, để người đi bộ qua đường và rẽ phải trước xe con màu xanh.","Giảm tốc độ, để người đi bộ qua đường và rẽ phải sau xe con màu xanh."],"a":3,"img":"q573.webp","ee":"Thứ tự an toàn: NGƯỜI ĐI BỘ → XE CON XANH → MÌNH RẼ PHẢI","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Giảm tốc độ, để người đi bộ qua đường và rẽ phải sau xe con màu xanh."},{"id":574,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn xử lý như thế nào trong trường hợp này?","o":["Nhường đường cho xe khách và đi trước xe đạp.","Nhường đường cho xe đạp và đi trước xe khách.","Nhường đường cho xe đạp và xe khách."],"a":3,"img":"q574.webp","ee":"Hình này phải NHƯỜNG XE ĐẠP + XE KHÁCH; đừng ưu tiên mình chỉ vì đang đi thẳng","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Nhường đường cho xe đạp và xe khách."},{"id":575,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Xe nào phải nhường đường trong trường hợp này?","o":["Xe con.","Xe tải.","Xe của bạn."],"a":2,"img":"q575.webp","ee":"Dùng “Nhất chớm - nhì ưu - tam đường - tứ hướng”: xét xe đã chớm vào giao lộ trước, rồi xe ưu tiên, đường ưu tiên/đường chính, cuối cùng mới xét hướng đi. Áp dụng vào hình này được: Xe tải.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe tải."},{"id":576,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Xe nào phải nhường đường trong trường hợp này?","o":["Xe đi ngược chiều.","Xe của bạn."],"a":2,"img":"q576.webp","ee":"Dùng “Nhất chớm - nhì ưu - tam đường - tứ hướng”: xét xe đã chớm vào giao lộ trước, rồi xe ưu tiên, đường ưu tiên/đường chính, cuối cùng mới xét hướng đi. Áp dụng vào hình này được: Xe của bạn.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe của bạn."},{"id":577,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn xử lý như thế nào khi lái xe ô tô vượt qua đoàn người đi xe đạp có tổ chức?","o":["Tăng tốc độ, chuyển sang làn đường bên trái để vượt.","Không được vượt những người đi xe đạp."],"a":2,"img":"q577.webp","ee":"Vượt xe chỉ được thực hiện khi vạch/biển cho phép, tầm nhìn đủ và không có xung đột phía trước. Đối chiếu các điều kiện đó trong hình, kết luận là: Không được vượt những người đi xe đạp.","ed":"Quan sát vạch đường, xe đang vượt, xe ngược chiều và khoảng trống phía trước. Chỉ khi toàn bộ điều kiện cho phép mới được vượt; nếu có một xung đột đang diễn ra thì phải chờ. Đối chiếu hình, kết luận đúng là: Không được vượt những người đi xe đạp."},{"id":578,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Phía trước có một xe đang lùi vào nơi đỗ, xe con phía trước đang chuyển sang làn đường bên trái, bạn xử lý như thế nào trong trường hợp này?","o":["Nếu phía sau không có xe xin vượt, chuyển sang làn đường bên trái.","Nếu phía sau có xe xin vượt, thì giảm tốc độ, ở lại làn đường, dừng lại khi cần thiết.","Tăng tốc độ trên làn đường của mình và vượt xe con.","Ý 1 và ý 2."],"a":4,"img":"q578.webp","ee":"Hai ý đều đúng: (1) Nếu phía sau không có xe xin vượt, chuyển sang làn đường bên trái; (2) Nếu phía sau có xe xin vượt, thì giảm tốc độ, ở lại làn đường, dừng lại khi cần thiết. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 2.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Nếu phía sau không có xe xin vượt, chuyển sang làn đường bên trái; ý 2: Nếu phía sau có xe xin vượt, thì giảm tốc độ, ở lại làn đường, dừng lại khi cần thiết. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 2.”."},{"id":579,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn xử lý như thế nào khi xe phía trước đang lùi ra khỏi nơi đỗ?","o":["Chuyển sang nửa đường bên trái để đi tiếp.","Bấm còi, nháy đèn báo hiệu và đi tiếp.","Giảm tốc độ, dừng lại nhường đường."],"a":3,"img":"q579.webp","ee":"Xe đang LÙI RA CHỖ ĐỖ → mình giảm tốc/dừng nhường; đừng cố lách qua đuôi xe","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Giảm tốc độ, dừng lại nhường đường."},{"id":580,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Phía trước có một xe màu xanh đang vượt xe màu vàng trên làn đường của bạn, bạn xử lý như thế nào trong trường hợp này?","o":["Phanh xe giảm tốc độ và đi sát lề đường bên phải.","Bấm còi, nháy đèn báo hiệu, giữ nguyên tốc độ và đi tiếp.","Phanh xe giảm tốc độ và đi sát vào lề đường bên trái."],"a":1,"img":"q580.webp","ee":"Vượt xe chỉ được thực hiện khi vạch/biển cho phép, tầm nhìn đủ và không có xung đột phía trước. Đối chiếu các điều kiện đó trong hình, kết luận là: Phanh xe giảm tốc độ và đi sát lề đường bên phải.","ed":"Quan sát vạch đường, xe đang vượt, xe ngược chiều và khoảng trống phía trước. Chỉ khi toàn bộ điều kiện cho phép mới được vượt; nếu có một xung đột đang diễn ra thì phải chờ. Đối chiếu hình, kết luận đúng là: Phanh xe giảm tốc độ và đi sát lề đường bên phải."},{"id":581,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Xe tải phía trước có tín hiệu xin chuyển làn đường, bạn xử lý như thế nào trong trường hợp này?","o":["Bật tín hiệu xin chuyển làn đường sang trái để vượt xe tải.","Phanh xe giảm tốc độ chờ xe tải phía trước chuyển làn đường.","Bấm còi báo hiệu và vượt qua xe tải trên làn đường của mình."],"a":2,"img":"q581.webp","ee":"Xe chuyển/nhập làn là xe thay đổi dòng chạy nên phải báo trước và nhường xe đang ổn định trong làn. Đối chiếu hình, đáp án là: Phanh xe giảm tốc độ chờ xe tải phía trước chuyển làn đường.","ed":"Xe nhập/chuyển làn là xe thay đổi dòng chạy nên phải nhường xe đang chạy ổn định trong làn, đồng thời dùng tín hiệu và bảo đảm khoảng trống. Đối chiếu vị trí và mũi tên trong hình, kết luận là: Phanh xe giảm tốc độ chờ xe tải phía trước chuyển làn đường."},{"id":582,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Bạn xử lý như thế nào trong trường hợp này?","o":["Tăng tốc độ và đi thẳng qua ngã tư.","Dừng xe trước vạch dừng.","Giảm tốc độ và đi thẳng qua ngã tư."],"a":3,"img":"q582.webp","ee":"Đầu tiên đọc đèn, biển, vạch và hướng mũi tên trong hình; sau đó đối chiếu từng xe với phần đường/hướng được phép. Theo hình này, đáp án là: Giảm tốc độ và đi thẳng qua ngã tư.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Giảm tốc độ và đi thẳng qua ngã tư."},{"id":583,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Các xe đi theo thứ tự nào là đúng quy tắc giao thông đường bộ?","o":["Xe của bạn, xe mô tô, xe đạp.","X "Vị trí đúng/sai của chính hình: Xe con. Rà lề đường, vạch dừng và chỗ che khuất trước khi chọn","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe con."},{"id":593,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Các xe đi theo thứ tự nào là đúng quy tắc giao thông đường bộ?","o":["Xe tải, xe đạp, xe của bạn.","Xe của bạn, xe đạp, xe tải.","Xe của bạn, xe tải, xe đạp."],"a":3,"img":"q593.webp","ee":"Dùng “Nhất chớm - nhì ưu - tam đường - tứ hướng”: xét xe đã chớm vào giao lộ trước, rồi xe ưu tiên, đường ưu tiên/đường chính, cuối cùng mới xét hướng đi. Áp dụng vào hình này được: Xe của bạn, xe tải, xe đạp.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Xe của bạn, xe tải, xe đạp."},{"id":594,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Để điều khiển xe rẽ trái, bạn chọn hướng đi nào dưới đây?","o":["Hướng 1.","Hướng 2.","Cả hai hướng đều được."],"a":1,"img":"q594.webp","ee":"Đầu tiên đọc đèn, biển, vạch và hướng mũi tên trong hình; sau đó đối chiếu từng xe với phần đường/hướng được phép. Theo hình này, đáp án là: Hướng 1.","ed":"Đọc hình theo thứ tự: hiệu lệnh/đèn → biển/vạch → vị trí xe → hướng mũi tên → điểm xung đột. Sau đó mới áp dụng quy tắc nhường hoặc điều kiện được đi. Làm đủ các bước với hình này cho kết quả: Hướng 1."},{"id":595,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Khi gặp xe ngược chiều bật đèn pha trong tình huống dưới dây, bạn xử lý như thế nào?","o":["Bật đèn chiếu xa, tăng tốc độ vượt xe cùng chiều.","Giữ nguyên đèn chiếu gần, giảm tốc độ, đi sau xe phía trước.","Giữ nguyên đèn chiếu gần, tăng tốc độ vượt xe cùng chiều."],"a":2,"img":"q595.webp","ee":"Gặp xe ngược chiều bật pha làm chói mắt, không bật pha để “đấu lại”. Giữ đèn chiếu gần, giảm tốc và đi sau xe trước để có thêm thời gian quan sát.","ed":"Xe ngược chiều bật pha có thể làm người lái bị chói và giảm khả năng quan sát. Cách an toàn không phải bật pha đáp trả hay tăng tốc vượt, mà giữ đèn chiếu gần, giảm tốc và đi sau xe phía trước để có thêm khoảng quan sát. Vì vậy chọn phương án 2."},{"id":596,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Xe của bạn đang di chuyển gần đến khu vực giao cắt với đường sắt, khi rào chắn đang dịch chuyển, bạn điều khiển xe như thế nào là đúng quy tắc giao thông?","o":["Quan sát nếu thấy không có tàu thì tăng tốc cho xe vượt qua đường sắt.","Dừng lại trước rào chắn một khoảng cách an toàn.","Ra tín hiệu, yêu cầu người gác chắn tàu kéo chậm barie để xe bạn qua."],"a":2,"img":"q596.webp","ee":"Rào chắn đường sắt đang dịch chuyển nghĩa là khu vực giao cắt đang chuẩn bị đóng/mở cho tàu. Phải dừng trước rào chắn ở khoảng cách an toàn, không tranh thủ vượt chỉ vì chưa nhìn thấy tàu.","ed":"Rào chắn đường sắt đang dịch chuyển là dấu hiệu giao cắt chưa an toàn để đi qua. Không được suy luận “chưa thấy tàu thì vẫn kịp vượt”, vì tàu có quãng dừng rất dài và quyền ưu tiên tuyệt đối tại đường sắt. Phải dừng trước rào chắn ở khoảng cách an toàn và chờ khi được phép đi."},{"id":597,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Trong tình huống dưới đây, xe con màu đỏ nhập làn đường cao tốc theo hướng mũi tên là đúng hay sai?","o":["Đúng.","Sai."],"a":2,"img":"q597.webp","ee":"Xe nhập cao tốc phải đi theo làn tăng tốc và nhường dòng xe đã chạy trên cao tốc. Hướng nhập của xe đỏ trong hình không bảo đảm nguyên tắc đó nên là sai.","ed":"Khi nhập làn cao tốc, xe nhập làn phải tăng tốc phù hợp trong làn tăng tốc, quan sát và nhường dòng xe đang chạy ổn định trên cao tốc. Hướng đi trong hình của xe đỏ không đáp ứng đúng quy tắc nhập làn mà bộ đề yêu cầu, nên kết luận là sai."},{"id":598,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Trong tình huống dưới đây, xe con màu đỏ có được phép vượt khi xe con màu xanh đang vượt xe tải hay không?","o":["Được vượt.","Không được vượt."],"a":2,"img":"q598.webp","ee":"Xe xanh đang vượt xe tải, nên xe đỏ không được vượt chồng thêm trong tình huống này. Chờ xe xanh vượt xong rồi mới đánh giá lại khoảng trống và điều kiện vượt.","ed":"Xe xanh đang thực hiện một lượt vượt xe tải. Nếu xe đỏ tiếp tục vượt trong lúc đó sẽ tạo thêm một xung đột và làm giảm khoảng trống an toàn. Cần chờ xe xanh hoàn thành vượt rồi mới đánh giá lại điều kiện. Vì vậy xe đỏ không được phép vượt trong tình huống này."},{"id":599,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Trong tình huống dưới đây, xe con màu vàng vượt xe con màu đỏ là đúng quy tắc giao thông hay không?","o":["Đúng.","Không đúng."],"a":1,"img":"q599.webp","ee":"Không phải mọi hành vi vượt đều sai; phải xem vạch đường và khoảng trống trong hình. Ở tình huống này xe vàng vượt xe đỏ đúng điều kiện nên hành vi là đúng.","ed":"Để đánh giá một hành vi vượt, phải xem đồng thời vạch kẻ đường, hướng xe, khoảng trống và xung đột với xe khác; không thể mặc định cứ vượt là sai. Đối chiếu các yếu tố trong hình của câu này, xe con màu vàng vượt xe con màu đỏ đúng quy tắc nên chọn “Đúng”."},{"id":600,"ch":6,"ct":"Giải thế sa hình và kỹ năng xử lý tình huống giao thông","q":"Trong tình huống dưới đây, xe đầu kéo kéo rơ moóc (xe container) đang rẽ phải, xe con màu xanh và xe máy phía sau xe container đi như thế nào để bảo đảm an toàn?","o":["Vượt về phía bên phải để đi tiếp.","Giảm tốc độ chờ xe container rẽ xong rồi tiếp tục đi.","Vượt về phía bên trái để đi tiếp."],"a":2,"img":"q600.webp","ee":"Container rẽ phải cần một vùng quay rất rộng; phần rơ moóc có thể quét sang cạnh xe. Vì vậy xe con và xe máy phía sau phải chờ container rẽ xong, không chui vượt bên trái hay bên phải.","ed":"Xe đầu kéo kéo rơ moóc khi rẽ cần bán kính quay lớn; phần rơ moóc phía sau có thể quét vào vùng bên cạnh mà người đi xe con hoặc xe máy tưởng là khoảng trống. Vì vậy vượt sát bên trái hoặc chui bên phải khi container đang rẽ đều nguy hiểm. Cách an toàn là giảm tốc, chờ container rẽ xong rồi mới đi tiếp."}];

</script>
<script>
const TOTAL_Q = 30;       // số câu mỗi lần thi
const TIME_MIN = 20;      // phút
const PASS = 27;          // số câu đúng tối thiểu để đỗ
const app = document.getElementById('app');

let pool = window.QUESTIONS || [];
let quiz = [];            // 30 câu đang thi
let answers = [];         // chỉ số phương án chọn (1-based) hoặc null
let flags = [];           // true/false
let cur = 0;
let timeLeft = TIME_MIN*60;
let timer = null;
let finished = false;
let currentSeed = 0;      // seed = thời điểm bấm Bắt đầu thi

/* -------- utils -------- */
// PRNG có seed (mulberry32) -> cùng seed sẽ cho cùng bộ câu hỏi
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,rnd){rnd=rnd||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function seedLabel(s){const d=new Date(s);const p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmt(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
const KEYS=['A','B','C','D','E','F'];

/* ================= START SCREEN ================= */
function renderStart(){
  finished=false;
  app.innerHTML = `
  <div class="hero">
    <h1>🚗 Thi thử sát hạch lái xe</h1>
    <div class="sub">Bộ 600 câu hỏi · Giải thích chi tiết sau khi nộp bài</div>
    <div class="passnote">✅ Đúng từ <b>${PASS}/${TOTAL_Q}</b> câu trở lên là ĐỖ</div>
    <div class="rules">
      <div class="rule"><div class="ic">📝</div><div><b>${TOTAL_Q} câu hỏi</b><span>Chọn ngẫu nhiên từ 600 câu</span></div></div>
      <div class="rule"><div class="ic">⏱️</div><div><b>${TIME_MIN} phút</b><span>Hết giờ tự động nộp bài</span></div></div>
      <div class="rule"><div class="ic">⚑</div><div><b>Cắm cờ</b><span>Câu cắm cờ được tính là chưa làm</span></div></div>
      <div class="rule"><div class="ic">📊</div><div><b>Xem lại</b><span>Hiện đáp án & giải thích khi thi xong</span></div></div>
    </div>
    <button class="btn-primary" style="width:100%" onclick="startExam()">Bắt đầu thi →</button>
  </div>
  <footer>Nguồn: ${esc((window.EXAM_META&&window.EXAM_META.source)||'600 câu sát hạch')}</footer>`;
}

/* ================= EXAM ================= */
function startExam(){
  currentSeed = Date.now();                       // seed theo thời điểm bấm bắt đầu
  const rng = mulberry32(currentSeed);
  quiz = shuffle(pool, rng).slice(0, Math.min(TOTAL_Q, pool.length));
  answers = new Array(quiz.length).fill(null);
  flags = new Array(quiz.length).fill(false);
  cur = 0; timeLeft = TIME_MIN*60; finished=false;
  clearInterval(timer);
  timer = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ timeLeft=0; updateTimer(); doSubmit(true); return; }
    updateTimer();
  },1000);
  renderExam();
  window.scrollTo(0,0);
}

function updateTimer(){
  const el=document.getElementById('timer');
  if(!el) return;
  el.textContent='⏱ '+fmt(timeLeft);
  el.classList.toggle('warn', timeLeft<=120);
}

function renderExam(){
  const answered = answers.filter(a=>a!==null).length;
  app.innerHTML = `
  <div class="topbar"><div class="row">
    <div class="timer" id="timer">⏱ ${fmt(timeLeft)}</div>
    <div class="progress-mini">Đã làm <b id="doneCount">${answered}</b>/${quiz.length} câu
      <div class="bar"><i id="barFill" style="width:${answered/quiz.length*100}%"></i></div>
    </div>
  </div></div>

  <div class="palette">
    <h3>Danh sách câu hỏi</h3>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="lg-ans"></i>Đã chọn</span>
      <span><i class="lg-flag"></i>Cắm cờ</span>
      <span><i class="lg-empty"></i>Chưa làm</span>
    </div>
  </div>

  <div id="qcard"></div>

  <div class="submitrow"><button onclick="confirmSubmit()">Nộp bài</button></div>
  <footer>Câu cắm cờ ⚑ sẽ được tính là <b>chưa làm</b> khi chấm điểm.<br>Mã đề: <b>${currentSeed}</b> · bắt đầu lúc ${seedLabel(currentSeed)}</footer>`;
  buildGrid();
  renderQuestion();
  updateTimer();
}

function buildGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  quiz.forEach((_,i)=>{
    const c=document.createElement('button');
    c.className='cell';
    c.textContent=i+1;
    c.onclick=()=>{cur=i;renderQuestion();refreshGrid();scrollToQ();};
    g.appendChild(c);
  });
  refreshGrid();
}
function refreshGrid(){
  const cells=document.querySelectorAll('#grid .cell');
  cells.forEach((c,i)=>{
    c.className='cell';
    if(flags[i]) c.classList.add('flagged');
    else if(answers[i]!==null) c.classList.add('answered');
    if(i===cur) c.classList.add('current');
  });
}

function renderQuestion(){
  const q=quiz[cur];
  const card=document.getElementById('qcard');
  const imgHtml = q.img ? `<img class="qimg" src="images/${q.img}" alt="Hình câu ${q.id}" loading="lazy">` : '';
  card.innerHTML = `
  <div class="card">
    <div class="qhead">
      <span class="qnum">Câu ${cur+1}/${quiz.length}</span>
      <span class="chip" title="${esc(q.ct)}">${esc(q.ct||'')}</span>
      <button class="flagbtn ${flags[cur]?'on':''}" onclick="toggleFlag()">⚑ ${flags[cur]?'Đã cắm cờ':'Cắm cờ'}</button>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    ${imgHtml}
    <div class="opts" id="opts"></div>
    <div class="navrow">
      <button class="btn-ghost" onclick="go(-1)" ${cur===0?'disabled style=opacity:.4':''}>← Câu trước</button>
      <button class="btn-ghost" onclick="go(1)" ${cur===quiz.length-1?'disabled style=opacity:.4':''}>Câu sau →</button>
    </div>
  </div>`;
  const opts=document.getElementById('opts');
  q.o.forEach((t,i)=>{
    const idx=i+1;
    const b=document.createElement('button');
    b.className='opt'+(answers[cur]===idx?' sel':'');
    b.innerHTML=`<span class="key">${KEYS[i]}</span><span>${esc(t)}</span>`;
    b.onclick=()=>{answers[cur]=idx;renderQuestion();refreshGrid();updateProgress();};
    opts.appendChild(b);
  });
}
function updateProgress(){
  const answered=answers.filter(a=>a!==null).length;
  const dc=document.getElementById('doneCount'); if(dc) dc.textContent=answered;
  const bf=document.getElementById('barFill'); if(bf) bf.style.width=(answered/quiz.length*100)+'%';
}
function toggleFlag(){flags[cur]=!flags[cur];renderQuestion();refreshGrid();}
function go(d){const n=cur+d;if(n<0||n>=quiz.length)return;cur=n;renderQuestion();refreshGrid();scrollToQ();}
function scrollToQ(){const el=document.getElementById('qcard');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

/* ================= SUBMIT ================= */
function confirmSubmit(){
  const answered=answers.filter(a=>a!==null).length;
  const flagged=flags.filter(Boolean).length;
  let msg=`Bạn đã làm ${answered}/${quiz.length} câu.`;
  const blank=quiz.length-answered;
  if(blank>0) msg+=`\nCòn ${blank} câu chưa chọn.`;
  if(flagged>0) msg+=`\n${flagged} câu đang cắm cờ (tính là chưa làm).`;
  msg+='\n\nNộp bài ngay?';
  if(confirm(msg)) doSubmit(false);
}
function doSubmit(auto){
  if(finished) return;
  finished=true;
  clearInterval(timer);
  if(auto) setTimeout(()=>alert('⏰ Hết giờ! Bài thi được tự động nộp.'),50);
  renderResult();
  window.scrollTo(0,0);
}

/* ================= RESULT ================= */
let reviewFilter='all';
function scoreOf(i){
  // cắm cờ => tính là chưa làm
  const eff = flags[i] ? null : answers[i];
  if(eff===null) return 'skip';
  return eff===quiz[i].a ? 'correct':'wrong';
}
/* ---- ending popup: random 1 gif+text theo mức kết quả ---- */
const ENDINGS = {
  1: { headline:"em nên thi lại, hơi hên 💩", color:"var(--ok)", items:[
    {gif:"gifs/t1a.gif", text:"cũng kinh đấy 🐮"},
    {gif:"gifs/t1b.gif", text:"30 câu đúng luôn? anh dạy đẳng cấp thật 👍"},
    {gif:"gifs/t1c.gif", text:"ấn tượng đấy chứ 🫕🐰"},
  ]},
  2: { headline:"thi lại luôn hộ, hên mới pass 🫤", color:"var(--warn)", items:[
    {gif:"gifs/t2a.gif", text:"nghi toàn khoanh bừa 😡"},
    {gif:"gifs/t2b.gif", text:"sao vẫn sai nhiều thế? khoanh bừa à 😑"},
    {gif:"gifs/t2c.gif", text:"không được 30 là kém rồi 🐽"},
  ]},
  3: { headline:"haizzzzzzz xứng đáng bị phạt 👊👊👊", color:"var(--bad)", items:[
    {gif:"gifs/t3a.gif", text:"cạn lời luôn rồi 🧠🐷"},
    {gif:"gifs/t3b.gif", text:"tưởng thế nào 🧠🐷"},
    {gif:"gifs/t3c.gif", text:"học lại hộ tôi 🤬"},
  ]},
};
// túi xáo bài: mỗi mức phát đủ cả 3 gif rồi mới xáo lại -> không lặp dồn dập
const _endBag={}, _endLast={};
function pickEnding(tier){
  const items=ENDINGS[tier].items;
  let bag=_endBag[tier];
  if(!bag || !bag.length){
    bag=items.map((_,i)=>i);
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
    if(_endLast[tier]!==undefined && bag.length>1 && bag[0]===_endLast[tier]){[bag[0],bag[1]]=[bag[1],bag[0]];}
    _endBag[tier]=bag;
  }
  const idx=bag.shift();
  _endLast[tier]=idx;
  return items[idx];
}
function showEnding(tier){
  const e=ENDINGS[tier];
  const it=pickEnding(tier);
  closeEnding();
  const bg=document.createElement('div');
  bg.className='modal-bg'; bg.id='endingModal';
  bg.innerHTML=`<div class="modal">
    <h2 style="color:${e.color}">${esc(e.headline)}</h2>
    <img class="egif" src="${it.gif}" alt="">
    <div class="etext">${esc(it.text)}</div>
    <div class="ebtns">
      <button class="btn-primary" onclick="closeEnding();startExam();">🔁 Thi lại (30 câu mới)</button>
      <button class="btn-ghost" onclick="closeEnding()">Xem lại bài làm</button>
    </div>
  </div>`;
  bg.addEventListener('click',ev=>{if(ev.target===bg)closeEnding();});
  document.body.appendChild(bg);
}
function closeEnding(){const m=document.getElementById('endingModal');if(m)m.remove();}

function renderResult(){
  const res=quiz.map((_,i)=>scoreOf(i));
  const correct=res.filter(r=>r==='correct').length;
  const wrong=res.filter(r=>r==='wrong').length;
  const skip=res.filter(r=>r==='skip').length;
  const flagged=flags.filter(Boolean).length;
  const pass=correct>=PASS;
  const used=TIME_MIN*60-timeLeft;

  app.innerHTML=`
  <div class="result ${pass?'pass':'fail'}">
    <span class="verdict ${pass?'pass':'fail'}">${pass?'✓ Đỗ':'✗ Trượt'}</span>
    <div class="score">${correct}<small>/${quiz.length}</small></div>
    <div style="color:var(--muted);font-size:14px">Cần đúng ≥ ${PASS} câu để đỗ · Thời gian làm: ${fmt(used)}</div>
    <div style="color:var(--muted);font-size:12.5px;margin-top:4px">Mã đề: <b>${currentSeed}</b> · bắt đầu lúc ${seedLabel(currentSeed)}</div>
    <div class="statgrid">
      <div class="stat g"><b>${correct}</b><span>Đúng</span></div>
      <div class="stat r"><b>${wrong}</b><span>Sai</span></div>
      <div class="stat"><b>${skip}</b><span>Chưa làm</span></div>
      <div class="stat o"><b>${flagged}</b><span>Cắm cờ</span></div>
    </div>
    <div class="navrow">
      <button class="btn-ghost" onclick="renderStart()">← Về trang chủ</button>
      <button class="btn-primary" onclick="startExam()">Thi lại (30 câu mới)</button>
    </div>
  </div>

  <div class="reviewhead">
    <h2>Xem lại bài làm</h2>
    <div class="filterbtns">
      <button class="on" data-f="all" onclick="setFilter('all')">Tất cả</button>
      <button data-f="wrong" onclick="setFilter('wrong')">Sai/Chưa làm</button>
    </div>
  </div>
  <div id="reviewList"></div>
  <footer>Nguồn: ${esc((window.EXAM_META&&window.EXAM_META.source)||'600 câu sát hạch')}</footer>`;
  renderReview();
  // popup ending: mức 1 = đỗ & đúng 30/30, mức 2 = đỗ nhưng chưa 30/30, mức 3 = trượt
  const tier = !pass ? 3 : (correct===quiz.length ? 1 : 2);
  setTimeout(()=>showEnding(tier), 400);
}
function setFilter(f){reviewFilter=f;
  document.querySelectorAll('.filterbtns button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  renderReview();
}
function renderReview(){
  const box=document.getElementById('reviewList');
  box.innerHTML='';
  // ưu tiên câu sai/chưa làm lên trước, câu đúng xuống sau (giữ thứ tự gốc trong mỗi nhóm)
  const order=quiz.map((_,i)=>i).sort((a,b)=>{
    const rank=i=>scoreOf(i)==='correct'?1:0;
    return rank(a)-rank(b);
  });
  order.forEach(i=>{
    const q=quiz[i];
    const st=scoreOf(i);
    if(reviewFilter==='wrong' && st==='correct') return;
    const tag = st==='correct'?'<span class="rv-tag c">✓ Đúng</span>'
            : st==='wrong'?'<span class="rv-tag w">✗ Sai</span>'
            : '<span class="rv-tag s">⚑ Chưa làm</span>';
    const imgHtml = q.img ? `<img class="qimg" src="images/${q.img}" alt="" loading="lazy">`:'';
    const chosen = flags[i]?null:answers[i];
    const opts = q.o.map((t,k)=>{
      const idx=k+1;
      let cls='opt';
      if(idx===q.a) cls+=' correct';
      else if(idx===chosen) cls+=' wrong';
      let mark='';
      if(idx===q.a) mark='<span class="mark" style="color:var(--ok)">✓ Đáp án đúng</span>';
      else if(idx===chosen) mark='<span class="mark" style="color:var(--bad)">Bạn chọn</span>';
      return `<div class="${cls}"><span class="key">${KEYS[k]}</span><span>${esc(t)}</span>${mark}</div>`;
    }).join('');
    const el=document.createElement('div');
    el.className='card rv-'+st;
    el.innerHTML=`
      <div class="qhead">
        <span class="qnum">Câu ${i+1} · #${q.id}</span>
        ${tag}
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${imgHtml}
      <div class="opts">${opts}</div>
      <div class="exp">
        <div class="easy"><b>💡 Giải thích dễ hiểu:</b> ${esc(q.ee)}</div>
        ${q.ed?`<div class="detail"><b>📌 Giải thích chi tiết:</b> ${esc(q.ed)}</div>`:''}
      </div>`;
    box.appendChild(el);
  });
  if(!box.children.length) box.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">🎉 Không có câu nào sai. Tuyệt vời!</div>';
}

/* -------- boot -------- */
if(!pool.length){app.innerHTML='<div class="hero"><h1>Lỗi tải dữ liệu</h1><p>Không đọc được data.js</p></div>';}
else renderStart();
</script>
</body>
</html>
