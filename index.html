cài quai thì khi ngã mũ có thể văng ra, gần như mất tác dụng bảo vệ.","ed":"Mũ bảo hiểm chỉ phát huy tác dụng khi đúng quy chuẩn và cài quai đúng cách để không bị tuột/văng khi va chạm. Câu hỏi yêu cầu đúng đối tượng và cách sử dụng nên chọn: Đội mũ bảo hiểm theo đúng quy chuẩn kỹ thuật quốc gia và cài quai đúng quy cách."},{"id":69,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe mô tô hai bánh, xe gắn máy được phép chở tối đa hai người trong những trường hợp nào?","o":["Chở người bệnh đi cấp cứu; áp giải người có hành vi vi phạm pháp luật; trẻ em dưới 12 tuổi; người già yếu hoặc người khuyết tật.","Người đã uống rượu, bia; người trong cơ thể có chất ma tuý.","Cả hai ý trên."],"a":1,"img":null,"ee":"Mô tô được chở tối đa 2 người khi CẤP CỨU - ÁP GIẢI - TRẺ <12 - GIÀ YẾU/KHUYẾT TẬT","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: Chở người bệnh đi cấp cứu; áp giải người có hành vi vi phạm pháp luật; trẻ em dưới 12 tuổi; người già yếu hoặc người khuyết tật; các con số khác không áp dụng cho trường hợp này."},{"id":70,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy không được thực hiện các hành vi nào dưới đây?","o":["Đi xe dàn hàng ngang; buông cả hai tay.","Sử dụng xe để kéo, đẩy xe khác, vật khác, dẫn dắt vật nuôi, mang, vác và chở vật cồng kềnh; chở người đứng trên xe, giá đèo hàng hoặc ngồi trên tay lái; xếp hàng hóa trên xe quá giới hạn quy định.","Ngồi về một bên điều khiển xe; đứng, nằm trên xe điều khiển xe; thay người lái xe khi xe đang chạy; quay người về phía sau để điều khiển xe hoặc bịt mắt điều khiển xe; sử dụng chân chống hoặc vật khác quệt xuống đường khi xe đang chạy.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Đi xe dàn hàng ngang; 2) Sử dụng xe để kéo, đẩy xe khác, vật khác, dẫn dắt vật nuôi, mang, vác và chở vật cồng kềnh; 3) Ngồi về một bên điều khiển xe. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Đi xe dàn hàng ngang; buông cả hai tay; ý 2: Sử dụng xe để kéo, đẩy xe khác, vật khác, dẫn dắt vật nuôi, mang, vác và chở vật cồng kềnh; chở người đứng trên xe, giá đèo hàng hoặc ngồi trên tay…; ý 3: Ngồi về một bên điều khiển xe; đứng, nằm trên xe điều khiển xe; thay người lái xe khi xe đang chạy; quay người về phía sau để điều khiển xe hoặc bịt…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":71,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy không được thực hiện các hành vi nào sau đây?","o":["Đi xe dàn hàng ngang; đi xe vào phần đường dành cho người đi bộ và phương tiện khác.","Sử dụng ô, thiết bị âm thanh, trừ thiết bị trợ thính.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Đi xe dàn hàng ngang; (2) Sử dụng ô, thiết bị âm thanh, trừ thiết bị trợ thính. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Đi xe dàn hàng ngang; đi xe vào phần đường dành cho người đi bộ và phương tiện khác; ý 2: Sử dụng ô, thiết bị âm thanh, trừ thiết bị trợ thính. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":72,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy không được thực hiện hành vi nào sau đây?","o":["Đi trên phần đường, làn đường quy định, chấp hành hiệu lệnh của người điều khiển giao thông, đèn tín hiệu giao thông.","Đi xe dàn hàng ngang, đi xe vào phần đường dành cho người đi bộ.","Cả hai ý trên."],"a":2,"img":null,"ee":"Quy định cấm nội dung này để tránh nguy hiểm hoặc gian lận trong giao thông. Ở câu này, hành vi/điều kiện bị cấm là: Đi xe dàn hàng ngang, đi xe vào phần đường dành cho người đi bộ.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Đi xe dàn hàng ngang, đi xe vào phần đường dành cho người đi bộ. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":73,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người được chở trên xe mô tô hai bánh, xe mô tô ba bánh, xe gắn máy khi tham gia giao thông đường bộ có được sử dụng ô khi trời mưa hay không?","o":["Được sử dụng.","Chỉ người ngồi sau được sử dụng.","Không được sử dụng.","Được sử dụng nếu không có áo mưa."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Không được sử dụng. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Không được sử dụng”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Được sử dụng” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":74,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người được chở trên xe mô tô có được kéo theo người đang điều khiển xe đạp hay không?","o":["Chỉ được phép nếu cả hai đội mũ bảo hiểm.","Không được phép.","Chỉ được thực hiện trên đường vắng."],"a":2,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Không được phép.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Không được phép. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":75,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trường hợp người được chở trên xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy không đội \"mũ bảo hiểm cho người đi mô tô, xe máy\" hoặc không cài quai đúng quy cách (trừ trường hợp chở người bệnh đi cấp cứu, trẻ em dưới 06 tuổi, áp giải người có hành vi vi phạm pháp luật) thì việc xử phạt vi phạm hành chính được quy định như thế nào?","o":["Không bị xử phạt chỉ bị nhắc nhở.","Người được chở không bị xử phạt, chỉ xử phạt người điều khiển xe mô tô, xe gắn máy.","Người được chở bị xử phạt, không xử phạt người điều khiển xe mô tô, xe gắn máy.","Xử phạt cả người điều khiển và người được chở trên xe mô tô, xe gắn máy."],"a":4,"img":null,"ee":"Mũ chỉ bảo vệ tốt khi đúng chuẩn và được cài quai để không văng khỏi đầu khi va chạm. Do đó phương án phù hợp là: Xử phạt cả người điều khiển và người được chở trên xe mô tô, xe gắn máy.","ed":"Mũ bảo hiểm chỉ phát huy tác dụng khi đúng quy chuẩn và cài quai đúng cách để không bị tuột/văng khi va chạm. Câu hỏi yêu cầu đúng đối tượng và cách sử dụng nên chọn: Xử phạt cả người điều khiển và người được chở trên xe mô tô, xe gắn máy."},{"id":76,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trong các trường hợp dưới đây, để bảo đảm an toàn khi tham gia giao thông, người lái xe mô tô cần thực hiện như thế nào?","o":["Phải đội mũ bảo hiểm theo đúng quy chuẩn kỹ thuật quốc gia và cài quai đúng quy cách, không sử dụng ô, điện thoại di động, thiết bị âm thanh (trừ thiết bị trợ thính).","Phải đội mũ bảo hiểm khi trời mưa gió hoặc trời quá nắng; có thể sử dụng ô, điện thoại di động, thiết bị âm thanh nhưng phải bảo đảm an toàn.","Phải đội mũ bảo hiểm khi cảm thấy mất an toàn giao thông hoặc khi chuẩn bị di chuyển quãng đường xa."],"a":1,"img":null,"ee":"Cầm điện thoại làm mất tay điều khiển và phân tán mắt khỏi đường. Do đó phương án phù hợp là: Phải đội mũ bảo hiểm theo đúng quy chuẩn kỹ thuật quốc gia và cài quai đúng quy cách, không sử dụng ô, điện thoại di động, thiết bị âm thanh (trừ thiết bị trợ thính).","ed":"Mũ bảo hiểm chỉ phát huy tác dụng khi đúng quy chuẩn và cài quai đúng cách để không bị tuột/văng khi va chạm. Câu hỏi yêu cầu đúng đối tượng và cách sử dụng nên chọn: Phải đội mũ bảo hiểm theo đúng quy chuẩn kỹ thuật quốc gia và cài quai đúng quy cách, không sử dụng ô, điện thoại di động, thiết bị âm thanh (trừ thiết bị trợ thính)."},{"id":77,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Thứ tự xuống phà như thế nào là đúng quy tắc giao thông?","o":["Xe thô sơ, người đi bộ xuống trước, xe cơ giới, xe máy chuyên dùng xuống sau.","Xe cơ giới, xe máy chuyên dùng xuống trước, xe thô sơ, người đi bộ xuống sau.","Xe cơ giới, xe thô sơ xuống trước, xe máy chuyên dùng, người đi bộ xuống sau."],"a":2,"img":null,"ee":"Khi xuống phà, xe cơ giới và xe máy chuyên dùng xuống trước, sau đó mới đến xe thô sơ và người đi bộ. Đây là thứ tự riêng của việc xuống phà.","ed":"Bộ đề xác định nội dung đúng là: “Xe cơ giới, xe máy chuyên dùng xuống trước, xe thô sơ, người đi bộ xuống sau”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe cơ giới, xe thô sơ xuống trước, xe máy chuyên dùng, người đi bộ xuống sau” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":78,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường có nhiều làn đường cho xe đi cùng chiều được phân biệt bằng vạch kẻ phân làn đường, người điều khiển phương tiện tham gia giao thông đường bộ phải cho xe đi như thế nào?","o":["Cho xe đi trên bất kỳ làn đường nào hoặc giữa 02 làn đường nếu không có xe đi phía trước; khi cần thiết phải chuyển làn đường, người lái xe phải quan sát xe phía trước để bảo đảm an toàn.","Phải cho xe đi trong một làn đường và chỉ được chuyển làn đường ở những nơi cho phép; mỗi lần chuyển làn đường chỉ được phép chuyển sang một làn đường","Phải cho xe đi trong một làn đường, chỉ được chuyển làn đường khi vượt xe phía trước cùng làn đường."],"a":2,"img":null,"ee":"Có nhiều làn thì vẫn phải chạy gọn trong một làn. Mỗi lần chỉ chuyển sang một làn liền kề, báo trước và chỉ chuyển khi khoảng trước - sau - hai bên đều an toàn.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Phải cho xe đi trong một làn đường và chỉ được chuyển làn đường ở những nơi cho phép; mỗi lần chuyển làn đường chỉ được phép chuyển sang một làn đường."},{"id":79,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường một chiều có vạch kẻ phân làn đường, xe thô sơ và xe cơ giới phải đi như thế nào là đúng quy tắc giao thông?","o":["Xe thô sơ phải đi trên làn đường bên trái, xe cơ giới, xe máy chuyên dùng đi trên làn đường bên phải trong cùng.","Xe thô sơ phải đi trên làn đường bên phải trong cùng, xe cơ giới, xe máy chuyên dùng đi trên làn đường bên trái.","Xe thô sơ phải đi trên làn đường bên phải trong cùng, xe cơ giới, xe máy chuyên dùng được đi trên tất cả các làn đường."],"a":2,"img":null,"ee":"Trên đường một chiều có phân làn, xe thô sơ đi làn phải trong cùng; xe cơ giới và xe máy chuyên dùng đi các làn phía trái. Hiểu đơn giản: xe chậm, nhỏ đi sát phải.","ed":"Bộ đề xác định nội dung đúng là: “Xe thô sơ phải đi trên làn đường bên phải trong cùng, xe cơ giới, xe máy chuyên dùng đi trên làn đường bên trái”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe thô sơ phải đi trên làn đường bên phải trong cùng, xe cơ giới, xe máy chuyên dùng được đi trên tất cả các làn…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":80,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi lái xe trong đô thị và khu đông dân cư trong thời gian từ 22 giờ ngày hôm trước đến 05 giờ ngày hôm sau, nếu cần vượt một xe khác, người lái xe phải báo hiệu như thế nào là đúng quy tắc giao thông?","o":["Chỉ được báo hiệu bằng còi.","Phải báo hiệu bằng cả còi và đèn.","Chỉ được báo hiệu bằng đèn."],"a":3,"img":null,"ee":"Ban đêm từ 22h đến 05h trong đô thị/khu đông dân cư, xin vượt bằng đèn thay vì còi để không gây ồn. Vì vậy câu này chọn “chỉ báo hiệu bằng đèn”.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Chỉ được báo hiệu bằng đèn."},{"id":81,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển xe chạy trên đường, biết có xe sau xin vượt, nếu đủ điều kiện an toàn người điều khiển phương tiện phải làm gì?","o":["Tăng tốc độ và ra hiệu cho xe sau vượt, không được gây trở ngại cho xe xin vượt.","Giảm tốc độ, có tín hiệu rẽ phải để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết được vượt và đi sát về bên phải của phần đường xe chạy cho đến khi xe sau đã vượt qua, không được cản trở đối với xe xin vượt.","Cho xe đi sát về bên trái của phần đường xe chạy và ra hiệu cho xe sau vượt, không được gây trở ngại cho xe xin vượt."],"a":2,"img":null,"ee":"Nếu cho xe sau vượt, hãy tạo điều kiện rõ ràng: giảm tốc + xi-nhan phải + đi sát phải cho đến khi xe sau vượt xong.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Giảm tốc độ, có tín hiệu rẽ phải để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết được vượt và đi sát về bên phải của phần đường xe chạy cho đến khi xe sau đã vượt qua, không được cản trở…."},{"id":82,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển xe chạy trên đường, biết có xe sau xin vượt, nếu không đủ điều kiện an toàn người điều khiển phương tiện phải làm gì?","o":["Có tín hiệu rẽ trái để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết là chưa được vượt.","Tiếp tục đi cho đến khi đủ điều kiện an toàn, nếu xe sau vẫn xin vượt thì báo hiệu cho xe sau vượt.","Tăng tốc độ để báo hiệu cho xe xin vượt biết là chưa được vượt."],"a":1,"img":null,"ee":"Nếu chưa an toàn để xe sau vượt, bật tín hiệu rẽ trái để báo “chưa vượt được”. Không tăng tốc để chặn xe sau.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Có tín hiệu rẽ trái để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết là chưa được vượt."},{"id":83,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi chuyển hướng, người lái xe, người điều khiển xe máy chuyên dùng phải làm gì để bảo đảm an toàn?","o":["Phải nhường đường cho người đi bộ, xe thô sơ, xe đi ngược chiều và chỉ chuyển","Nhanh chóng chuyển hướng để không gây trở ngại hoặc nguy hiểm cho người, phương tiện khác.","Ra tín hiệu chuyển hướng để yêu cầu các phương tiện khác dừng lại cho xe chuyển hướng di chuyển."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Phải nhường đường cho người đi bộ, xe thô sơ, xe đi ngược chiều và chỉ chuyển. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Phải nhường đường cho người đi bộ, xe thô sơ, xe đi ngược chiều và chỉ chuyển."},{"id":84,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trước khi chuyển hướng, người điều khiển phương tiện tham gia giao thông đường bộ phải thực hiện như thế nào để bảo đảm an toàn?","o":["Quan sát gương, nếu không có phương tiện gần hướng rẽ thì nhanh chóng chuyển hướng.","Quan sát, bảo đảm khoảng cách an toàn với xe phía sau, giảm tốc độ và có tín hiệu báo hướng rẽ hoặc có tín hiệu bằng tay theo hướng rẽ đối với xe thô sơ không có đèn báo hướng rẽ, chuyển dần sang làn gần nhất với hướng rẽ. Tín hiệu báo hướng rẽ hoặc tín hiệu bằng tay phải sử dụng liên tục trong quá trình chuyển hướng. Khi bảo đảm an toàn, không gây trở ngại cho người và phương tiện khác mới được chuyển hướng.","Quan sát gương, tăng tốc độ, ra tín hiệu và chuyển hướng."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Quan sát, bảo đảm khoảng cách an toàn với xe phía sau, giảm tốc độ và có tín hiệu báo hướng rẽ hoặc có tín hiệu bằng tay theo hướng rẽ đối với xe thô sơ không có đèn báo….","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Quan sát, bảo đảm khoảng cách an toàn với xe phía sau, giảm tốc độ và có tín hiệu báo hướng rẽ hoặc có tín hiệu bằng tay theo hướng rẽ đối với xe thô sơ không có đèn báo hướng rẽ, chuyển dần sang làn gần nhất với hướng rẽ. Tín…."},{"id":85,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi lùi xe, người điều khiển phương tiện tham gia giao thông đường bộ phải làm gì để bảo đảm an toàn?","o":["Quan sát phía sau và cho lùi xe ở tốc độ chậm.","Có tín hiệu báo lùi, nếu phía sau không có người hoặc phương tiện khác thì nhanh chóng lùi để bảo đảm an toàn.","Phải quan sát hai bên và phía sau xe, có tín hiệu lùi và chỉ lùi xe khi bảo đảm an toàn."],"a":3,"img":null,"ee":"Lùi xe có điểm mù lớn nên phải nhìn cả hai bên lẫn phía sau, có tín hiệu lùi và chỉ lùi khi chắc chắn không có người/xe cắt qua.","ed":"Quay đầu hoặc lùi xe làm phương tiện cắt qua hướng di chuyển bình thường nên chỉ thực hiện ở nơi tầm nhìn và không gian bảo đảm, không thuộc vị trí bị cấm. Câu hỏi nêu đúng một trường hợp cụ thể; đối chiếu điều kiện đó, đáp án là: Phải quan sát hai bên và phía sau xe, có tín hiệu lùi và chỉ lùi xe khi bảo đảm an toàn."},{"id":86,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi muốn lùi xe ở nơi có tầm nhìn bị che khuất, người lái xe phải xử lý như thế nào để đảm bảo an toàn?","o":["Phải lùi thật chậm.","Bấm còi 3 lần liên tiếp trước khi lùi.","Không được lùi xe."],"a":3,"img":null,"ee":"Tầm nhìn đã bị che mà còn lùi thì bạn không biết phía sau có người hay xe hay không. Vì vậy trường hợp này không được lùi, chứ không phải “lùi thật chậm là được”.","ed":"Quay đầu hoặc lùi xe làm phương tiện cắt qua hướng di chuyển bình thường nên chỉ thực hiện ở nơi tầm nhìn và không gian bảo đảm, không thuộc vị trí bị cấm. Câu hỏi nêu đúng một trường hợp cụ thể; đối chiếu điều kiện đó, đáp án là: Không được lùi xe."},{"id":87,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường không phân chia thành hai chiều xe chạy riêng biệt, người điều khiển phương tiện tham gia giao thông đường bộ phải tránh xe đi ngược chiều như thế nào để bảo đảm an toàn?","o":["Giảm tốc độ và cho xe đi về bên phải theo chiều xe chạy của mình.","Một trong hai xe phải dừng lại cho xe kia đi qua mới được đi.","Tăng tốc độ, cho xe đi về bên phải theo chiều xe chạy của mình để nhanh chóng vượt qua."],"a":1,"img":null,"ee":"Gặp xe ngược chiều trên đường chưa tách hai chiều, cả hai phải giảm tốc và đi về bên phải phần đường của mình để tăng khoảng cách an toàn.","ed":"Bộ đề xác định nội dung đúng là: “Giảm tốc độ và cho xe đi về bên phải theo chiều xe chạy của mình”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng tốc độ, cho xe đi về bên phải theo chiều xe chạy của mình để nhanh chóng vượt qua” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":88,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tránh xe đi ngược chiều, các xe phải nhường đường như thế nào là đúng quy tắc giao thông?","o":["Nơi đường hẹp chỉ đủ cho một xe chạy và có chỗ tránh xe thì xe nào ở gần chỗ tránh hơn phải vào vị trí tránh, nhường đường cho xe đi ngược chiều.","Xe xuống dốc phải nhường đường cho xe lên dốc.","Xe có chướng ngại vật phía trước phải nhường đường cho xe không có chướng ngại vật phía trước.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba nguyên tắc đều đúng: gần chỗ tránh hơn thì vào chỗ tránh; xe xuống dốc nhường xe lên dốc; xe có chướng ngại phía trước nhường xe không bị chướng ngại. Vì vậy chọn “Cả ba ý trên”.","ed":"Có ba quy tắc cùng xuất hiện: xe gần chỗ tránh hơn thì vào chỗ tránh; xe xuống dốc nhường xe lên dốc; xe có chướng ngại vật phía trước nhường xe không có chướng ngại. Cả ba đều nhằm để xe ở vị trí khó xử lý hơn được đi trước, tránh hai xe cùng tiến vào đoạn hẹp. Vì cả ba ý đều đúng nên chọn “Cả ba ý trên”."},{"id":89,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi đang lái xe xuống dốc gặp một xe đang đi lên dốc, người lái xe phải làm gì?","o":["Tiếp tục đi và phát tín hiệu cho xe lên dốc nhường đường cho xe bạn.","Nhường đường cho xe lên dốc.","Chỉ nhường đường khi xe lên dốc nháy đèn."],"a":2,"img":null,"ee":"Xe xuống dốc phải nhường xe lên dốc. Xe đang leo dốc mà phải dừng sẽ khó khởi hành lại và dễ tụt hơn, nên được ưu tiên đi trước.","ed":"Khi hai xe gặp nhau trên dốc, xe đang xuống dốc có lợi thế hơn vì dễ dừng và khởi hành lại. Xe đang lên dốc nếu phải dừng sẽ khó khởi hành hơn và dễ tụt. Vì vậy xe xuống dốc phải nhường xe lên dốc; không cần chờ xe kia nháy đèn xin đường."},{"id":90,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe phải làm gì để bảo đảm an toàn khi lái xe trên đường cong có tầm nhìn bị hạn chế?","o":["Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn.","Đi sang làn đường của xe ngược chiều để mở rộng tầm nhìn và vượt xe khác.","Cho xe đi sát bên phải làn đường, bật tín hiệu báo hiệu để vượt bên phải xe khác."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn.","ed":"Bộ đề xác định nội dung đúng là: “Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Cho xe đi sát bên phải làn đường, bật tín hiệu báo hiệu để vượt bên phải xe khác” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":91,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại nơi đường giao nhau, người lái xe đang đi trên đường không ưu tiên, đường nhánh phải nhường đường như thế nào là đúng quy tắc giao thông?","o":["Nhường đường cho xe đi ở bên phải mình tới.","Nhường đường cho xe đi ở bên trái mình tới.","Nhường đường cho xe đi trên đường ưu tiên hoặc đường chính từ bất kỳ hướng nào tới."],"a":3,"img":null,"ee":"Xe từ đường nhánh/đường không ưu tiên phải nhường xe trên đường chính/đường ưu tiên từ mọi hướng. Ở đây “đường nào quan trọng hơn” được xét trước trái hay phải.","ed":"Khi đi từ đường nhánh hoặc đường không ưu tiên ra nơi giao nhau, phải nhường cho xe đang đi trên đường chính/đường ưu tiên từ bất kỳ hướng nào. Ở đây cấp đường được xét trước trái - phải. Vì vậy không chọn theo xe ở bên trái hay bên phải mình, mà chọn phương án nhường xe trên đường ưu tiên/đường chính."},{"id":92,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại nơi đường giao nhau có báo hiệu đi theo vòng xuyến, người lái xe phải nhường đường như thế nào là đúng quy tắc giao thông?","o":["Nhường đường cho xe đi đến từ bên phải.","Nhường đường cho xe đi đến từ bên trái.","Không phải nhường đường."],"a":2,"img":null,"ee":"Có vòng xuyến thì xe chuẩn bị vào vòng nhường xe đang chạy trong vòng, thường là xe đến từ bên trái. Có thể hiểu là không cắt ngang dòng xe đã vào vòng.","ed":"Có báo hiệu đi theo vòng xuyến thì xe chuẩn bị nhập vòng phải nhường xe đang chạy trong vòng. Trong bố cục giao thông bên phải như bộ đề, xe trong vòng sẽ đến từ phía bên trái của xe chuẩn bị nhập. Vì vậy câu này chọn “nhường đường cho xe đi đến từ bên trái”."},{"id":93,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại nơi đường giao nhau không có báo hiệu đi theo vòng xuyến, người điều khiển phương tiện phải nhường đường như thế nào là đúng quy tắc giao thông?","o":["Phải nhường đường cho xe đi đến từ bên phải.","Xe báo hiệu xin đường trước, xe đó được đi trước.","Phải nhường đường cho xe đi đến từ bên trái."],"a":1,"img":null,"ee":"Không có báo hiệu vòng xuyến thì tại giao nhau cùng cấp áp dụng quy tắc nhường xe bên phải.","ed":"Không có báo hiệu vòng xuyến thì áp dụng quy tắc giao nhau không có báo hiệu ưu tiên: nhường xe đến từ bên phải. Đây là cặp rất dễ đảo với câu vòng xuyến: có vòng xuyến nhường trái; không vòng xuyến nhường phải. Vì vậy phương án 1 đúng."},{"id":94,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe phải nhanh chóng giảm tốc độ, đi sát lề đường bên phải hoặc dừng lại để nhường đường cho các loại xe nào dưới đây?","o":["Xe chữa cháy của Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và xe chữa cháy của các lực lượng khác; xe của lực lượng quân sự, công an và kiểm sát; đoàn xe có xe Cảnh sát giao thông dẫn đường; xe cứu thương; xe hộ đê không có tín hiệu ưu tiên theo quy định.","Xe ưu tiên gồm xe chữa cháy của Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ và xe chữa cháy của các lực lượng khác được huy động đi làm nhiệm vụ chữa cháy; xe của lực lượng quân sự, công an và kiểm sát đi làm nhiệm vụ khẩn cấp; đoàn xe có xe Cảnh sát giao thông dẫn đường; xe cứu thương đi làm nhiệm vụ cấp cứu; xe hộ đê đi làm nhiệm vụ; xe đi làm nhiệm vụ cứu nạn, cứu hộ, khắc phục sự cố thiên tai, dịch bệnh hoặc xe đi làm nhiệm vụ trong tình trạng khẩn cấp theo quy định của pháp luật; đoàn xe tang.","Xe ô tô, xe máy, đoàn xe đang diễu hành có tổ chức có báo tín hiệu xin vượt bằng còi và đèn."],"a":2,"img":null,"ee":"Đây là nhóm xe ưu tiên khi đang làm nhiệm vụ. Khi cần xếp thứ tự, dùng: Hỏa → Quân/Công/Kiểm và đoàn CSGT dẫn → Thương → Hộ đê/Cứu nạn-khẩn cấp → Tang. Quân sự, Công an và Kiểm sát ở cùng một nhóm.","ed":"Điểm quan trọng không phải cứ nhìn thấy xe chữa cháy, cứu thương, quân sự… là mặc nhiên nhường, mà xe phải đang thực hiện đúng nhiệm vụ thuộc diện ưu tiên theo câu hỏi. Khi cần nhớ thứ tự nhóm ưu tiên, dùng: Hỏa → Quân/Công/Kiểm và đoàn CSGT dẫn → Thương → Hộ đê/Cứu nạn-khẩn cấp → Tang. Phương án 2 mô tả đầy đủ điều kiện “đang làm nhiệm vụ” của các nhóm này nên đúng."},{"id":95,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe ưu tiên (trừ đoàn xe tang) tham gia giao thông đường bộ khi đi làm nhiệm vụ được quyền ưu tiên nào dưới đây?","o":["Không bị hạn chế tốc độ.","Được phép đi không phụ thuộc vào tín hiệu đèn giao thông, đi vào đường ngược chiều, các đường khác có thể đi được.","Được đi ngược chiều trên làn dừng xe khẩn cấp trên đường cao tốc.","Cả ba ý trên."],"a":4,"img":null,"ee":"Xe ưu tiên đang làm nhiệm vụ được quyền đi đặc biệt để xử lý việc khẩn cấp: có thể vượt giới hạn tốc độ, không phụ thuộc tín hiệu trong phạm vi luật cho phép và có quy định riêng khi đi ngược chiều. Vì cả ba ý đều nêu các quyền đó nên chọn “Cả ba”.","ed":"Câu này hỏi quyền của xe ưu tiên khi đang làm nhiệm vụ. Bộ câu hỏi cho phép ba quyền nêu trong các ý: không bị hạn chế tốc độ; có thể đi không phụ thuộc tín hiệu đèn và đi vào đường ngược chiều theo quy định; trên cao tốc được đi ngược chiều trên làn dừng xe khẩn cấp. Vì cả ba ý thành phần đều đúng nên chọn “Cả ba ý trên”."},{"id":96,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi có tín hiệu của xe ưu tiên, người và phương tiện tham gia giao thông đường bộ phải tuân thủ quy định nào dưới đây?","o":["Giảm tốc độ, đi sát lề đường bên phải hoặc dừng lại để nhường đường.","Tăng tốc độ và đi sát lề đường bên phải để nhường đường.","Giảm tốc độ, đi sát lề đường bên trái để nhường đường."],"a":1,"img":null,"ee":"Nghe tín hiệu xe ưu tiên thì việc của xe thường là mở đường: giảm tốc, sát lề phải hoặc dừng lại. Tuyệt đối không tăng tốc hay bám theo xe ưu tiên để “đi ké”.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Giảm tốc độ, đi sát lề đường bên phải hoặc dừng lại để nhường đường."},{"id":97,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi đang lái xe, phía trước có một xe Cảnh sát giao thông không phát tín hiệu ưu tiên, người lái xe có được phép vượt hay không?","o":["Không được vượt.","Được phép vượt ở phần đường dành cho người đi bộ qua đường.","Được vượt khi bảo đảm an toàn."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Được vượt khi bảo đảm an toàn. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Được vượt khi bảo đảm an toàn."},{"id":98,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi đang lái xe, phía trước có một xe cứu thương đang phát tín hiệu ưu tiên, người lái xe có được phép vượt hay không?","o":["Không được vượt.","Được vượt khi đang đi trên cầu.","Được phép vượt khi đi qua nơi giao nhau có ít phương tiện cùng tham gia giao","Được vượt khi bảo đảm an toàn."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Không được vượt. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Không được vượt."},{"id":99,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tới đường ngang không có người gác, chắn đường bộ, chuông, đèn tín hiệu, người tham gia giao thông đường bộ phải làm gì để bảo đảm an toàn?","o":["Dừng lại về bên phải đường của mình, trước vạch dừng xe và quan sát hai phía, khi không có phương tiện giao thông đường sắt tới mới được đi qua.","Quan sát hai phía, khi không có phương tiện giao thông đường sắt tới thì nhanh chóng đi qua.","Dừng lại khoảng cách tối thiểu 3 mét tính từ ray đường sắt gần nhất, khi không có phương tiện giao thông đường sắt tới thì nhanh chóng đi qua."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Dừng lại về bên phải đường của mình, trước vạch dừng xe và quan sát hai phía, khi không có phương tiện giao thông đường sắt tới mới được đi qua. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Dừng lại về bên phải đường của mình, trước vạch dừng xe và quan sát hai phía, khi không có phương tiện giao thông đường sắt tới mới được đi qua."},{"id":100,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại đường ngang, cầu chung đường sắt, khi có hiệu lệnh của nhân viên gác chắn, đèn đỏ sáng nhấp nháy, chuông kêu, chắn đường bộ đang dịch chuyển hoặc đã đóng, người tham gia giao thông đường bộ phải làm gì để bảo đảm an toàn?","o":["Dừng lại về bên trái đường của mình, trước vạch dừng xe.","Dừng lại giữa đường của mình, trước vạch dừng xe.","Dừng lại về bên phải đường của mình, trước vạch dừng xe."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Dừng lại về bên phải đường của mình, trước vạch dừng xe. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Dừng lại về bên phải đường của mình, trước vạch dừng xe."},{"id":101,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi xe ô tô bị hư hỏng, bị tai nạn trên đường ngang, cầu chung đường sắt mà không thể di chuyển ngay khỏi phạm vi an toàn đường sắt, người lái xe và người có mặt xử lý như thế nào là đúng quy định?","o":["Người lái xe và người có mặt phải ngay lập tức báo hiệu để dừng tàu, thực hiện các biện pháp bảo đảm an toàn.","Để xe lại, tìm cách báo cho người quản lý đường sắt, nhà ga nơi gần nhất.","Không di chuyển phương tiện, tự khắc phục sửa chữa."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Người lái xe và người có mặt phải ngay lập tức báo hiệu để dừng tàu, thực hiện các biện pháp bảo đảm an toàn. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Người lái xe và người có mặt phải ngay lập tức báo hiệu để dừng tàu, thực hiện các biện pháp bảo đảm an toàn”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Để xe lại, tìm cách báo cho người quản lý đường sắt, nhà ga nơi gần nhất” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":102,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người tham gia giao thông đường bộ phải dừng lại về bên phải đường của mình trước vạch dừng xe tại đường ngang, cầu chung đường sắt khi có báo hiệu nào dưới đây?","o":["Hiệu lệnh của nhân viên gác chắn.","Đèn đỏ sáng nhấp nháy, chuông kêu.","Chắn đường bộ đang dịch chuyển hoặc đã đóng.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Hiệu lệnh của nhân viên gác chắn; 2) Đèn đỏ sáng nhấp nháy, chuông kêu; 3) Chắn đường bộ đang dịch chuyển hoặc đã đóng. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Hiệu lệnh của nhân viên gác chắn; ý 2: Đèn đỏ sáng nhấp nháy, chuông kêu; ý 3: Chắn đường bộ đang dịch chuyển hoặc đã đóng. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":103,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông trong hầm đường bộ ngoài việc phải tuân thủ các quy tắc giao thông còn phải thực hiện những quy định nào dưới đây?","o":["Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu gần; xe thô sơ phải bật đèn lái xe, người điều khiển xe máy chuyên dùng phải đưa xe vào vị trí dừng xe, đỗ xe khẩn cấp, nếu không di chuyển được, phải có báo hiệu bằng đèn khẩn cấp và đặt biển hoặc đèn cảnh báo về phía sau xe khoảng cách bảo đảm an toàn.","Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu xa; được dừng xe, đỗ xe khi cần thiết.","Phải cho xe chạy trên một làn đường và chỉ chuyển làn ở nơi được phép; được quay đầu xe, lùi xe khi cần thiết."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu gần. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu gần; xe thô sơ phải bật đèn lái xe, người điều khiển xe máy chuyên dùng phải đưa xe vào vị trí dừng xe, đỗ xe khẩn cấp, nếu không di chuyển được, phải có báo hiệu bằng đèn…."},{"id":104,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc nối giữa xe kéo với xe được kéo trong trường hợp hệ thống hãm của xe được kéo không còn hiệu lực thì xe kéo nhau phải nối bằng cách nào?","o":["Nối bằng dây cáp có độ dài 6 mét.","Nối bằng dây cáp có độ dài 8 mét.","Nối bằng thanh nối cứng."],"a":3,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Nối bằng thanh nối cứng.","ed":"Bộ đề xác định nội dung đúng là: “Nối bằng thanh nối cứng”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nối bằng dây cáp có độ dài 6 mét” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":105,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe kéo rơ moóc, xe ô tô đầu kéo khi tham gia giao thông đường bộ phải tuân thủ quy tắc giao thông nào ghi ở dưới đây?","o":["Chỉ được kéo rơ moóc, sơ mi rơ moóc phù hợp với thiết kế của xe; việc kết nối xe kéo với rơ moóc, xe ô tô đầu kéo với sơ mi rơ moóc phải bảo đảm chắc chắn, an toàn.","Phải có tổng trọng lượng tương đương tổng trọng lượng của rơ moóc hoặc phải có hệ thống hãm có hiệu lực cho rơ moóc.","Phải được lắp phanh phụ theo quy định để đảm bảo an toàn."],"a":1,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Chỉ được kéo rơ moóc, sơ mi rơ moóc phù hợp với thiết kế của xe.","ed":"Bộ đề xác định nội dung đúng là: “Chỉ được kéo rơ moóc, sơ mi rơ moóc phù hợp với thiết kế của xe; việc kết nối xe kéo với rơ moóc, xe ô tô đầu kéo với sơ mi rơ moóc phải bảo đảm chắc chắn, an toàn”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phải được lắp phanh phụ theo quy định để đảm bảo an toàn” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":106,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Luật Trật tự, an toàn giao thông đường bộ quy định về xe kéo xe, xe kéo rơ moóc và xe ô tô đầu kéo kéo sơ mi rơ moóc như thế nào dưới đây?","o":["Một xe ô tô được kéo theo nhiều xe ô tô hoặc xe máy chuyên dùng khác khi xe được kéo không tự chạy được (trừ trường hợp xe vận chuyển hàng siêu trường, siêu trọng).","Xe được kéo phải có người điều khiển và hệ thống lái của xe đó phải còn hiệu lực; việc nối xe kéo với xe được kéo phải bảo đảm chắc chắn, an toàn; trường hợp hệ thống hãm của xe được kéo không còn hiệu lực thì xe kéo nhau phải nối bằng thanh nối cứng. Phía trước của xe kéo và phía sau của xe được kéo phải có biển báo hiệu, có đèn cảnh báo nhấp nháy màu vàng.","Cả hai ý trên."],"a":2,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Do đó phương án phù hợp là: Xe được kéo phải có người điều khiển và hệ thống lái của xe đó phải còn hiệu lực.","ed":"Hệ thống lái truyền thao tác của người lái tới bánh dẫn hướng để thay đổi hướng chuyển động của xe. Vì vậy chức năng chính là điều khiển hướng, không phải giảm tốc hoặc truyền công suất động cơ. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Xe được kéo phải có người điều khiển và hệ thống lái của xe đó phải còn hiệu lực; việc nối xe kéo với xe được kéo phải bảo đảm chắc chắn, an toàn; trường hợp hệ thống hãm của xe được kéo không còn…."},{"id":107,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ phải quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn trong các trường hợp nào dưới đây?","o":["Có báo hiệu cảnh báo nguy hiểm hoặc có chướng ngại vật trên đường; chuyển","Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; có vật nuôi đi trên đường hoặc chăn thả ở ven đường.","Điểm dừng xe, đỗ xe trên đường bộ có khách đang lên, xuống xe.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Có báo hiệu cảnh báo nguy hiểm hoặc có chướng ngại vật trên đường; 2) Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; 3) Điểm dừng xe, đỗ xe trên đường bộ có khách đang lên, xuống xe. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Có báo hiệu cảnh báo nguy hiểm hoặc có chướng ngại vật trên đường; chuyển; ý 2: Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; có vật nuôi đi trên đường hoặc chăn thả ở ven đường; ý 3: Điểm dừng xe, đỗ xe trên đường bộ có khách đang lên, xuống xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":108,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường mà mỗi chiều đường xe chạy chỉ có một làn đường dành cho xe cơ giới, người lái xe không được vượt xe khác trong trường hợp nào dưới đây?","o":["Có chướng ngại vật phía trước, xe chạy phía trước có tín hiệu vượt xe khác.","Xe chạy phía trước đã có tín hiệu rẽ phải và tránh về bên phải.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Có chướng ngại vật phía trước, xe chạy phía trước có tín hiệu vượt xe khác. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Có chướng ngại vật phía trước, xe chạy phía trước có tín hiệu vượt xe khác."},{"id":109,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe được phép vượt xe khác về bên phải trong trường hợp nào dưới đây?","o":["Xe phía trước có tín hiệu rẽ trái hoặc đang rẽ trái hoặc khi xe chuyên dùng đang làm việc trên đường mà không thể vượt bên trái.","Xe phía trước đang đi sát lề đường bên trái.","Cả hai ý trên."],"a":1,"img":null,"ee":"Gạch chân hướng trước: TRÁI → TÍN HIỆU → RẼ TRÁI → Xe phía trước có tín hiệu rẽ trái hoặc đang rẽ trái hoặc khi xe chuyên dùng đang làm việc trên…","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Xe phía trước có tín hiệu rẽ trái hoặc đang rẽ trái hoặc khi xe chuyên dùng đang làm việc trên đường mà không thể vượt bên trái."},{"id":110,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi có xe xin vượt, người lái xe mô tô xử lý như thế nào nếu đủ điều kiện an toàn cho xe phía sau vượt?","o":["Giảm tốc độ, có tín hiệu rẽ phải để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết được vượt và đi sát về bên phải của phần đường xe chạy cho đến khi xe sau đã vượt qua, không được cản trở đối với xe xin vượt.","Lái xe vào lề đường bên trái và giảm tốc độ để xe phía sau vượt qua, không được gây trở ngại đối với xe xin vượt.","Tăng tốc độ, đi sát về bên phải của phần đường xe chạy cho đến khi xe sau đã vượt qua."],"a":1,"img":null,"ee":"Xe sau xin vượt mà đủ an toàn thì xe mô tô phía trước cũng phải giảm tốc, báo phải và đi sát phải. Mục tiêu là tạo hành lang rõ ràng cho xe sau vượt.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Giảm tốc độ, có tín hiệu rẽ phải để báo hiệu cho người điều khiển phương tiện tham gia giao thông đường bộ phía sau biết được vượt và đi sát về bên phải của phần đường xe chạy cho đến khi xe sau đã vượt qua, không được cản trở…."},{"id":111,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Những trường hợp nào dưới đây không được đi trên đường cao tốc, trừ người, phương tiện giao thông đường bộ và thiết bị phục vụ việc quản lý, bảo trì đường cao tốc?","o":["Xe máy chuyên dùng có tốc độ thiết kế nhỏ hơn tốc độ tối thiểu quy định đối với đường cao tốc, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ, xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô, xe gắn máy, xe thô sơ, người đi bộ.","Xe máy chuyên dùng có tốc độ thiết kế lớn hơn tốc độ tối thiểu quy định đối với đường cao tốc.","Xe ô tô và xe máy chuyên dùng có tốc độ thiết kế lớn hơn 80 km/h."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Xe máy chuyên dùng có tốc độ thiết kế nhỏ hơn tốc độ tối thiểu quy định đối với đường cao tốc, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ,….","ed":"Bộ đề xác định nội dung đúng là: “Xe máy chuyên dùng có tốc độ thiết kế nhỏ hơn tốc độ tối thiểu quy định đối với đường cao tốc, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ, xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô, xe gắn…”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe máy chuyên dùng có tốc độ thiết kế lớn hơn tốc độ tối thiểu quy định đối với đường cao tốc” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":112,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đường cao tốc, xe ưu tiên đi làm nhiệm vụ khẩn cấp được đi ngược chiều trong trường hợp nào dưới đây?","o":["Được đi ngược chiều bất cứ làn đường nào của đường cao tốc có thể đi được.","Chỉ được đi ngược chiều trên làn dừng xe khẩn cấp.","Chỉ được đi ngược chiều trên làn đường sát dải phân cách của đường cao tốc."],"a":2,"img":null,"ee":"Trên cao tốc, xe ưu tiên làm nhiệm vụ khẩn cấp nếu phải đi ngược chiều thì chỉ đi trên làn dừng khẩn cấp. Không được tùy ý chạy ngược ở bất kỳ làn nào.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Chỉ được đi ngược chiều trên làn dừng xe khẩn cấp."},{"id":113,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đường cao tốc, người lái xe không được thực hiện hành vi nào sau đây?","o":["Dừng, đỗ xe trên phần đường xe chạy, trừ trường hợp xe không thể di chuyển được vào làn đường khẩn cấp.","Lùi xe, quay đầu xe.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Dừng, đỗ xe trên phần đường xe chạy, trừ trường hợp xe không thể di chuyển được vào làn…; (2) Lùi xe, quay đầu xe. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Dừng, đỗ xe trên phần đường xe chạy, trừ trường hợp xe không thể di chuyển được vào làn đường khẩn cấp; ý 2: Lùi xe, quay đầu xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":114,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi xe gặp sự cố kỹ thuật trên đường cao tốc, bạn phải xử lý như thế nào để bảo đảm an toàn giao thông?","o":["Bật đèn tín hiệu khẩn cấp, dừng xe ngay lập tức và đặt biển báo hiệu nguy hiểm để cảnh báo cho các xe khác.","Bật tín hiệu khẩn cấp, lập tức đưa xe vào làn đường xe chạy bên phải trong cùng, đặt biển báo hiệu nguy hiểm để cảnh báo cho các xe khác.","Dừng xe, đỗ xe ở làn dừng khẩn cấp cùng chiều xe chạy và phải có báo hiệu bằng đèn khẩn cấp; trường hợp xe không thể di chuyển được vào làn dừng khẩn cấp, phải có báo hiệu bằng đèn khẩn cấp và đặt biển hoặc đèn cảnh báo về phía sau xe khoảng cách tối thiểu 150 mét, nhanh chóng báo cho cơ quan Cảnh sát giao thông thực hiện nhiệm vụ bảo đảm trật tự, an toàn giao thông trên tuyến hoặc cơ quan quản lý đường cao tốc."],"a":3,"img":null,"ee":"Xe hỏng trên cao tốc: cố đưa vào làn dừng khẩn cấp và bật cảnh báo. Nếu không đưa vào được, phải cảnh báo từ xa để xe sau có thời gian tránh và báo lực lượng quản lý.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Dừng xe, đỗ xe ở làn dừng khẩn cấp cùng chiều xe chạy và phải có báo hiệu bằng đèn khẩn cấp; trường hợp xe không thể di chuyển được vào làn dừng khẩn cấp, phải có báo hiệu bằng đèn khẩn cấp và đặt biển hoặc đèn cảnh báo về phía…."},{"id":115,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường cao tốc, người lái xe xử lý như thế nào khi đã vượt quá lối ra của đường định rẽ?","o":["Quay đầu xe, chạy trên lề đường có lối ra và rẽ khỏi đường cao tốc.","Lùi xe trên lề đường có lối ra và rẽ khỏi đường cao tốc.","Tiếp tục lái xe và rẽ ở lối ra tiếp theo."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Tiếp tục lái xe và rẽ ở lối ra tiếp theo. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Tiếp tục lái xe và rẽ ở lối ra tiếp theo."},{"id":116,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi xảy ra ùn tắc trên đường cao tốc có làn dừng xe khẩn cấp, người lái xe có được cho xe chạy ở làn dừng xe khẩn cấp để nhanh chóng thoát khỏi khu vực ùn tắc không (trừ xe ưu tiên)?","o":["Có.","Không."],"a":2,"img":null,"ee":"Làn dừng khẩn cấp không phải “làn thoát tắc”. Xe thường phải để làn này trống cho xe hỏng, cứu hộ và xe ưu tiên.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Không."},{"id":117,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi chuẩn bị nhập vào làn đường của đường cao tốc, người lái xe, người điều khiển xe máy chuyên dùng phải thực hiện như thế nào là đúng quy tắc giao thông?","o":["Có tín hiệu xin vào và phải nhường đường cho xe đang chạy trên đường.","Quan sát xe phía sau bảo đảm khoảng cách an toàn mới cho xe nhập vào làn đường sát bên phải.","Nếu có làn đường tăng tốc thì phải cho xe chạy trên làn đường đó trước khi nhập vào làn đường của đường cao tốc.","Cả ba ý trên."],"a":4,"img":null,"ee":"Xe nhập cao tốc là xe “xin vào dòng đang chạy”, nên phải bật tín hiệu và nhường xe đã ở trên cao tốc. Chỉ nhập khi có khoảng trống an toàn.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Có tín hiệu xin vào và phải nhường đường cho xe đang chạy trên đường; ý 2: Quan sát xe phía sau bảo đảm khoảng cách an toàn mới cho xe nhập vào làn đường sát bên phải; ý 3: Nếu có làn đường tăng tốc thì phải cho xe chạy trên làn đường đó trước khi nhập vào làn đường của đường cao tốc. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":118,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo quy định về độ tuổi, người đủ bao nhiêu tuổi trở lên thì được cấp giấy phép lái xe ô tô tải và ô tô chuyên dùng có khối lượng toàn bộ theo thiết kế trên 3.500 kg đến 7.500 kg; các loại xe ô tô tải quy định cho giấy phép lái xe hạng C1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg?","o":["18 tuổi.","17 tuổi.","16 tuổi."],"a":1,"img":null,"ee":"Mốc tuổi trong câu gắn với đúng loại xe/hạng giấy phép đang hỏi: 18 tuổi. Loại xe càng lớn/chở nhiều người thì điều kiện tuổi thường chặt hơn, nên phải đọc đúng đối tượng trước khi chọn số.","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: 18 tuổi; các con số khác không áp dụng cho trường hợp này."},{"id":119,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo quy định về độ tuổi, người đủ bao nhiêu tuổi trở lên thì được cấp giấy phép lái xe mô tô hai bánh có dung tích xi lanh đến 125 cm3 và xe ô tô chở người đến 8 chỗ (không kể chỗ của người lái xe); xe ô tô tải và ô tô chuyên dùng có khối lượng toàn bộ theo thiết kế đến 3.500 kg?","o":["16 tuổi.","17 tuổi","18 tuổi."],"a":3,"img":null,"ee":"Mốc tuổi trong câu gắn với đúng loại xe/hạng giấy phép đang hỏi: 18 tuổi. Loại xe càng lớn/chở nhiều người thì điều kiện tuổi thường chặt hơn, nên phải đọc đúng đối tượng trước khi chọn số.","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: 18 tuổi; các con số khác không áp dụng cho trường hợp này."},{"id":120,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo quy định về độ tuổi, người lái xe ô tô chở người (kể cả xe buýt) trên 29 chỗ (không kể chỗ của người lái xe); xe ô tô chở người giường nằm; các loại xe ô tô chở người quy định cho giấy phép lái xe hạng D kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg phải đủ bao nhiêu tuổi trở lên?","o":["23 tuổi.","24 tuổi.","27 tuổi.","30 tuổi."],"a":3,"img":null,"ee":"Mốc tuổi trong câu gắn với đúng loại xe/hạng giấy phép đang hỏi: 27 tuổi. Loại xe càng lớn/chở nhiều người thì điều kiện tuổi thường chặt hơn, nên phải đọc đúng đối tượng trước khi chọn số.","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: 27 tuổi; các con số khác không áp dụng cho trường hợp này."},{"id":121,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tuổi tối đa của người lái xe ô tô chở người (kể cả xe buýt) trên 29 chỗ (không kể chỗ của người lái xe), xe ô tô chở người giường nằm là bao nhiêu tuổi?","o":["Đủ 55 tuổi đối với nam và đủ 50 tuổi đối với nữ.","Đủ 55 tuổi đối với nam và nữ.","Đủ 57 tuổi đối với nam và đủ 55 tuổi đối với nữ."],"a":3,"img":null,"ee":"Mốc tuổi tối đa của lái xe chở người trên 29 chỗ/xe giường nằm là 57 tuổi với nam và 55 tuổi với nữ. Đây là giới hạn tối đa, không phải tuổi tối thiểu để được cấp bằng.","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: Đủ 57 tuổi đối với nam và đủ 55 tuổi đối với nữ; các con số khác không áp dụng cho trường hợp này."},{"id":122,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Theo quy định về độ tuổi, người lái xe ô tô chở người (kể cả xe buýt) trên 16 chỗ (không kể chỗ của người lái xe) đến 29 chỗ (không kể chỗ của người lái xe); các loại xe ô tô chở người quy định cho giấy phép lái xe hạng D2 kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg phải đủ bao nhiêu tuổi trở lên?","o":["23 tuổi.","24 tuổi.","22 tuổi."],"a":2,"img":null,"ee":"Mốc tuổi trong câu gắn với đúng loại xe/hạng giấy phép đang hỏi: 24 tuổi. Loại xe càng lớn/chở nhiều người thì điều kiện tuổi thường chặt hơn, nên phải đọc đúng đối tượng trước khi chọn số.","ed":"Đây là mốc tuổi gắn với đúng loại xe/hạng giấy phép mà câu hỏi nêu. Không nên học con số tách rời; hãy gắn mốc với đối tượng cụ thể trong câu. Bộ đề xác định mốc đúng là: 24 tuổi; các con số khác không áp dụng cho trường hợp này."},{"id":123,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người đủ 16 tuổi đến dưới 18 tuổi chỉ được điều khiển các loại xe nào dưới đây?","o":["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3.","Xe gắn máy.","Xe ô tô chở người đến 08 chỗ (không kể chỗ của người lái xe); xe ô tô tải và ô tô chuyên dùng có khối lượng toàn bộ theo thiết kế đến 3.500 kg; các loại xe ô tô quy định cho giấy phép lái xe hạng B kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg.","Cả ba ý trên."],"a":2,"img":null,"ee":"Từ đủ 16 đến dưới 18 tuổi chỉ được điều khiển xe gắn máy trong nhóm đáp án này. Các loại xe yêu cầu GPLX/độ tuổi cao hơn chưa được phép.","ed":"Bộ đề xác định nội dung đúng là: “Xe gắn máy”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":124,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe mô tô hạng A1 không được phép điều khiển loại xe nào dưới đây?","o":["Xe mô tô hai bánh có dung tích xi-lanh 125 cm3 hoặc có công suất động cơ điện đến 11 kW.","Xe mô tô ba bánh.","Cả hai ý trên."],"a":2,"img":null,"ee":"Hạng A1 không cho phép lái mô tô ba bánh. Hãy tách rõ A1 (mô tô hai bánh trong phạm vi quy định) với phương tiện ba bánh.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Xe mô tô ba bánh. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":125,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe mô tô hạng A1 được cấp sau ngày 01/01/2025 được phép điều khiển loại xe nào dưới đây?","o":["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW.","Xe mô tô ba bánh.","Cả hai ý trên."],"a":1,"img":null,"ee":"A1 cấp từ 01/01/2025 áp dụng cho mô tô hai bánh đến 125 cm³ hoặc động cơ điện đến 11 kW. Hai mốc 125 cm³ và 11 kW là hai cách giới hạn cho động cơ xăng và điện.","ed":"Bộ đề xác định nội dung đúng là: “Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe mô tô ba bánh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":126,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe mô tô hạng A được phép điều khiển loại xe nào dưới đây?","o":["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW.","Xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 hoặc có công suất động cơ điện trên 11 kW.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11…; (2) Xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 hoặc có công suất động cơ điện trên…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ o giấy phép lái xe hạng C kéo rơ…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":130,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe hạng D1 được điều khiển loại xe nào dưới đây?","o":["Xe ô tô chở người (kể cả xe buýt) trên 16 chỗ (không kể chỗ của người lái xe) đến 29 chỗ (không kể chỗ của người lái xe); các loại xe ô tô chở người quy định cho giấy phép lái xe hạng D1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg.","Xe ô tô chở người trên 08 chỗ (không kể chỗ của người lái xe) đến 16 chỗ (không kể chỗ của người lái xe); các loại xe ô tô chở người quy định cho giấy phép lái xe hạng D1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg.","Cả hai ý trên."],"a":2,"img":null,"ee":"Đừng chỉ nhìn con số; hãy gắn hạng bằng với loại xe và giới hạn kéo/chở trong câu. Ở đây phạm vi đúng là: Xe ô tô chở người trên 08 chỗ (không kể chỗ của người lái xe) đến 16 chỗ (không kể chỗ của người lái xe).","ed":"Bộ đề xác định nội dung đúng là: “Xe ô tô chở người trên 08 chỗ (không kể chỗ của người lái xe) đến 16 chỗ (không kể chỗ của người lái xe); các loại xe ô tô chở người quy định cho giấy phép lái xe hạng D1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế đến 750 kg”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe ô tô chở người (kể cả xe buýt) trên 16 chỗ (không kể chỗ của người lái xe) đến 29 chỗ (không kể chỗ của người…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":131,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe hạng D2 được điều khiển loại xe nào dưới đây?","o":["Xe ô tô chở người (kể cả xe buýt) trên 16 chỗ (không kể chỗ của người lái xe) đến 29 chỗ (không kể chỗ của người lái xe); các loại xe ô tô chở người qu  rơ moóc.","Các loại xe ô tô quy định cho giấy phép lái xe hạng D1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg.","Cả hai ý trên."],"a":1,"img":null,"ee":"CE là hạng C kèm khả năng kéo nặng: xe thuộc hạng C kéo rơ moóc trên 750 kg và cả đầu kéo kéo sơ mi rơ moóc. Vì vậy không chỉ nhìn chữ C mà phải chú ý phần “E = kéo”.","ed":"Bộ đề xác định nội dung đúng là: “Các loại xe ô tô quy định cho giấy phép lái xe hạng C kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg; xe ô tô đầu kéo kéo sơ mi rơ moóc”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Các loại xe ô tô quy định cho giấy phép lái xe hạng D1 kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":135,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có Giấy phép lái xe hạng DE được điều khiển loại xe nào dưới đây?","o":["Các loại xe ô tô quy định cho giấy phép lái xe hạng D kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg; xe ô tô chở khách nối toa.","Các loại xe ô tô quy định cho giấy phép lái xe hạng C kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg; xe ô tô đầu kéo kéo sơ mi rơ moóc.","Cả hai ý trên."],"a":1,"img":null,"ee":"DE là hạng D kèm kéo rơ moóc trên 750 kg; ngoài ra còn điều khiển xe khách nối toa. Có thể hiểu đây là nhóm chở người lớn kèm quyền kéo/nối toa.","ed":"Bộ đề xác định nội dung đúng là: “Các loại xe ô tô quy định cho giấy phép lái xe hạng D kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg; xe ô tô chở khách nối toa”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Các loại xe ô tô quy định cho giấy phép lái xe hạng C kéo rơ moóc có khối lượng toàn bộ theo thiết kế trên 750 kg;…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":136,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người tập lái xe ô tô khi tham gia giao thông đường bộ phải bảo đảm các điều kiện nào dưới đây?","o":["Phải thực hành trên xe tập lái, trên tuyến đường tập lái và có giáo viên dạy lái bảo trợ tay lái.","Phải mang theo giấy phép xe tập lái.","Cả hai ý trên."],"a":1,"img":null,"ee":"Tập lái trên đường không được tự chạy một mình. Phải có xe tập lái, đi đúng tuyến tập và có giáo viên bảo trợ tay lái để can thiệp khi cần.","ed":"Bộ đề xác định nội dung đúng là: “Phải thực hành trên xe tập lái, trên tuyến đường tập lái và có giáo viên dạy lái bảo trợ tay lái”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phải mang theo giấy phép xe tập lái” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":137,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe khi tham gia giao thông đường bộ phải đảm bảo các điều kiện nào dưới đây?","o":["Phải đủ tuổi, sức khỏe theo quy định của pháp luật; có giấy phép lái xe đang còn điểm, còn hiệu lực phù hợp với loại xe đang điều khiển do cơ quan có thẩm quyền cấp (trừ người lái xe gắn máy).","Phải là người đứng tên trong đăng ký xe.","Cả hai ý trên."],"a":1,"img":null,"ee":"Muốn lái xe hợp pháp cần đủ ba nhóm điều kiện: đúng tuổi/sức khỏe, có GPLX phù hợp còn hiệu lực và còn điểm. Thiếu một điều kiện thì chưa đủ điều kiện lái loại xe đó.","ed":"Bộ đề xác định nội dung đúng là: “Phải đủ tuổi, sức khỏe theo quy định của pháp luật; có giấy phép lái xe đang còn điểm, còn hiệu lực phù hợp với loại xe đang điều khiển do cơ quan có thẩm quyền cấp (trừ người lái xe gắn máy)”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phải là người đứng tên trong đăng ký xe” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":138,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông đường bộ, người lái xe phải mang theo các giấy tờ gì?","o":["Chứng nhận đăng ký xe hoặc bản sao Chứng nhận đăng ký xe có chứng thực kèm bản gốc giấy tờ xác nhận của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài còn hiệu lực trong trường hợp xe đang được thế chấp tại tổ chức tín dụng, chi nhánh ngân hàng nước ngoài.","Giấy phép lái xe phù hợp với loại xe đang điều khiển; chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường đối với xe cơ giới theo quy định của pháp luật; chứng nhận bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới.","Trường hợp các giấy tờ nêu trên đã được tích hợp vào tài khoản định danh điện tử thì việc xuất trình, kiểm tra có thể thực hiện thông qua tài khoản định danh điện tử.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Chứng nhận đăng ký xe hoặc bản sao Chứng nhận đăng ký xe có chứng thực kèm bản gốc giấy…; 2) Giấy phép lái xe phù hợp với loại xe đang điều khiển; 3) Trường hợp các giấy tờ nêu trên đã được tích hợp vào tài khoản định danh điện tử thì việc…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Chứng nhận đăng ký xe hoặc bản sao Chứng nhận đăng ký xe có chứng thực kèm bản gốc giấy tờ xác nhận của tổ chức tín dụng, chi nhánh ngân hàng nước…; ý 2: Giấy phép lái xe phù hợp với loại xe đang điều khiển; chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường đối với xe cơ giới theo quy định của…; ý 3: Trường hợp các giấy tờ nêu trên đã được tích hợp vào tài khoản định danh điện tử thì việc xuất trình, kiểm tra có thể thực hiện thông qua tài khoản…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":139,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Giấy phép lái xe bị thu hồi trong các trường hợp nào sau đây?","o":["Người được cấp giấy phép lái xe không đủ điều kiện sức khỏe theo kết luận của cơ sở khám bệnh, chữa bệnh đối với từng hạng giấy phép lái xe.","Giấy phép lái xe được cấp sai quy định.","Giấy phép lái xe đã quá thời hạn tạm giữ hoặc hết thời hiệu thi hành quyết định xử phạt vi phạm hành chính theo quy định của pháp luật về xử lý vi phạm hành chính nếu người vi phạm không đến nhận mà không có lý do chính đáng.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Người được cấp giấy phép lái xe không đủ điều kiện sức khỏe theo kết luận của cơ sở khám…; 2) Giấy phép lái xe được cấp sai quy định; 3) Giấy phép lái xe đã quá thời hạn tạm giữ hoặc hết thời hiệu thi hành quyết định xử phạt…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người được cấp giấy phép lái xe không đủ điều kiện sức khỏe theo kết luận của cơ sở khám bệnh, chữa bệnh đối với từng hạng giấy phép lái xe; ý 2: Giấy phép lái xe được cấp sai quy định; ý 3: Giấy phép lái xe đã quá thời hạn tạm giữ hoặc hết thời hiệu thi hành quyết định xử phạt vi phạm hành chính theo quy định của pháp luật về xử lý vi…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":140,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có giấy phép lái xe chưa bị trừ hết 12 điểm, được phục hồi điểm giấy phép lái xe trong trường hợp nào sau đây?","o":["Không được phục hồi.","Được phục hồi đủ 12 điểm, nếu không bị trừ điểm trong thời hạn 12 tháng từ"],"a":2,"img":null,"ee":"GPLX có 12 điểm. Nếu còn điểm và 12 tháng kể từ lần bị trừ gần nhất không bị trừ thêm thì được phục hồi đủ 12 điểm.","ed":"Bộ đề xác định nội dung đúng là: “Được phục hồi đủ 12 điểm, nếu không bị trừ điểm trong thời hạn 12 tháng từ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không được phục hồi” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":141,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người có giấy phép lái xe đã bị trừ hết điểm phải làm gì để phục hồi điểm giấy phép lái xe?","o":["Không vi phạm pháp luật trật tự, an toàn giao thông đường bộ trong thời gian 12 tháng kể từ ngày bị trừ hết điểm.","Sau thời hạn ít nhất là 06 tháng kể từ ngày bị trừ hết điểm, người có phép lái xe được tham gia kiểm tra nội dung kiến thức pháp luật về trật tự, an toàn giao thông đường bộ theo quy định, có kết quả đạt yêu cầu thì được phục hồi đủ 12 điểm.","Cả hai ý trên."],"a":2,"img":null,"ee":"Bị trừ hết điểm thì không phục hồi ngay. Phải chờ ít nhất 6 tháng rồi tham gia kiểm tra kiến thức; đạt yêu cầu mới được phục hồi điểm.","ed":"Bộ đề xác định nội dung đúng là: “Sau thời hạn ít nhất là 06 tháng kể từ ngày bị trừ hết điểm, người có phép lái xe được tham gia kiểm tra nội dung kiến thức pháp luật về trật tự, an toàn giao thông đường bộ theo quy định, có kết quả đạt yêu cầu thì được phục hồi…”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không vi phạm pháp luật trật tự, an toàn giao thông đường bộ trong thời gian 12 tháng kể từ ngày bị trừ hết điểm” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":142,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trách nhiệm của tổ chức, cá nhân đứng tên trong giấy chứng nhận đăng ký xe khi chưa thực hiện thu hồi chứng nhận đăng ký xe, biển số xe được quy định như thế nào?","o":["Tiếp tục chịu trách nhiệm của chủ xe.","Không chịu trách nhiệm sau khi đã chuyển nhượng, trao đổi, tặng, cho."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Tiếp tục chịu trách nhiệm của chủ xe. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Tiếp tục chịu trách nhiệm của chủ xe”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không chịu trách nhiệm sau khi đã chuyển nhượng, trao đổi, tặng, cho” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":143,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Để bảo đảm điều kiện tham gia giao thông đường bộ, loại phương tiện nào phải lắp thiết bị giám sát hành trình?","o":["Xe ô tô kinh doanh vận tải.","Xe ô tô chở người từ 08 chỗ trở lên (không kể chỗ của người lái xe) kinh doanh vận tải, xe ô tô đầu kéo, xe cứu thương.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Xe ô tô kinh doanh vận tải; (2) Xe ô tô chở người từ 08 chỗ trở lên (không kể chỗ của người lái xe) kinh doanh vận tải,…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Xe ô tô kinh doanh vận tải; ý 2: Xe ô tô chở người từ 08 chỗ trở lên (không kể chỗ của người lái xe) kinh doanh vận tải, xe ô tô đầu kéo, xe cứu thương. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":144,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tốc độ khai thác tối đa cho phép đối với xe máy chuyên dùng, xe gắn máy và các loại xe tương tự tham gia giao thông trên đường bộ (trừ đường cao tốc) là bao nhiêu km/h?","o":["50 km/h.","40 km/h.","60 km/h."],"a":2,"img":null,"ee":"Xe máy chuyên dùng, xe gắn máy và loại tương tự (trừ cao tốc) có tốc độ tối đa 40 km/h. Đây là nhóm phương tiện có giới hạn thấp hơn ô tô/mô tô thông thường.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 40 km/h. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":145,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường bộ, trong khu vực đông dân cư, đường đôi hoặc đường một chiều có từ hai làn xe cơ giới trở lên, xe mô tô hai bánh, ô tô chở người đến 28 chỗ không kể chỗ của người lái xe tham gia giao thông với tốc độ khai thác tối đa cho phép là bao nhiêu?","o":["60 km/h.","50 km/h.","40 km/h."],"a":1,"img":null,"ee":"Trong khu đông dân cư, đường đôi hoặc một chiều có từ 2 làn cơ giới trở lên, nhóm xe trong câu được tối đa 60 km/h. Đường rộng và tách dòng tốt hơn nên mốc cao hơn đường chỉ có một làn mỗi chiều.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 60 km/h. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":146,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường bộ (trừ đường cao tốc) trong khu vực đông dân cư, đường hai chiều hoặc đường một chiều có một làn xe cơ giới, xe mô tô hai bánh, ô tô chở người đến 28 chỗ không kể chỗ của người lái xe tham gia giao thông với tốc độ khai thác tối đa cho phép là bao nhiêu?","o":["60 km/h.","50 km/h.","40 km/h."],"a":2,"img":null,"ee":"Cũng trong khu đông dân cư nhưng đường hai chiều hoặc một chiều chỉ có 1 làn cơ giới thì mốc giảm còn 50 km/h. Ít làn và có xe đối diện nên cần tốc độ thấp hơn.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 50 km/h. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":147,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường bộ (trừ đường cao tốc) trong khu vực đông dân cư, đường hai chiều hoặc đường một chiều có một làn xe cơ i đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 90 km/h?","o":["Xe ô tô chở người đến 28 chỗ không kể chỗ của người lái xe (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn.","Xe ô tô chở người trên 28 chỗ không kể chỗ người lái xe (trừ xe buýt); ô tô tải có trọng tải trên 3,5 tấn (trừ ô tô xi téc).","Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc (trừ ô tô đầu kéo kéo sơ mi rơ moóc xi téc); xe mô tô; ô tô chuyên dùng (trừ ô tô trộn vữa, ô tô trộn bê tông lưu động)."],"a":1,"img":null,"ee":"Ngoài khu đông dân cư, đường đôi hoặc một chiều từ 2 làn cơ giới: xe chở người đến 28 chỗ (trừ buýt) và xe tải không quá 3,5 tấn được tối đa 90 km/h. Đây là nhóm xe nhỏ/nhẹ hơn trong bảng tốc độ.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: Xe ô tô chở người đến 28 chỗ không kể chỗ của người lái xe (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":150,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường bộ ngoài khu vực đông dân cư, đường đôi hoặc đường một chiều có từ hai làn xe cơ giới trở lên (trừ đường cao tốc) loại xe nào dưới đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 80 km/h?","o":["Xe ô tô chở người đến 28 chỗ không kể chỗ của người lái xe (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn.","Xe ô tô chở người trên 28 chỗ không kể chỗ người lái xe (trừ xe buýt); ô tô tải có trọng tải trên 3,5 tấn (trừ ô tô xi téc).","Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc (trừ ô tô đầu kéo kéo sơ mi rơ moóc xi téc); xe mô tô; ô tô chuyên dùng (trừ ô tô trộn vữa, ô tô trộn bê tông lưu động).","Ô tô kéo rơ moóc; ô tô kéo xe khác; ô tô trộn vữa, ô tô trộn bê tông lưu động,"],"a":2,"img":null,"ee":"Mốc tốc độ này áp dụng đúng cho loại đường và nhóm xe nêu trong đề: Xe ô tô chở người trên 28 chỗ :156,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trên đường bộ ngoài khu vực đông dân cư, đường hai chiều hoặc đường một chiều có một làn xe cơ giới (trừ đường cao tốc), loại xe nào dưới đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 50 km/h?","o":["Xe ô tô chở người đến 28 chỗ không kể chỗ của người lái xe (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn.","Xe ô tô chở người trên 28 chỗ không kể chỗ người lái xe (trừ xe buýt); ô tô tải có trọng tải trên 3,5 tấn (trừ ô tô xi téc).","Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc (trừ ô tô đầu kéo kéo sơ mi rơ moóc xi téc); xe mô tô; ô tô chuyên dùng (trừ ô tô trộn vữa, ô tô trộn bê tông lưu động).","Ô tô kéo rơ moóc; ô tô kéo xe khác; ô tô trộn vữa, ô tô trộn bê tông lưu động, ô tô xi téc, ô tô đầu kéo kéo sơ mi rơ moóc xi téc, ô tô kéo theo rơ moóc xi téc."],"a":4,"img":null,"ee":"Ngoài khu đông dân cư trên đường hai chiều hoặc chỉ 1 làn cơ giới, nhóm xe kéo/rơ moóc và xe bồn, xe trộn nặng chỉ tối đa 50 km/h. Xe dài/nặng cần quãng phanh và không gian xử lý lớn hơn.","ed":"Bộ đề xác định nội dung đúng là: “Ô tô kéo rơ moóc; ô tô kéo xe khác; ô tô trộn vữa, ô tô trộn bê tông lưu động, ô tô xi téc, ô tô đầu kéo kéo sơ mi rơ moóc xi téc, ô tô kéo theo rơ moóc xi téc”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc (trừ ô tô đầu kéo kéo sơ mi rơ moóc xi téc); xe mô tô; ô tô chuyên dùng…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":157,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đường bộ (trừ đường cao tốc), loại xe nào dưới đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 50 km/h?","o":["Xe máy chuyên dùng, xe gắn máy và các loại xe tương tự.","Xe chở người bốn bánh có gắn động cơ khi tham gia giao thông trong phạm vi và thời gian cho phép hoạ
