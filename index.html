t động.","Xe chở hàng bốn bánh có gắn động cơ khi tham gia giao thông trong phạm vi và thời gian cho phép hoạt động."],"a":3,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Xe chở hàng bốn bánh có gắn động cơ khi tham gia giao thông trong phạm vi và thời gian cho phép hoạt động.","ed":"Bộ đề xác định nội dung đúng là: “Xe chở hàng bốn bánh có gắn động cơ khi tham gia giao thông trong phạm vi và thời gian cho phép hoạt động”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xe chở người bốn bánh có gắn động cơ khi tham gia giao thông trong phạm vi và thời gian cho phép hoạt động” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":158,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đoạn đường không có biển báo \"Cự ly tối thiểu giữa hai xe\", trong điều kiện mặt đường khô ráo, không có sương mù, mặt đường không trơn trượt, địa hình bằng phẳng, đường thẳng, tầm nhìn bảo đảm, xe cơ giới đang chạy với tốc độ từ trên 80 km/h đến 100 km/h, người lái xe phải giữ khoảng cách an toàn với xe đang chạy liền trước tối thiểu là bao nhiêu?","o":["35 m.","55 m.","70 m."],"a":3,"img":null,"ee":"Chạy trên 80 đến 100 km/h thì phải cách xe trước ít nhất 70 m trong điều kiện đường khô, tầm nhìn tốt. Tốc độ càng cao thì khoảng cách dừng xe càng dài nên phải chừa khoảng trống lớn hơn.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 70 m. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":159,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đoạn đường không có biển báo \"cự ly tối thiểu giữa hai xe\", trong điều kiện mặt đường khô ráo, không có sương mù, mặt đường không trơn trượt, địa hình bằng phẳng, đường thẳng, tầm nhìn bảo đảm, xe cơ giới đang chạy với tốc độ từ trên 100 km/h đến 120 km/h, người lái xe phải giữ khoảng cách an toàn với xe đang chạy liền trước tối thiểu là bao nhiêu?","o":["55 m.","70 m.","100 m."],"a":3,"img":null,"ee":"Chạy trên 100 đến 120 km/h thì khoảng cách tối thiểu tăng lên 100 m. Đây là nhóm tốc độ cao nhất trong bảng khoảng cách nên cần khoảng trống lớn nhất.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 100 m. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":160,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đoạn đường không có biển báo \"cự ly tối thiểu giữa hai xe\", trong điều kiện mặt đường khô ráo, không có sương mù, mặt đường không trơn trượt, địa hình bằng phẳng, đường thẳng, tầm nhìn bảo đảm, xe cơ giới đang chạy với tốc độ từ trên 60 km/h đến 80 km/h, người lái xe phải giữ khoảng cách an toàn với xe đang chạy liền trước tối thiểu là bao nhiêu?","o":["55 m.","70 m.","100 m."],"a":1,"img":null,"ee":"Chạy trên 60 đến 80 km/h thì giữ tối thiểu 55 m. So với mốc 60 km/h, tốc độ tăng thì khoảng cách cũng phải tăng.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 55 m. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":161,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi tham gia giao thông trên đoạn đường không có biển báo \"cự ly tối thiểu giữa hai xe\", trong điều kiện mặt đường khô ráo, không có sương mù, mặt đường không trơn trượt, địa hình bằng phẳng, đường thẳng, tầm nhìn bảo đảm, xe cơ giới đang chạy với tốc độ 60 km/h, người lái xe phải giữ khoảng cách an toàn với xe đang chạy liền trước tối thiểu là bao nhiêu?","o":["35 m.","55 m.","70 m."],"a":1,"img":null,"ee":"Ở đúng 60 km/h, khoảng cách tối thiểu là 35 m trong điều kiện đường khô và tầm nhìn tốt. Nếu mưa, sương mù hoặc đường trơn thì thực tế phải tăng khoảng cách hơn.","ed":"Mốc tốc độ phải đọc cùng loại đường, khu vực và loại phương tiện; đổi một trong ba điều kiện thì giới hạn có thể khác. Vì câu đang hỏi đúng điều kiện đã nêu, bộ đề chốt: 35 m. Các lựa chọn số khác là mốc của điều kiện khác hoặc vượt quá giới hạn."},{"id":162,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi điều khiển xe chạy với tốc độ dưới 60 km/h, để bảo đảm khoảng cách an toàn giữa hai xe, người lái xe phải điều khiển xe như thế nào?","o":["Chủ động giữ khoảng cách an toàn phù hợp với xe chạy liền trước xe của mình.","Bảo đảm khoảng cách an toàn tùy thuộc vào mật độ phương tiện, tình hình giao thông thực tế.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Chủ động giữ khoảng cách an toàn phù hợp với xe chạy liền trước xe của mình; (2) Bảo đảm khoảng cách an toàn tùy thuộc vào mật độ phương tiện, tình hình giao thông thực tế. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Chủ động giữ khoảng cách an toàn phù hợp với xe chạy liền trước xe của mình; ý 2: Bảo đảm khoảng cách an toàn tùy thuộc vào mật độ phương tiện, tình hình giao thông thực tế. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":163,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người lái xe phải giảm tốc độ thấp hơn tốc độ tối đa cho phép đến mức cần thiết, chú ý quan sát và chuẩn bị sẵn sàng những tình huống có thể xảy ra để phòng ngừa tai nạn trong các trường hợp nào dưới đây?","o":["Gặp biển báo nguy hiểm và cảnh báo trên đường.","Gặp biển chỉ dẫn trên đường.","Gặp biển báo hết mọi lệnh cấm.","Gặp biển báo hết hạn chế tốc độ tối đa cho phép."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Gặp biển báo nguy hiểm và cảnh báo trên đường.","ed":"Bộ đề xác định nội dung đúng là: “Gặp biển báo nguy hiểm và cảnh báo trên đường”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Gặp biển chỉ dẫn trên đường” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":164,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe đưa đón trẻ em mầm non, học sinh được ưu tiên gì khi tham gia giao thông đường bộ?","o":["Tổ chức phân luồng, điều tiết giao thông, bố trí nơi dừng xe, đỗ xe tại khu vực trường học và tại các điểm trên lộ trình đưa đón trẻ em mầm non, học sinh.","Được bố trí xe dẫn đường để bảo đảm an toàn giao thông.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Tổ chức phân luồng, điều tiết giao thông, bố trí nơi dừng xe, đỗ xe tại khu vực trường học và tại các điểm trên lộ trình đưa đón trẻ em mầm non, học sinh. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Tổ chức phân luồng, điều tiết giao thông, bố trí nơi dừng xe, đỗ xe tại khu vực trường học và tại các điểm trên lộ trình đưa đón trẻ em mầm non, học sinh."},{"id":165,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Người điều khiển phương tiện tham gia giao thông đường bộ phải quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn trong các trường hợp nào dưới đây?","o":["Tại nơi có vạch kẻ đường hoặc báo hiệu khác dành cho người đi bộ hoặc tại nơi mà người đi bộ, xe lăn của người khuyết tật đang qua đường.","Nơi đường bộ giao nhau cùng mức với đường bộ, đường bộ giao nhau cùng mức với đường sắt; đường hẹp, đường vòng, đường quanh co, đường đèo, dốc.","Khu vực có trường học, bệnh viện, bến xe, công trình công cộng tập trung đông người, khu vực đông dân cư, chợ, khu vực đang thi công trên đường bộ, hiện trường vụ tai nạn giao thông đường bộ.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Tại nơi có vạch kẻ đường hoặc báo hiệu khác dành cho người đi bộ hoặc tại nơi mà người đi…; 2) Nơi đường bộ giao nhau cùng mức với đường bộ, đường bộ giao nhau cùng mức với đường sắt; 3) Khu vực có trường học, bệnh viện, bến xe, công trình công cộng tập trung đông người, khu…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Tại nơi có vạch kẻ đường hoặc báo hiệu khác dành cho người đi bộ hoặc tại nơi mà người đi bộ, xe lăn của người khuyết tật đang qua đường; ý 2: Nơi đường bộ giao nhau cùng mức với đường bộ, đường bộ giao nhau cùng mức với đường sắt; đường hẹp, đường vòng, đường quanh co, đường đèo, dốc; ý 3: Khu vực có trường học, bệnh viện, bến xe, công trình công cộng tập trung đông người, khu vực đông dân cư, chợ, khu vực đang thi công trên đường bộ,…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":166,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Tại những đoạn đường không bố trí biển báo hạn chế tốc độ, không bố trí biển báo khoảng cách an toàn tối thiểu giữa hai xe, người lái xe phải thực hiện quy định nào dưới đây để bảo đảm an toàn?","o":["Được phép lái xe không hạn chế tốc độ và khoảng cách an toàn tối thiểu với xe phía trước cùng làn đường hoặc phần đường.","Được phép lái xe không hạn chế tốc độ và khoảng cách an toàn tối thiểu với xe phía trước cùng làn đường hoặc phần đường khi tham gia giao thông trên đường nhánh.","Chấp hành quy định về tốc độ, khoảng cách an toàn tối thiểu với xe phía trước"],"a":3,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Chấp hành quy định về tốc độ, khoảng cách an toàn tối thiểu với xe phía trước.","ed":"Bộ đề xác định nội dung đúng là: “Chấp hành quy định về tốc độ, khoảng cách an toàn tối thiểu với xe phía trước”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Được phép lái xe không hạn chế tốc độ và khoảng cách an toàn tối thiểu với xe phía trước cùng làn đường hoặc phần…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":167,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Khi gặp xe buýt đang dừng đón, trả khách, người điều khiển xe mô tô phải xử lý như thế nào dưới đây?","o":["Tăng tốc độ để nhanh chóng vượt qua xe buýt.","Quan sát, giảm tốc độ đi qua xe buýt hoặc dừng lại để bảo đảm an toàn."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Quan sát, giảm tốc độ đi qua xe buýt hoặc dừng lại để bảo đảm an toàn.","ed":"Bộ đề xác định nội dung đúng là: “Quan sát, giảm tốc độ đi qua xe buýt hoặc dừng lại để bảo đảm an toàn”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng tốc độ để nhanh chóng vượt qua xe buýt” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":168,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc vận chuyển hành khách bằng xe ô tô phải tuân thủ các quy định nào dưới đây?","o":["Đón, trả hành khách đúng nơi quy định; hướng dẫn sử dụng trang thiết bị an toàn trên xe; có biện pháp giữ gìn vệ sinh trong xe; vận chuyển hành khách đúng lịch trình, lộ trình đã đăng ký, trừ trường hợp bất khả kháng; không chở hành khách trên nóc xe, trong khoang chở hành lý hoặc để hành khách đu, bám bên ngoài xe.","Đón, trả hành khách theo yêu cầu của hành khách trên xe; hướng dẫn sử dụng trang thiết bị an toàn trên xe; có biện pháp giữ gìn vệ sinh trong xe; vận chuyển hành khách đúng lịch trình, lộ trình đã đăng ký, trừ trường hợp bất khả kháng; không chở hành khách trên nóc xe, trong khoang chở hành lý hoặc để hành khách đu, bám bên ngoài xe."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Đón, trả hành khách đúng nơi quy định. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Đón, trả hành khách đúng nơi quy định; hướng dẫn sử dụng trang thiết bị an toàn trên xe; có biện pháp giữ gìn vệ sinh trong xe; vận chuyển hành khách đúng lịch trình, lộ trình đã đăng ký, trừ trường hợp bất khả kháng; không chở…”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đón, trả hành khách theo yêu cầu của hành khách trên xe; hướng dẫn sử dụng trang thiết bị an toàn trên xe; có biện…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":169,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trong hoạt động vận tải đường bộ, các hành vi nào dưới đây bị nghiêm cấm?","o":["Vận chuyển hàng hóa cấm lưu hành.","Vận chuyển trái phép hoặc không thực hiện đầy đủ các quy định của pháp luật về vận chuyển hàng hóa nguy hiểm.","Vận chuyển động vật hoang dã.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Vận chuyển hàng hóa cấm lưu hành; 2) Vận chuyển trái phép hoặc không thực hiện đầy đủ các quy định của pháp luật về vận chuyển…; 3) Vận chuyển động vật hoang dã. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Vận chuyển hàng hóa cấm lưu hành; ý 2: Vận chuyển trái phép hoặc không thực hiện đầy đủ các quy định của pháp luật về vận chuyển hàng hóa nguy hiểm; ý 3: Vận chuyển động vật hoang dã. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":170,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trong hoạt động vận tải hành khách, những hành vi nào dưới đây bị nghiêm cấm?","o":["Cạnh tranh nhau nhằm tăng lợi nhuận.","Giảm giá để thu hút khách.","Đe dọa, xúc phạm, tranh giành, lôi kéo hành khách; đe doạ, cưỡng ép hành khách sử dụng dịch vụ ngoài ý muốn; chuyển tải, xuống khách hoặc các hành vi khác nhằm trốn tránh phát hiện xe chở quá tải, quá số người theo quy định của pháp luật.","Cả ba ý trên."],"a":3,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Vì vậy nội dung bị cấm trong câu là: Đe dọa, xúc phạm, tranh giành, lôi kéo hành khách.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Đe dọa, xúc phạm, tranh giành, lôi kéo hành khách; đe doạ, cưỡng ép hành khách sử dụng dịch vụ ngoài ý muốn; chuyển tải, xuống khách hoặc các hành vi khác nhằm trốn tránh phát hiện xe chở quá tải, quá số người theo quy…. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":171,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Thời gian lái xe liên tục của người lái xe ô tô kinh doanh vận tải được quy định như thế nào để bảo đảm an toàn giao thông?","o":["Không quá 4 giờ.","Không quá 6 giờ.","Không quá 8 giờ.","Liên tục tùy thuộc vào sức khỏe và khả năng của người lái xe."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Không quá 4 giờ. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Không quá 4 giờ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không quá 6 giờ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":172,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Thời gian làm việc của người lái xe ô tô kinh doanh vận tải trong một ngày được quy định như thế nào để bảo đảm an toàn giao thông?","o":["Không quá 6 giờ trong một ngày.","Không quá 8 giờ trong một ngày.","Không quá 10 giờ trong một ngày.","Không hạn chế tùy thuộc vào sức khỏe và khả năng của người lái xe."],"a":3,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Không quá 10 giờ trong một ngày. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Không quá 10 giờ trong một ngày”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không quá 6 giờ trong một ngày” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":173,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Trước khi xe khởi hành, người lái xe, nhân viên phục vụ trên xe ô tô vận chuyển hành khách có trách nhiệm nào sau đây?","o":["Kiểm tra các điều kiện bảo đảm an toàn của xe.","Hướng dẫn cho hành khách về an toàn giao thông đường bộ và thoát hiểm khi gặp sự cố.","Kiểm tra nhân thân và hành lý của hành khách đi xe.","Ý 1 và ý 2."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Kiểm tra các điều kiện bảo đảm an toàn của xe; (2) Hướng dẫn cho hành khách về an toàn giao thông đường bộ và thoát hiểm khi gặp sự cố. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 2.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Kiểm tra các điều kiện bảo đảm an toàn của xe; ý 2: Hướng dẫn cho hành khách về an toàn giao thông đường bộ và thoát hiểm khi gặp sự cố. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 2.”."},{"id":174,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe ô tô kinh doanh vận tải chở trẻ em mầm non, học sinh phải đáp ứng các yêu cầu nào dưới đây?","o":["Có thiết bị ghi nhận hình ảnh trẻ em mầm non, học sinh và thiết bị có chức năng cảnh báo, chống bỏ quên trẻ em trên xe; có niên hạn sử dụng không quá 20 năm; có màu sơn theo quy định của Chính phủ.","Có dây đai an toàn phù hợp với lứa tuổi hoặc sử dụng xe có ghế ngồi phù hợp với lứa tuổi theo quy định của pháp luật.","Được cấp chứng nhận đăng kí xe và gắn biển số xe, bảo đảm an toàn kĩ thuật và bảo vệ môi trường theo quy định của pháp luật; xe ô tô chở người từ 08 chỗ trở lên (không kể chỗ của người lái xe) phải lắp thiết bị giám sát hành trình và thiết bị ghi nhận hình ảnh người lái xe.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Có thiết bị ghi nhận hình ảnh trẻ em mầm non, học sinh và thiết bị có chức năng cảnh báo,…; 2) Có dây đai an toàn phù hợp với lứa tuổi hoặc sử dụng xe có ghế ngồi phù hợp với lứa tuổi…; 3) Được cấp chứng nhận đăng kí xe và gắn biển số xe, bảo đảm an toàn kĩ thuật và bảo vệ môi…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Có thiết bị ghi nhận hình ảnh trẻ em mầm non, học sinh và thiết bị có chức năng cảnh báo, chống bỏ quên trẻ em trên xe; có niên hạn sử dụng không quá…; ý 2: Có dây đai an toàn phù hợp với lứa tuổi hoặc sử dụng xe có ghế ngồi phù hợp với lứa tuổi theo quy định của pháp luật; ý 3: Được cấp chứng nhận đăng kí xe và gắn biển số xe, bảo đảm an toàn kĩ thuật và bảo vệ môi trường theo quy định của pháp luật; xe ô tô chở người từ 08…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":175,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc vận chuyển động vật sống khi tham gia giao thông đường bộ phải thực hiện các yêu cầu nào dưới đây?","o":["Người lái xe phải mang đủ giấy tờ theo quy định của pháp luật.","Phương tiện vận chuyển phải có kết cấu phù hợp với loại động vật chuyên chở.","Trong quá trình vận chuyển phải chấp hành các quy định của pháp luật về trật tự, an toàn giao thông đường bộ, vệ sinh dịch tễ, phòng dịch và bảo đảm vệ sinh môi trường.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Người lái xe phải mang đủ giấy tờ theo quy định của pháp luật; 2) Phương tiện vận chuyển phải có kết cấu phù hợp với loại động vật chuyên chở; 3) Trong quá trình vận chuyển phải chấp hành các quy định của pháp luật về trật tự, an toàn…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người lái xe phải mang đủ giấy tờ theo quy định của pháp luật; ý 2: Phương tiện vận chuyển phải có kết cấu phù hợp với loại động vật chuyên chở; ý 3: Trong quá trình vận chuyển phải chấp hành các quy định của pháp luật về trật tự, an toàn giao thông đường bộ, vệ sinh dịch tễ, phòng dịch và bảo đảm…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":176,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc vận chuyển hàng hóa nguy hiểm khi tham gia giao thông đường bộ phải chấp hành các quy định nào dưới đây?","o":["Phải có giấy phép vận chuyển; trong trường hợp cần thiết, đơn vị vận chuyển hàng hoá nguy hiểm phải bố trí người áp tải để bảo đảm trật tự, an toàn giao thông đường bộ.","Phải có giấy phép vận chuyển; không phải bố trí người áp tải khi tham gia giao thông đường bộ."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Phải có giấy phép vận chuyển. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Bộ đề xác định nội dung đúng là: “Phải có giấy phép vận chuyển; trong trường hợp cần thiết, đơn vị vận chuyển hàng hoá nguy hiểm phải bố trí người áp tải để bảo đảm trật tự, an toàn giao thông đường bộ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phải có giấy phép vận chuyển; không phải bố trí người áp tải khi tham gia giao thông đường bộ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":177,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc lưu hành xe ô tô của người nước ngoài đăng ký tại nước ngoài có tay lái ở bên phải tham gia giao thông tại Việt Nam, xe cơ giới nước ngoài do người nước ngoài đưa vào Việt Nam du lịch được quy định như như thế nào?","o":["Phải chấp hành quy định của pháp luật về trật tự, an toàn giao thông đường bộ của Việt Nam. Trường hợp điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên có quy định khác thì áp dụng theo điều ước quốc tế đó.","Tham gia giao thông đúng trong phạm vi, tuyến đường, thời gian đã được cơ quan có thẩm quyền của Việt Nam cấp phép.","Xe ô tô của người nước ngoài đăng ký tại nước ngoài có tay lái ở bên phải phải đi theo đoàn và có người, phương tiện hỗ trợ, hướng dẫn giao thông.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Phải chấp hành quy định của pháp luật về trật tự, an toàn giao thông đường bộ của Việt Nam; 2) Tham gia giao thông đúng trong phạm vi, tuyến đường, thời gian đã được cơ quan có thẩm…; 3) Xe ô tô của người nước ngoài đăng ký tại nước ngoài có tay lái ở bên phải phải đi theo…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Phải chấp hành quy định của pháp luật về trật tự, an toàn giao thông đường bộ của Việt Nam. Trường hợp điều ước quốc tế mà nước Cộng hòa xã hội chủ…; ý 2: Tham gia giao thông đúng trong phạm vi, tuyến đường, thời gian đã được cơ quan có thẩm quyền của Việt Nam cấp phép; ý 3: Xe ô tô của người nước ngoài đăng ký tại nước ngoài có tay lái ở bên phải phải đi theo đoàn và có người, phương tiện hỗ trợ, hướng dẫn giao thông. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":178,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Việc sử dụng xe mô tô, xe gắn máy, xe thô sơ để vận chuyển hành khách, hàng hóa phải thực hiện các quy định nào dưới đây để đảm bảo an toàn giao thông?","o":["Kiểm tra điều kiện bảo đảm an toàn của xe trước khi tham gia giao thông đường bộ; mang đủ giấy tờ theo quy định của pháp luật.","Kiểm tra việc sắp xếp hàng hóa bảo đảm an toàn; không chở quá số người, chở hành lý, hàng hoá vượt quá khối lượng cho phép hoặc vượt quá khổ giới hạn của xe.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Kiểm tra điều kiện bảo đảm an toàn của xe trước khi tham gia giao thông đường bộ; (2) Kiểm tra việc sắp xếp hàng hóa bảo đảm an toàn. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Kiểm tra điều kiện bảo đảm an toàn của xe trước khi tham gia giao thông đường bộ; mang đủ giấy tờ theo quy định của pháp luật; ý 2: Kiểm tra việc sắp xếp hàng hóa bảo đảm an toàn; không chở quá số người, chở hành lý, hàng hoá vượt quá khối lượng cho phép hoặc vượt quá khổ giới hạn…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":179,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe vận chuyển hàng siêu trường, siêu trọng phải thực hiện các quy định nào dưới đây để bảo đảm an toàn giao thông?","o":["Phải chạy với tốc độ quy định trong giấy phép và phải có báo hiệu kích thước của hàng; trường hợp cần thiết, phải có người, phương tiện hỗ trợ lái xe, cảnh báo cho người, phương tiện tham gia giao thông đường bộ khác và thực hiện các biện pháp bảo đảm an toàn giao thông khi vận chuyển hàng siêu trường, siêu trọng trên đường bộ.","Phải chạy với tốc độ quy định trong giấy phép; phải có người, phương tiện hỗ trợ lái xe, cảnh báo cho người, phương tiện tham gia giao thông đường bộ khác và thực hiện các biện pháp bảo đảm an toàn giao thông khi vận chuyển hàng siêu trường, siêu trọng trên đường dành cho giao thông công cộng."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Do đó phương án phù hợp là: Phải chạy với tốc độ quy định trong giấy phép và phải có báo hiệu kích thước của hàng.","ed":"Bộ đề xác định nội dung đúng là: “Phải chạy với tốc độ quy định trong giấy phép và phải có báo hiệu kích thước của hàng; trường hợp cần thiết, phải có người, phương tiện hỗ trợ lái xe, cảnh báo cho người, phương tiện tham gia giao thông đường bộ khác và thực hiện…”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phải chạy với tốc độ quy định trong giấy phép; phải có người, phương tiện hỗ trợ lái xe, cảnh báo cho người,…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":180,"ch":1,"ct":"Quy định chung và quy tắc giao thông đường bộ","q":"Xe cứu hộ giao thông đường bộ cần thực hiện yêu cầu nào sau đây để bảo đảm trật tự an toàn giao thông?","o":["Xe cứu hộ giao thông đường bộ phải có dấu hiệu nhận diện, niêm yết thông tin trên xe, gắn thiết bị giám sát hành trình và thiết bị ghi nhận hình ảnh người lái xe.","Phải tuân thủ quy định của pháp luật về khối lượng hàng hóa chuyên chở của xe cứu hộ và khối lượng của xe được cứu hộ ghi trên Chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Xe cứu hộ giao thông đường bộ phải có dấu hiệu nhận diện, niêm yết thông tin trên xe, gắn…; (2) Phải tuân thủ quy định của pháp luật về khối lượng hàng hóa chuyên chở của xe cứu hộ và…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Xe cứu hộ giao thông đường bộ phải có dấu hiệu nhận diện, niêm yết thông tin trên xe, gắn thiết bị giám sát hành trình và thiết bị ghi nhận hình ảnh…; ý 2: Phải tuân thủ quy định của pháp luật về khối lượng hàng hóa chuyên chở của xe cứu hộ và khối lượng của xe được cứu hộ ghi trên Chứng nhận kiểm định…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":181,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe kinh doanh vận tải khi thực hiện tốt việc rèn luyện, nâng cao trách nhiệm, đạo đức nghề nghiệp sẽ thu được kết quả như thế nào dưới đây?","o":["Được khách hàng, xã hội tôn trọng; được đồng nghiệp quý mến, giúp đỡ; được doanh nghiệp tin dùng và đóng góp nhiều cho xã hội; thu hút được khách hàng, góp phần quan trọng trong xây dựng thương hiệu, kinh doanh có hiệu quả cao.","Được cộng điểm vào giấy phép lái xe.","Cả hai ý trên."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Được khách hàng, xã hội tôn trọng.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Được khách hàng, xã hội tôn trọng; được đồng nghiệp quý mến, giúp đỡ; được doanh nghiệp tin dùng và đóng góp nhiều cho xã hội; thu hút được khách hàng, góp phần quan trọng trong xây dựng thương hiệu, kinh doanh có hiệu quả cao."},{"id":182,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Những hành vi nào sau đây thể hiện là người có văn hóa giao thông?","o":["Luôn tuân thủ pháp luật về trật tự, an toàn giao thông đường bộ, nhường nhịn và giúp đỡ người khác.","Đi nhanh, vượt đèn đỏ nếu không có lực lượng Công an.","Bấm còi và nháy đèn liên tục để cảnh báo xe khác.","Tránh nhường đường để đi nhanh hơn."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Luôn tuân thủ pháp luật về trật tự, an toàn giao thông đường bộ, nhường nhịn và giúp đỡ người khác.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Luôn tuân thủ pháp luật về trật tự, an toàn giao thông đường bộ, nhường nhịn và giúp đỡ người khác."},{"id":183,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe kinh doanh vận tải cần thực hiện những công việc gì ghi ở dưới đây để thường xuyên rèn luyện nâng cao đạo đức nghề nghiệp?","o":["Quản lý và sử dụng xe tốt; bảo dưỡng xe đúng định kỳ; thực hành tiết kiệm vật tư, nhiên liệu; luôn tu dưỡng bản thân, có lối sống lành mạnh, tác phong làm việc công nghiệp.","Nắm vững và tự giác chấp hành các quy định của pháp luật về trật tự, an toàn giao thông đường bộ, lái xe an toàn; thực hiện đầy đủ trách nhiệm với khách hàng; có ý thức tổ chức kỷ luật và xây dựng doanh nghiệp vững mạnh; có tinh thần hợp tác, tương trợ, giúp đỡ đồng nghiệp.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Quản lý và sử dụng xe tốt; (2) Nắm vững và tự giác chấp hành các quy định của pháp luật về trật tự, an toàn giao thông…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Quản lý và sử dụng xe tốt; bảo dưỡng xe đúng định kỳ; thực hành tiết kiệm vật tư, nhiên liệu; luôn tu dưỡng bản thân, có lối sống lành mạnh, tác…; ý 2: Nắm vững và tự giác chấp hành các quy định của pháp luật về trật tự, an toàn giao thông đường bộ, lái xe an toàn; thực hiện đầy đủ trách nhiệm với…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":184,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe ô tô vận chuyển hành khách phải có những phẩm chất, đạo đức nghề nghiệp gì dưới đây?","o":["Phải có thái độ lịch sự, tôn trọng, thân mật với hành khách; giúp đỡ những người có hoàn cảnh khó khăn, người già, người khuyết tật, phụ nữ có thai, có con nhỏ và trẻ em.","Luôn tu dưỡng bản thân, có lối sống lành mạnh, khiêm tốn, có tác phong làm việc công nghiệp, không tham gia vào các tệ nạn xã hội; tôn trọng người cùng tham gia giao thông đường bộ và có ý thức bảo vệ môi trường.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Phải có thái độ lịch sự, tôn trọng, thân mật với hành khách; (2) Luôn tu dưỡng bản thân, có lối sống lành mạnh, khiêm tốn, có tác phong làm việc công…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Phải có thái độ lịch sự, tôn trọng, thân mật với hành khách; giúp đỡ những người có hoàn cảnh khó khăn, người già, người khuyết tật, phụ nữ có thai,…; ý 2: Luôn tu dưỡng bản thân, có lối sống lành mạnh, khiêm tốn, có tác phong làm việc công nghiệp, không tham gia vào các tệ nạn xã hội; tôn trọng người…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":185,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khái niệm về văn hóa giao thông được hiểu như thế nào là đúng?","o":["Là sự hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông, là ý thức","Là sự tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa giữa những người tham gia giao thông với nhau.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Là sự hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông, là ý thức; (2) Là sự tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa giữa những người tham gia giao…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Là sự hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông, là ý thức; ý 2: Là sự tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa giữa những người tham gia giao thông với nhau. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":186,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Trên làn đường dành cho ô tô có vũng nước lớn, người lái xe ô tô bắt buộc phải đi qua vũng nước, trên làn đường bên cạnh có nhiều người đang lái xe mô tô tham gia giao thông, người lái xe ô tô xử lý như thế nào khi lái xe qua vũng nước là có văn hóa giao thông?","o":["Cho xe chạy thật nhanh qua vũng nước.","Giảm tốc độ cho xe chạy chậm qua vũng nước.","Giảm tốc độ cho xe chạy qua làn đường dành cho mô tô để tránh vũng nước."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Giảm tốc độ cho xe chạy chậm qua vũng nước."},{"id":187,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe không điều khiển xe đi đúng làn đường quy định, phóng nhanh, vượt ẩu, vượt đèn đỏ, đi vào đường cấm được coi là hành vi nào trong các hành vi dưới đây?","o":["Là thiếu văn hóa giao thông, vi phạm pháp luật về trật tự, an toàn giao thông đường bộ.","Là thiếu văn hóa giao thông."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Là thiếu văn hóa giao thông, vi phạm pháp luật về trật tự, an toàn giao thông đường bộ.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Là thiếu văn hóa giao thông, vi phạm pháp luật về trật tự, an toàn giao thông đường bộ."},{"id":188,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi sơ cứu người bị tai nạn giao thông đường bộ, có vết thương chảy máu ngoài, phun thành tia và phun mạnh khi mạch đập, bạn phải làm gì dưới đây?","o":["Thực hiện cầm máu trực tiếp.","Thực hiện cầm máu không trực tiếp (chặn động mạch)."],"a":2,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Thực hiện cầm máu không trực tiếp (chặn động mạch).","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Thực hiện cầm máu không trực tiếp (chặn động mạch)."},{"id":189,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe có văn hóa giao thông khi tham gia giao thông đường bộ phải đáp ứng các điều kiện nào dưới đây?","o":["Hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông đường bộ; có ý thức trách nhiệm với cộng đồng khi tham gia giao thông; tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa với những người cùng tham gia giao thông.","Điều khiển xe vượt quá tốc độ, đi không đúng làn đường."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông đường bộ.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông đường bộ; có ý thức trách nhiệm với cộng đồng khi tham gia giao thông; tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa với những người cùng tham gia giao thông."},{"id":190,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe có văn hóa giao thông khi tham gia giao thông phải tuân thủ những quy định nào dưới đây?","o":["Điều khiển xe đi trên phần đường, làn đường có ít phương tiện tham gia giao thông, chỉ đội mũ bảo hiểm ở nơi có biển báo bắt buộc đội mũ bảo hiểm.","Chấp hành hiệu lệnh, chỉ dẫn của người điều khiển giao thông, quy định về tốc độ, tín hiệu đèn, biển báo hiệu, vạch kẻ đường khi lái xe; nhường đường cho người đi bộ, người già, trẻ em, người khuyết tật."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Chấp hành hiệu lệnh, chỉ dẫn của người điều khiển giao thông, quy định về tốc độ, tín hiệu đèn, biển báo hiệu, vạch kẻ đường khi lái xe; nhường đường cho người đi bộ, người già, trẻ em, người khuyết tật."},{"id":191,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe mô tô có văn hóa giao thông khi tham gia giao thông phải tuân thủ những quy định nào dưới đây?","o":["Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; đội mũ bảo hiểm đúng quy chuẩn kỹ thuật quốc gia, cài quai đúng quy cách.","Điều khiển xe đi trên phần đường, làn đường có ít phương tiện tham gia giao thông.","Điều khiển xe và đội mũ bảo hiểm ở nơi có biển báo bắt buộc đội mũ bảo hiểm."],"a":1,"img":null,"ee":"Mũ chỉ bảo vệ tốt khi đúng chuẩn và được cài quai để không văng khỏi đầu khi va chạm.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; đội mũ bảo hiểm đúng quy chuẩn kỹ thuật quốc gia, cài quai đúng quy cách."},{"id":192,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Trong các hành vi dưới đây, người lái xe có văn hóa giao thông phải ứng xử như thế nào?","o":["Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; dừng, đỗ xe đúng nơi quy định; đã uống rượu, bia thì không lái xe.","Điều khiển xe đi trên phần đường, làn đường có ít phương tiện giao thông; dừng xe, đỗ xe ở nơi thuận tiện hoặc theo yêu cầu của hành khách, của người thân.","Dừng và đỗ xe ở nơi thuận tiện cho việc chuyên chở hành khách và giao nhận hàng hóa; sử dụng ít rượu, bia thì có thể lái xe."],"a":1,"img":null,"ee":"Cồn làm chậm phản xạ và giảm khả năng phán đoán nên quy định cấm khi điều khiển phương tiện.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; dừng, đỗ xe đúng nơi quy định; đã uống rượu, bia thì không lái xe."},{"id":193,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi tham gia giao thông việc sử dụng còi xe nên dùng như thế nào để thể hiện là người có văn hóa giao thông?","o":["Chỉ bấm còi khi thật sự cần thiết, không bấm còi liên tục hoặc kéo dài, sử dụng còi với mức âm lượng theo quy định.","Bấm còi liên tục để các xe khác nhường đường.","Bấm còi to khi đi qua khu vực đông dân cư.","Không cần dùng còi, tránh gây tiếng ồn là văn minh."],"a":1,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Chỉ bấm còi khi thật sự cần thiết, không bấm còi liên tục hoặc kéo dài, sử dụng còi với mức âm lượng theo quy định."},{"id":194,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người điều khiển phương tiện tham giao thông đường bộ gây ra tai nạn giao thông đường bộ, người liên quan đến vụ tai nạn giao thông đường bộ có trách nhiệm gì dưới đây?","o":["Dừng ngay phương tiện, cảnh báo nguy hiểm, giữ nguyên hiện trường, trợ giúp người bị nạn và báo tin cho cơ quan Công an, cơ sở khám bệnh, chữa bệnh.","Ở lại hiện trường vụ tai nạn giao thông đường bộ cho đến khi người của cơ quan Công an đến, trừ trường hợp phải đi cấp cứu, đưa người bị nạn đi cấp cứu hoặc xét thấy bị đe dọa đến tính mạng, sức khỏe nhưng phải đến trình báo ngay cơ quan Công an, Ủy ban nhân dân nơi gần nhất.","Cung cấp thông tin xác định danh tính về bản thân, người liên quan đến vụ tai nạn giao thông đường bộ và thông tin liên quan của vụ tai nạn giao thông đường bộ cho cơ quan có thẩm quyền.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Dừng ngay phương tiện, cảnh báo nguy hiểm, giữ nguyên hiện trường, trợ giúp người bị nạn…; 2) Ở lại hiện trường vụ tai nạn giao thông đường bộ cho đến khi người của cơ quan Công an…; 3) Cung cấp thông tin xác định danh tính về bản thân, người liên quan đến vụ tai nạn giao…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Dừng ngay phương tiện, cảnh báo nguy hiểm, giữ nguyên hiện trường, trợ giúp người bị nạn và báo tin cho cơ quan Công an, cơ sở khám bệnh, chữa bệnh; ý 2: Ở lại hiện trường vụ tai nạn giao thông đường bộ cho đến khi người của cơ quan Công an đến, trừ trường hợp phải đi cấp cứu, đưa người bị nạn đi cấp…; ý 3: Cung cấp thông tin xác định danh tính về bản thân, người liên quan đến vụ tai nạn giao thông đường bộ và thông tin liên quan của vụ tai nạn giao…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":195,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người có mặt tại nơi xảy ra vụ tai giao thông đường bộ có trách nhiệm gì dưới đây?","o":["Giúp đỡ, cứu chữa kịp thời người bị nạn; báo tin ngay cho cơ quan Công an, cơ hiện trường; tham gia bảo vệ tài sản của người bị nạn; cung cấp thông tin liên quan về vụ tai nạn theo yêu cầu của cơ quan có thẩm quyền.","Chụp lại hình ảnh vụ tai nạn (nếu có thiết bị ghi hình) và nhanh chóng rời khỏi hiện trường vụ tai nạn."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Giúp đỡ, cứu chữa kịp thời người bị nạn.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Giúp đỡ, cứu chữa kịp thời người bị nạn; báo tin ngay cho cơ quan Công an, cơ hiện trường; tham gia bảo vệ tài sản của người bị nạn; cung cấp thông tin liên quan về vụ tai nạn theo yêu cầu của cơ quan có thẩm quyền."},{"id":196,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi sơ cứu ban đầu cho người bị tai nạn giao thông đường bộ không còn hô hấp, người lái xe và người có mặt tại hiện trường vụ tai nạn phải thực hiện các công việc gì dưới đây?","o":["Đặt nạn nhân nằm ngửa, khai thông đường thở của nạn nhân; thực hiện các biện pháp hô hấp nhân tạo.","Thực hiện các biện pháp hô hấp nhân tạo."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Đặt nạn nhân nằm ngửa, khai thông đường thở của nạn nhân.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Đặt nạn nhân nằm ngửa, khai thông đường thở của nạn nhân; thực hiện các biện pháp hô hấp nhân tạo."},{"id":197,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Hành vi bỏ trốn sau khi gây tai nạn để trốn tránh trách nhiệm hoặc khi có điều kiện mà cố ý không cứu giúp người bị tai nạn giao thông có bị nghiêm cấm hay không?","o":["Không bị nghiêm cấm.","Nghiêm cấm tuỳ từng trường hợp cụ thể.","Bị nghiêm cấm."],"a":3,"img":null,"ee":"Gây tai nạn rồi bỏ trốn hoặc có điều kiện mà cố ý không cứu người bị nạn đều bị nghiêm cấm. Đây không chỉ là thiếu văn hóa mà là hành vi pháp luật cấm rõ ràng.","ed":"Quy định này nhằm loại bỏ hành vi làm tăng nguy cơ mất kiểm soát, che khuất quan sát hoặc gây xung đột với người khác. Đối chiếu đúng hành vi/đối tượng được hỏi, bộ đề xác định phương án đúng là: Bị nghiêm cấm. Các phương án còn lại hoặc cho phép hành vi bị cấm, hoặc chỉ đúng trong trường hợp khác."},{"id":198,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi đang lái xe, thấy một người đi bộ đang sang đường trên vạch kẻ đường dành cho người đi bộ, người lái xe nên làm gì?","o":["Giảm tốc độ và nhường đường cho người đi bộ.","Bấm còi để họ đi nhanh hơn.","Tiếp tục đi nếu đang vội.","Vượt qua nếu thấy khoảng trống đủ rộng."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Giảm tốc độ và nhường đường cho người đi bộ."},{"id":199,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi gặp vụ tai nạn giao thông, người lái xe nên hành động như thế nào?","o":["Chạy đi để tránh rắc rối.","Dừng xe, hỗ trợ nạn nhân và báo cho cơ quan chức năng.","Chỉ quan sát rồi tiếp tục di chuyển.","Chỉ giúp đỡ nếu có người thân trong vụ tai nạn."],"a":2,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Dừng xe, hỗ trợ nạn nhân và báo cho cơ quan chức năng.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Dừng xe, hỗ trợ nạn nhân và báo cho cơ quan chức năng."},{"id":200,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Trong đoạn đường hai chiều tại khu đông dân cư đang ùn tắc, người điều khiển xe mô tô có văn hóa giao thông sẽ lựa chọn cách xử lý tình huống nào dưới đây?","o":["Cho xe lấn sang làn ngược chiều để nhanh chóng thoát khỏi nơi ùn tắc.","Điều khiển xe trên vỉa hè để nhanh chóng thoát khỏi nơi ùn tắc.","Kiên nhẫn tuân thủ hướng dẫn của người điều khiển giao thông hoặc tín hiệu đường cho các phương tiện đi ngược chiều."],"a":3,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Kiên nhẫn tuân thủ hướng dẫn của người điều khiển giao thông hoặc tín hiệu đường cho các phương tiện đi ngược chiều.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Kiên nhẫn tuân thủ hướng dẫn của người điều khiển giao thông hoặc tín hiệu đường cho các phương tiện đi ngược chiều."},{"id":201,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi điều khiển phương tiện tham gia giao thông trên đoạn đường bộ đang xảy ra ùn tắc, những hành vi nào dưới đây là thiếu văn hóa?","o":["Bấm còi liên tục thúc giục các phương tiện phía trước nhường đường; đi trên vỉa hè, tận dụng mọi khoảng trống để nhanh chóng thoát khỏi nơi ùn tắc; lấn sang trái đường cố gắng vượt lên xe khác.","Tuân thủ hướng dẫn của người điều khiển giao thông hoặc tín hiệu giao thông, đi đúng phần đường, làn đường quy định."],"a":1,"img":null,"ee":"Cách ứng xử đúng là cách giảm xung đột và ưu tiên an toàn cho mọi người. Vì vậy nên: Bấm còi liên tục thúc giục các phương tiện phía trước nhường đường.","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Bấm còi liên tục thúc giục các phương tiện phía trước nhường đường; đi trên vỉa hè, tận dụng mọi khoảng trống để nhanh chóng thoát khỏi nơi ùn tắc; lấn sang trái đường cố gắng vượt lên xe khác."},{"id":202,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người lái xe, chủ phương tiện giao thông cơ giới đường bộ nên thực hiện các biện pháp phòng cháy, chữa cháy như thế nào dưới đây?","o":["Không lắp đặt thêm thiết bị điện, phụ kiện không đúng theo thiết kế của nhà sản xuất; tuân thủ quy trình vận hành bảo trì bảo dưỡng định kỳ; thường xuyên kiểm tra phương tiện, khi phát hiện thấy dấu hiệu khác lạ (khó nổ, có hơi xăng, có tiếng kêu bất thường, nhiệt độ của máy cao, có mùi khét) cần khắc phục ngay.","Khi để xe trong nhà, ở nơi trông giữ xe phải tắt khóa điện, để xa nguồn lửa, nguồn nhiệt; không mua xăng, dầu ở các điểm bán tự phát, không rõ nguồn gốc; không sử dụng các biện pháp “tiết kiệm xăng, dầu” khi chưa được kiểm chứng về mức độ an toàn có thể gây hỏng xe hoặc dẫn đến nguy cơ xảy ra cháy cao.","Không để các chất dễ cháy, dễ bắt lửa trong xe, dưới yên xe, trong cốp xe, trong khoang động cơ. Đối với xe điện cần chọn địa điểm sạc an toàn, sử dụng các thiết bị sạc đúng cách và giám sát quá trình sạc.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Không lắp đặt thêm thiết bị điện, phụ kiện không đúng theo thiết kế của nhà sản xuất; 2) Khi để xe trong nhà, ở nơi trông giữ xe phải tắt khóa điện, để xa nguồn lửa, nguồn nhiệt; 3) Không để các chất dễ cháy, dễ bắt lửa trong xe, dưới yên xe, trong cốp xe, trong khoang…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Không lắp đặt thêm thiết bị điện, phụ kiện không đúng theo thiết kế của nhà sản xuất; tuân thủ quy trình vận hành bảo trì bảo dưỡng định kỳ; thường…; ý 2: Khi để xe trong nhà, ở nơi trông giữ xe phải tắt khóa điện, để xa nguồn lửa, nguồn nhiệt; không mua xăng, dầu ở các điểm bán tự phát, không rõ nguồn…; ý 3: Không để các chất dễ cháy, dễ bắt lửa trong xe, dưới yên xe, trong cốp xe, trong khoang động cơ. Đối với xe điện cần chọn địa điểm sạc an toàn, sử…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":203,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Người điều khiển phương tiện cơ giới đường bộ phải thực hiện những biện pháp gì dưới đây để chữa cháy trong trường hợp phương tiện bị cháy, xét thấy có khả năng dập tắt đám cháy?","o":["Tắt khoá điện, hô hoán để mọi người đến trợ giúp chữa cháy, gọi Cảnh sát phòng cháy chữa cháy và cứu nạn cứu hộ (điện thoại 114).","Nếu nhiên liệu chưa trào ra ngoài (ngọn lửa chưa cháy dữ dội) thì có thể sử dụng nước, hoặc bất kỳ chất, phương tiện chữa cháy có được để dập lửa; nếu nhiên liệu đã trào ra ngoài (ngọn lửa cháy dữ dội) thì phải sử dụng các bình chữa cháy, cát, chăn chiên, bao tải, vải nhúng nước để dập lửa.","Cả hai ý trên."],"a":3,"img":null,"ee":"Khi xe cháy mà còn khả năng xử lý, vừa gọi lực lượng chữa cháy/cứu nạn vừa dùng phương tiện chữa cháy phù hợp tại chỗ. Hai việc phải làm song song nên cả hai ý đều đúng.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Tắt khoá điện, hô hoán để mọi người đến trợ giúp chữa cháy, gọi Cảnh sát phòng cháy chữa cháy và cứu nạn cứu hộ (điện thoại 114); ý 2: Nếu nhiên liệu chưa trào ra ngoài (ngọn lửa chưa cháy dữ dội) thì có thể sử dụng nước, hoặc bất kỳ chất, phương tiện chữa cháy có được để dập lửa…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":204,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi phát hiện thấy có ngọn lửa, khói hoặc nhiệt độ cao bất thường từ phương tiện giao thông do mình điều khiển người lái xe phải làm gì trước tiên?","o":["Bình tĩnh, đưa xe sát vào lề đường, tránh xa nơi có nhiều người, nhiều chất dễ cháy và tắt khóa điện, thực hiện các bước chữa cháy.","Hô hoán để mọi người đến trợ giúp chữa cháy, gọi Cảnh sát giao thông, Cảnh cứu người.","Nếu nhiên liệu trào ra ngoài, ngọn lửa chưa cháy dữ dội thì tiếp tục sử dụng nước, hoặc bất kỳ chất, phương tiện chữa cháy có được để dập lửa.","Cả ba ý trên."],"a":1,"img":null,"ee":"Hiểu đơn giản, trong tình huống/điều kiện mà đề nêu thì cần: Bình tĩnh, đưa xe sát vào lề đường, tránh xa nơi có nhiều người, nhiều chất dễ cháy và tắt khóa điện, thực hiện các bước chữa cháy. Các phương án khác hoặc thiếu điều kiện, hoặc áp dụng cho trường hợp khác.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Bình tĩnh, đưa xe sát vào lề đường, tránh xa nơi có nhiều người, nhiều chất dễ cháy và tắt khóa điện, thực hiện các bước chữa cháy."},{"id":205,"ch":2,"ct":"Văn hóa giao thông, đạo đức người lái xe, PCCC và cứu hộ cứu nạn","q":"Khi gặp nạn nhân bị bỏng trong vụ tai nạn giao thông, người lái xe cần làm gì?","o":["Gọi số 115 để thông báo về tình trạng tai nạn và yêu cầu hỗ trợ y tế ngay lập tức. Quan sát hiện trường để giúp nạn nhân, đồng thời tránh gây tổn thương cho mình.","Nhanh chóng loại bỏ nguyên nhân gây bỏng bằng cách tách nạn nhân khỏi vật gây cháy, cởi bỏ quần áo nếu bén lửa, ngâm vùng da bị bỏng vào nước sạch hoặc đắp khăn mát, lưu ý không dùng khăn hoặc nước quá lạnh.","Nếu nạn nhân còn tỉnh, cần cho uống bù nước. Trong thời tiết lạnh, cần giữ ấm cho cơ thể nạn nhân, sau đó nhanh chóng đưa đến cơ sở y tế gần nhất.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Gọi số 115 để thông báo về tình trạng tai nạn và yêu cầu hỗ trợ y tế ngay lập tức; 2) Nhanh chóng loại bỏ nguyên nhân gây bỏng bằng cách tách nạn nhân khỏi vật gây cháy, cởi…; 3) Nếu nạn nhân còn tỉnh, cần cho uống bù nước. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Gọi số 115 để thông báo về tình trạng tai nạn và yêu cầu hỗ trợ y tế ngay lập tức. Quan sát hiện trường để giúp nạn nhân, đồng thời tránh gây tổn…; ý 2: Nhanh chóng loại bỏ nguyên nhân gây bỏng bằng cách tách nạn nhân khỏi vật gây cháy, cởi bỏ quần áo nếu bén lửa, ngâm vùng da bị bỏng vào nước sạch…; ý 3: Nếu nạn nhân còn tỉnh, cần cho uống bù nước. Trong thời tiết lạnh, cần giữ ấm cho cơ thể nạn nhân, sau đó nhanh chóng đưa đến cơ sở y tế gần nhất. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":206,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe mô tô tay ga xuống đường dốc dài, độ dốc cao, người lái xe cần thực hiện các thao tác nào dưới đây để bảo đảm an toàn?","o":["Giữ tay ga ở mức độ phù hợp, sử dụng phanh trước và phanh sau để giảm tốc độ.","Nhả hết tay ga, tắt động cơ, sử dụng phanh trước và phanh sau để giảm tốc độ.","Sử dụng phanh trước để giảm tốc độ kết hợp với tắt chìa khóa điện của xe."],"a":1,"img":null,"ee":"Xuống dốc dài bằng xe tay ga cần giữ xe có lực hãm và phối hợp phanh trước - sau. Không thả trôi hoặc chỉ bóp một phanh liên tục vì dễ mất kiểm soát/quá nhiệt phanh.","ed":"Bộ đề xác định nội dung đúng là: “Giữ tay ga ở mức độ phù hợp, sử dụng phanh trước và phanh sau để giảm tốc độ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nhả hết tay ga, tắt động cơ, sử dụng phanh trước và phanh sau để giảm tốc độ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":207,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi vào số để khởi hành xe ô tô có số tự động, người lái xe phải thực hiện các thao tác nào để bảo đảm an toàn?","o":["Đạp bàn đạp phanh chân hết hành trình, vào số và nhả phanh đỗ, kiểm tra lại xem có bị nhầm số không rồi mới cho xe lăn bánh.","Đạp bàn đạp để tăng ga với mức độ phù hợp, vào số và kiểm tra lại xem có bị nhầm số không rồi mới cho xe lăn bánh."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Đạp bàn đạp phanh chân hết hành trình, vào số và nhả phanh đỗ, kiểm tra lại xem có bị nhầm số không rồi mới cho xe lăn bánh.","ed":"Bộ đề xác định nội dung đúng là: “Đạp bàn đạp phanh chân hết hành trình, vào số và nhả phanh đỗ, kiểm tra lại xem có bị nhầm số không rồi mới cho xe lăn bánh”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đạp bàn đạp để tăng ga với mức độ phù hợp, vào số và kiểm tra lại xem có bị nhầm số không rồi mới cho xe lăn bánh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":208,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi nhả phanh đỗ cơ khí điều khiển bằng tay (phanh tay), người lái xe cần phải thực hiện các thao tác nào?","o":["Dùng lực tay phải kéo cần phanh tay về phía sau hết hành trình; nếu khóa hãm bị kẹt cứng phải đẩy mạnh phanh tay về phía trước, sau đó bóp khóa hãm.","Dùng lực tay phải bóp khóa hãm đẩy cần phanh tay về phía trước hết hành trình; nếu khóa hãm bị kẹt cứng phải kéo cần phanh tay về phía sau đồng thời bóp khóa hãm.","Dùng lực tay phải đẩy cần phanh tay về phía trước hết hành trình; nếu khóa hãm bị kẹt cứng phải đẩy mạnh phanh tay về phía trước, sau đó bóp khóa hãm."],"a":2,"img":null,"ee":"Kéo/đẩy phương tiện khác làm xe mất ổn định và khó kiểm soát khoảng cách. Vì vậy cách xử lý đúng là: Dùng lực tay phải bóp khóa hãm đẩy cần phanh tay về phía trước hết hành trình.","ed":"Bộ đề xác định nội dung đúng là: “Dùng lực tay phải bóp khóa hãm đẩy cần phanh tay về phía trước hết hành trình; nếu khóa hãm bị kẹt cứng phải kéo cần phanh tay về phía sau đồng thời bóp khóa hãm”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Dùng lực tay phải đẩy cần phanh tay về phía trước hết hành trình; nếu khóa hãm bị kẹt cứng phải đẩy mạnh phanh tay…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":209,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi khởi hành ô tô sử dụng hộp số cơ khí trên đường bằng, người lái xe cần thực hiện các thao tác nào theo trình tự dưới đây?","o":["Kiểm tra an toàn xung quanh xe ô tô; nhả từ từ đến 1/2 hành trình bàn đạp ly hợp (côn) và giữ trong khoảng 3 giây; vào số 1; nhả hết phanh tay, báo hiệu bằng còi, đèn trước khi xuất phát; tăng ga đủ để xuất phát, sau đó vừa tăng ga vừa nhả hết côn để cho xe ô tô chuyển động.","Kiểm tra an toàn xung quanh xe ô tô; đạp ly hợp (côn) hết hành trình; vào số 1; nhả hết phanh tay, báo hiệu bằng còi, đèn trước khi xuất phát; tăng ga đủ để xuất phát; nhả từ từ đến 1/2 hành trình bàn đạp côn và giữ trong khoảng 3 giây, sau đó vừa tăng ga vừa nhả hết côn để cho xe ô tô chuyển động."],"a":2,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Kiểm tra an toàn xung quanh xe ô tô.","ed":"Ly hợp nối hoặc ngắt dòng truyền lực giữa động cơ và hệ thống truyền lực. Khi đạp/ngắt ly hợp, người lái có thể sang số hoặc dừng xe mà không buộc động cơ tắt; khi đóng ly hợp, lực động cơ lại được truyền tới bánh xe. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Kiểm tra an toàn xung quanh xe ô tô; đạp ly hợp (côn) hết hành trình; vào số 1; nhả hết phanh tay, báo hiệu bằng còi, đèn trước khi xuất phát; tăng ga đủ để xuất phát; nhả từ từ đến 1/2 hành trình…."},{"id":210,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi quay đầu xe, người lái xe cần phải quan sát và thực hiện các thao tác nào để bảo đảm an toàn giao thông?","o":["Quan sát biển báo hiệu để biết nơi được phép quay đầu; quan sát kỹ địa hình nơi chọn để quay đầu; lựa chọn quỹ đạo quay đầu xe cho thích hợp; quay đầu xe đưa đuôi xe về phía an toàn.","Quan sát biển báo hiệu để biết nơi được phép quay đầu; quan sát kỹ địa hình nơi chọn để quay đầu; lựa chọn quỹ đạo quay đầu xe; quay đầu xe với tốc độ tối đa; thường xuyên báo tín hiệu để người, các phương tiện xung quanh được biết; nếu quay đầu xe ở nơi nguy hiểm thì đưa đuôi xe về phía nguy hiểm và đầu xe về phía an toàn."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Quan sát biển báo hiệu để biết nơi được phép quay đầu.","ed":"Quay đầu hoặc lùi xe làm phương tiện cắt qua hướng di chuyển bình thường nên chỉ thực hiện ở nơi tầm nhìn và không gian bảo đảm, không thuộc vị trí bị cấm. Câu hỏi nêu đúng một trường hợp cụ thể; đối chiếu điều kiện đó, đáp án là: Quan sát biển báo hiệu để biết nơi được phép quay đầu; quan sát kỹ địa hình nơi chọn để quay đầu; lựa chọn quỹ đạo quay đầu xe cho thích hợp; quay đầu xe đưa đuôi xe về phía an toàn."},{"id":211,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi ngồi lái ô tô tư thế chân, lưng, tay của người lái xe như thế nào là đúng để bảo đảm an toàn và thoải mái?","o":["Điều chỉnh ghế sao cho chân có thể đạp phanh và ga dễ dàng, ngồi thẳng lưng, hai tay nắm vô lăng, tay trái nắm ở vị trí 9 đến 10 giờ và tay phải nắm ở vị trí từ 2 đến 4 giờ.","Ngồi sát vô lăng để dễ quan sát hoặc ngồi tự do, không cần điều chỉnh ghế.","Ngồi ngả người về phía sau nhiều để thư giãn, chân trái để ở vị trí chân ga, hai tay nắm vô lăng ở vị trí bất kỳ."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Điều chỉnh ghế sao cho chân có thể đạp phanh và ga dễ dàng, ngồi thẳng lưng, hai tay nắm vô lăng, tay trái nắm ở vị trí 9 đến 10 giờ và tay phải nắm ở vị trí từ 2 đến 4 giờ.","ed":"Bộ đề xác định nội dung đúng là: “Điều chỉnh ghế sao cho chân có thể đạp phanh và ga dễ dàng, ngồi thẳng lưng, hai tay nắm vô lăng, tay trái nắm ở vị trí 9 đến 10 giờ và tay phải nắm ở vị trí từ 2 đến 4 giờ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Ngồi ngả người về phía sau nhiều để thư giãn, chân trái để ở vị trí chân ga, hai tay nắm vô lăng ở vị trí bất kỳ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":212,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển ô tô lên dốc cao, người lái xe cần thực hiện các thao tác nào dưới đây để bảo đảm an toàn?","o":["Tăng lên số cao từ chân dốc, điều chỉnh ga cho xe nhanh lên dốc; đến gần đỉnh dốc phải tăng ga để xe nhanh chóng qua dốc; về số thấp, đi sát về phía bên phải đường, có tín hiệu (còi, đèn) để báo cho người lái xe đi ngược chiều biết.","Về số thấp từ chân dốc, điều chỉnh ga cho xe từ từ lên dốc; đến gần đỉnh dốc phải đi chậm, đi sát về phía bên phải đường, có tín hiệu (còi, đèn) để báo cho người lái xe đi ngược chiều biết."],"a":2,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Về số thấp từ chân dốc, điều chỉnh ga cho xe từ từ lên dốc.","ed":"Bộ đề xác định nội dung đúng là: “Về số thấp từ chân dốc, điều chỉnh ga cho xe từ từ lên dốc; đến gần đỉnh dốc phải đi chậm, đi sát về phía bên phải đường, có tín hiệu (còi, đèn) để báo cho người lái xe đi ngược chiều biết”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng lên số cao từ chân dốc, điều chỉnh ga cho xe nhanh lên dốc; đến gần đỉnh dốc phải tăng ga để xe nhanh chóng…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":213,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển ô tô xuống dốc dài, người lái xe cần thực hiện các thao tác nào dưới đây để bảo đảm an toàn?","o":["Tăng lên số cao, nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ.","Về số thấp, nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ.","Về số không (0), nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Về số thấp, nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ.","ed":"Bộ đề xác định nội dung đúng là: “Về số thấp, nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Về số không (0), nhả bàn đạp ga ở mức độ phù hợp, kết hợp với phanh chân để khống chế tốc độ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":214,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi xuống dốc, muốn dừng xe, người lái xe cần thực hiện các thao tác nào để bảo đảm an toàn?","o":["Có tín hiệu rẽ phải, điều khiển xe sát vào lề đường bên phải; đạp phanh sớm và mạnh hơn lúc dừng xe trên đường bằng để xe đi với tốc độ chậm đến mức dễ dàng dừng lại được; về số 1, đạp 1/2 ly hợp (côn) cho xe đến chỗ dừng; khi xe đã dừng, về số không (N), đạp phanh chân, sử dụng phanh đỗ.","Có tín hiệu rẽ phải, điều khiển xe sát vào lề đường bên trái; đạp hết hành trình lại được tại chỗ dừng; khi xe đã dừng, đạp và giữ phanh chân.","Có tín hiệu rẽ trái, điều khiển xe sát vào lề đường bên phải; đạp phanh sớm và mạnh hơn lúc dừng xe trên đường bằng để xe đi với tốc độ chậm đến mức dễ dàng dừng lại được; về số không (N) để xe đi đến chỗ dừng, khi xe đã dừng, sử dụng phanh đỗ."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Có tín hiệu rẽ phải, điều khiển xe sát vào lề đường bên phải.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Có tín hiệu rẽ phải, điều khiển xe sát vào lề đường bên phải; đạp phanh sớm và mạnh hơn lúc dừng xe trên đường bằng để xe đi với tốc độ chậm đến mức dễ dàng dừng lại được; về số 1, đạp 1/2 ly hợp (côn) cho xe đến chỗ dừng…."},{"id":215,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe trên đường vòng người lái xe cần phải làm gì để bảo đảm an toàn?","o":["Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng coi, đèn; giảm tốc độ tới mức cần thiết, về số thấp và thực hiện quay vòng với tốc độ phù hợp với bán kính cong của đường vòng.","Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng còi, đèn; tăng tốc để nhanh chóng qua đường vòng và giảm tốc độ sau khi qua đường vòng."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng coi, đèn.","ed":"Bộ đề xác định nội dung đúng là: “Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng coi, đèn; giảm tốc độ tới mức cần thiết, về số thấp và thực hiện quay vòng với tốc độ phù hợp với bán kính cong của đường vòng”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng còi, đèn; tăng tốc để nhanh chóng qua đường vòng và giảm…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":216,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô rẽ phải, người lái xe cần thực hiện các thao tác nào để bảo đảm an toàn?","o":["Có tín hiệu rẽ phải; quan sát an toàn phía sau; điều khiển xe sang làn đường bên trái; giảm tốc độ và quan sát an toàn phía bên phải để điều khiển xe qua chỗ đường giao nhau.","Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ phải; giảm tốc độ, quan sát an toàn phía trước, sau, bên phải và điều khiển xe từ từ rẽ phải.","Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ phải; quan sát an toàn phía sau; điều khiển xe bám sát vào phía phải đường; tăng tốc độ và quan sát an toàn phía bên trái để điều khiển xe qua chỗ đường giao nhau."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ phải.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ phải; giảm tốc độ, quan sát an toàn phía trước, sau, bên phải và điều khiển xe từ từ rẽ phải."},{"id":217,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô rẽ trái, người lái xe cần thực hiện các thao tác nào để bảo đảm an toàn?","o":["Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ trái; giảm tốc độ, quan sát an toàn xung quanh đặc biệt là bên trái; đổi sang làn đường bên trái và điều khiển xe từ từ rẽ trái.","Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ trái, tăng tốc độ để xe nhanh chóng qua chỗ đường giao nhau; có tín hiệu xin đổi làn đường; quan sát an toàn xung quanh đặc biệt là bên trái; đổi làn đường sang phải để mở rộng vòng cua."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ trái.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Cách chỗ rẽ một khoảng cách an toàn có tín hiệu rẽ trái; giảm tốc độ, quan sát an toàn xung quanh đặc biệt là bên trái; đổi sang làn đường bên trái và điều khiển xe từ từ rẽ trái."},{"id":218,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe sử dụng hộp số cơ khí vượt qua rãnh lớn cắt ngang mặt đường, người lái xe cần thực hiện các thao tác nào để đảm bảo an toàn?","o":["Vào số một (1) và từ từ cho hai bánh xe trước xuống rãnh, tăng ga cho hai bánh xe trước vượt lên khỏi rãnh, tăng số, tăng tốc độ để bánh xe sau vượt qua rãnh.","Tăng ga, tăng số để hai bánh xe trước và bánh xe sau vượt qua khỏi rãnh và","Vào số một (1) và từ từ cho hai bánh xe trước xuống rãnh, tăng ga cho hai bánh xe trước vượt lên khỏi rãnh, tiếp tục để bánh xe sau từ từ xuống rãnh rồi tăng dần ga cho xe ô tô lên khỏi rãnh."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Vào số một (1) và từ từ cho hai bánh xe trước xuống rãnh, tăng ga cho hai bánh xe trước vượt lên khỏi rãnh, tiếp tục để bánh xe sau từ từ xuống rãnh rồi tăng dần ga cho xe ô tô lên khỏi rãnh.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Vào số một (1) và từ từ cho hai bánh xe trước xuống rãnh, tăng ga cho hai bánh xe trước vượt lên khỏi rãnh, tiếp tục để bánh xe sau từ từ xuống rãnh rồi tăng dần ga cho xe ô tô lên khỏi rãnh."},{"id":219,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe qua đường sắt, người lái xe cần phải thực hiện các thao tác nào dưới đây để bảo đảm an toàn?","o":["Khi có chuông báo hoặc thanh chắn đã hạ xuống, người lái xe phải dừng xe tạm thời đúng khoảng cách an toàn, kéo phanh tay nếu đường dốc hoặc phải chờ lâu.","Khi không có chuông báo hoặc thanh chắn không hạ xuống, người lái xe cần phải quan sát nếu thấy đủ điều kiện an toàn thì về số thấp, tăng ga nhẹ và không thay đổi số trong quá trình vượt qua đường sắt để tránh động cơ chết máy cho xe cho vượt qua.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Khi có chuông báo hoặc thanh chắn đã hạ xuống, người lái xe phải dừng xe tạm thời đúng…; (2) Khi không có chuông báo hoặc thanh chắn không hạ xuống, người lái xe cần phải quan sát…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Khi có chuông báo hoặc thanh chắn đã hạ xuống, người lái xe phải dừng xe tạm thời đúng khoảng cách an toàn, kéo phanh tay nếu đường dốc hoặc phải chờ…; ý 2: Khi không có chuông báo hoặc thanh chắn không hạ xuống, người lái xe cần phải quan sát nếu thấy đủ điều kiện an toàn thì về số thấp, tăng ga nhẹ và…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":220,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô tự đổ, người lái xe cần chú ý những điểm gì để bảo đảm an toàn?","o":["Khi chạy trên đường xấu, nhiều ổ gà nên chạy chậm để thùng xe không bị lắc mạnh, không gây hiện tượng lệch \"ben\"; khi chạy vào đường vòng, cần giảm tốc độ, không lấy lái gấp và không phanh gấp.","Khi chạy trên đường quốc lộ, đường bằng phẳng không cần hạ hết thùng xe xuống.","Khi đổ hàng phải chọn vị trí có nền đường cứng và phẳng, dừng hẳn xe, kéo hết phanh đỗ; sau đó mới điều khiển cơ cấu nâng \"ben\" để đổ hàng, đổ xong hàng mới hạ thùng xuống.","Ý 1 và ý 3."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Khi chạy trên đường xấu, nhiều ổ gà nên chạy chậm để thùng xe không bị lắc mạnh, không…; (2) Khi đổ hàng phải chọn vị trí có nền đường cứng và phẳng, dừng hẳn xe, kéo hết phanh đỗ. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 3.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Khi chạy trên đường xấu, nhiều ổ gà nên chạy chậm để thùng xe không bị lắc mạnh, không gây hiện tượng lệch \"ben\"; khi chạy vào đường vòng, cần giảm…; ý 3: Khi đổ hàng phải chọn vị trí có nền đường cứng và phẳng, dừng hẳn xe, kéo hết phanh đỗ; sau đó mới điều khiển cơ cấu nâng \"ben\" để đổ hàng, đổ xong…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 3.”."},{"id":221,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe tăng số, người lái xe cần chú ý những điểm gì để bảo đảm an toàn?","o":["Không được nhìn xuống buồng lái, cần phải tăng thứ tự từ thấp đến cao, phối hợp các động tác phải nhịp nhàng, chính xác.","Nhìn xuống buồng lái để biết chính xác vị trí các tay số, cần phải tăng thứ tự từ thấp đến cao, phối hợp các động tác phải nhịp nhàng, vù ga phải phù hợp với tốc độ."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Không được nhìn xuống buồng lái, cần phải tăng thứ tự từ thấp đến cao, phối hợp các động tác phải nhịp nhàng, chính xác.","ed":"Bộ đề xác định nội dung đúng là: “Không được nhìn xuống buồng lái, cần phải tăng thứ tự từ thấp đến cao, phối hợp các động tác phải nhịp nhàng, chính xác”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nhìn xuống buồng lái để biết chính xác vị trí các tay số, cần phải tăng thứ tự từ thấp đến cao, phối hợp các động…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":222,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe giảm số, người lái xe cần phải chú ý những điểm gì để bảo đảm an toàn?","o":["Nhìn xuống buồng lái để biết chính xác vị trí các tay số, cần phải giảm thứ tự từ cao xuống thấp, phối hợp các động tác phải nhịp nhàng, chính xác.","Không được nhìn xuống buồng lái, cần phải giảm thứ tự từ cao xuống thấp, phối hợp các động tác phải nhịp nhàng, chính xác, vù ga phải phù hợp với tốc độ."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì v
