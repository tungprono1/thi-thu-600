ậy cách xử lý đúng là: Không được nhìn xuống buồng lái, cần phải giảm thứ tự từ cao xuống thấp, phối hợp các động tác phải nhịp nhàng, chính xác, vù ga phải phù hợp với tốc….","ed":"Bộ đề xác định nội dung đúng là: “Không được nhìn xuống buồng lái, cần phải giảm thứ tự từ cao xuống thấp, phối hợp các động tác phải nhịp nhàng, chính xác, vù ga phải phù hợp với tốc độ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nhìn xuống buồng lái để biết chính xác vị trí các tay số, cần phải giảm thứ tự từ cao xuống thấp, phối hợp các…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":223,"ch":3,"ct":"Kỹ thuật lái xe","q":"Để giảm tốc độ khi ô tô đi xuống đường dốc dài, người lái xe phải thực hiện các thao tác nào để bảo đảm an toàn?","o":["Nhả bàn đạp ga, đạp ly hợp (côn) hết hành trình, đạp mạnh phanh chân để giảm tốc độ.","Về số thấp phù hợp, nhả bàn đạp ga, kết hợp đạp phanh chân với mức độ phù hợp để giảm tốc độ.","Nhả bàn đạp ga, tăng lên số cao, đạp phanh chân với mức độ phù hợp để giảm tốc độ."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Về số thấp phù hợp, nhả bàn đạp ga, kết hợp đạp phanh chân với mức độ phù hợp để giảm tốc độ.","ed":"Bộ đề xác định nội dung đúng là: “Về số thấp phù hợp, nhả bàn đạp ga, kết hợp đạp phanh chân với mức độ phù hợp để giảm tốc độ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nhả bàn đạp ga, tăng lên số cao, đạp phanh chân với mức độ phù hợp để giảm tốc độ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":224,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển ô tô qua đường ngập nước, người lái xe cần thực hiện các thao tác nào để đảm bảo an toàn?","o":["Tăng lên số cao, tăng ga và giảm ga liên tục để thay đổi tốc độ, giữ vững tay lái để ô tô vượt qua đoạn đường ngập nước.","Đạp ly hợp (côn) hết hành trình, tăng ga và giảm ga liên tục để thay đổi tốc độ, giữ vững tay lái để ô tô vượt qua đoạn đường ngập nước.","Quan sát, ước lượng độ ngập nước mà xe ô tô có thể vượt qua an toàn, về số thấp, giữ đều ga và giữ vững tay lái để ô tô vượt qua đoạn đường ngập nước."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Quan sát, ước lượng độ ngập nước mà xe ô tô có thể vượt qua an toàn, về số thấp, giữ đều ga và giữ vững tay lái để ô tô vượt qua đoạn đường ngập nước.","ed":"Vượt xe chỉ an toàn khi được phép, có đủ tầm nhìn/khoảng trống và không rơi vào vị trí cấm vượt. Nếu xe sau xin vượt, xe trước cũng phải tạo điều kiện khi đủ an toàn. Đối chiếu đúng tình huống câu hỏi, phương án đúng là: Quan sát, ước lượng độ ngập nước mà xe ô tô có thể vượt qua an toàn, về số thấp, giữ đều ga và giữ vững tay lái để ô tô vượt qua đoạn đường ngập nước."},{"id":225,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô tới gần xe chạy ngược chiều vào ban đêm, người lái xe cần thực hiện các thao tác nào để bảo đảm an toàn?","o":["Chuyển từ đèn chiếu xa sang đèn chiếu gần; không nhìn thẳng vào đèn của xe chạy ngược chiều mà nhìn chếch sang phía phải theo chiều chuyển động của xe mình.","Chuyển từ đèn chiếu gần sang đèn chiếu xa; không nhìn thẳng vào đèn của xe chạy ngược chiều mà nhìn chếch sang phía phải theo chiều chuyển động của xe mình.","Chuyển từ đèn chiếu xa sang đèn chiếu gần; nhìn thẳng vào đèn của xe chạy ngược chiều để tránh xe bảo đảm an toàn."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Chuyển từ đèn chiếu xa sang đèn chiếu gần.","ed":"Bộ đề xác định nội dung đúng là: “Chuyển từ đèn chiếu xa sang đèn chiếu gần; không nhìn thẳng vào đèn của xe chạy ngược chiều mà nhìn chếch sang phía phải theo chiều chuyển động của xe mình”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Chuyển từ đèn chiếu gần sang đèn chiếu xa; không nhìn thẳng vào đèn của xe chạy ngược chiều mà nhìn chếch sang…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":226,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô trên đường trơn cần chú ý những điểm gì để bảo đảm an toàn?","o":["Giữ vững tay lái cho xe đi đúng vệt bánh xe đi trước, sử dụng số thấp đi chậm, giữ đều ga, đánh lái ngoặt và phanh gấp khi cần thiết.","Giữ vững tay lái cho xe đi đúng vệt bánh xe đi trước, sử dụng số thấp đi chậm, gài cầu (nếu có), giữ đều ga, không lấy nhiều lái, không đánh lái ngoặt và phanh gấp."],"a":2,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Giữ vững tay lái cho xe đi đúng vệt bánh xe đi trước, sử dụng số thấp đi chậm, gài cầu (nếu có), giữ đều ga, không lấy nhiều lái, không đánh lái ngoặt và phanh gấp.","ed":"Bộ đề xác định nội dung đúng là: “Giữ vững tay lái cho xe đi đúng vệt bánh xe đi trước, sử dụng số thấp đi chậm, gài cầu (nếu có), giữ đều ga, không lấy nhiều lái, không đánh lái ngoặt và phanh gấp”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Giữ vững tay lái cho xe đi đúng vệt bánh xe đi trước, sử dụng số thấp đi chậm, giữ đều ga, đánh lái ngoặt và phanh…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":227,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ xe ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây là báo hiệu tình trạng gì của xe ô tô?","o":["Đang sử dụng phanh đỗ.","Nhiệt độ nước làm mát quá mức cho phép.","Cửa xe đang mở."],"a":1,"img":"q227.webp","ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Đang sử dụng phanh đỗ.","ed":"Bộ đề xác định nội dung đúng là: “Đang sử dụng phanh đỗ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Cửa xe đang mở” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":228,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ xe ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây là báo hiệu tình trạng gì của xe ô tô?","o":["Đang sử dụng phanh đỗ.","Thiếu dầu phanh.","Nhiệt độ nước làm mát tăng quá mức cho phép.","Áp suất dầu ở mức thấp."],"a":4,"img":"q228.webp","ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Áp suất dầu ở mức thấp.","ed":"Bộ đề xác định nội dung đúng là: “Áp suất dầu ở mức thấp”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Thiếu dầu phanh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":229,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ xe ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây là báo hiệu tình trạng gì của xe ô tô?","o":["Cửa xe đóng chưa chặt hoặc có cửa xe chưa đóng.","Bộ nạp ắc quy gặp sự cố kỹ thuật.","Dầu bôi trơn bị thiếu.","Ý 2 và ý 3."],"a":1,"img":"q229.webp","ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Cửa xe đóng chưa chặt hoặc có cửa xe chưa đóng.","ed":"Bộ đề xác định nội dung đúng là: “Cửa xe đóng chưa chặt hoặc có cửa xe chưa đóng”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Bộ nạp ắc quy gặp sự cố kỹ thuật” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":230,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ xe ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây là báo hiệu tình trạng gì của xe ô tô?","o":["Thiếu dầu phanh, phanh tay đang hãm.","Hệ thống túi khí an toàn gặp sự cố.","Lái xe và người ngồi ghế trước chưa cài dây đai an toàn.","Cửa đóng chưa chặt, có cửa chưa đóng."],"a":3,"img":"q230.webp","ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Lái xe và người ngồi ghế trước chưa cài dây đai an toàn.","ed":"Bộ đề xác định nội dung đúng là: “Lái xe và người ngồi ghế trước chưa cài dây đai an toàn”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Thiếu dầu phanh, phanh tay đang hãm” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":231,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ xe ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây là báo hiệu tình trạng gì của xe ô tô?","o":["Báo hiệu thiếu dầu phanh.","Áp suất lốp không đủ.","Đang sử dụng phanh đỗ.","Sắp hết nhiên liệu."],"a":4,"img":"q231.webp","ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Sắp hết nhiên liệu.","ed":"Bộ đề xác định nội dung đúng là: “Sắp hết nhiên liệu”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Áp suất lốp không đủ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":232,"ch":3,"ct":"Kỹ thuật lái xe","q":"Trong các loại nhiên liệu dưới đây, loại nhiên liệu nào giảm thiểu ô nhiễm môi trường?","o":["Xăng và dầu diesel.","Xăng sinh học và khí sinh học.","Ý 1 và ý 2."],"a":2,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Xăng sinh học và khí sinh học.","ed":"Bộ đề xác định nội dung đúng là: “Xăng sinh học và khí sinh học”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Xăng và dầu diesel” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":233,"ch":3,"ct":"Kỹ thuật lái xe","q":"Các biện pháp tiết kiệm nhiên liệu khi chạy xe?","o":["Bảo dưỡng xe theo định kỳ và có kế hoạch lộ trình trước khi xe chạy.","Kiểm tra áp suất lốp theo quy định và chạy xe với tốc độ phù hợp với tình trạng mặt đường và mật độ giao thông trên đường.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bảo dưỡng xe theo định kỳ và có kế hoạch lộ trình trước khi xe chạy; (2) Kiểm tra áp suất lốp theo quy định và chạy xe với tốc độ phù hợp với tình trạng mặt đường…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bảo dưỡng xe theo định kỳ và có kế hoạch lộ trình trước khi xe chạy; ý 2: Kiểm tra áp suất lốp theo quy định và chạy xe với tốc độ phù hợp với tình trạng mặt đường và mật độ giao thông trên đường. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":234,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi đã đỗ xe ô tô sát lề đường bên phải, người lái xe phải thực hiện các thao tác nào dưới đây khi mở cửa xuống xe để đảm bảo an toàn?","o":["Quan sát tình hình giao thông phía trước, phía sau và phía bên mở cửa xe, mở hé cánh cửa, nếu đảm bảo an toàn thì mở cửa ở mức cần thiết để xuống xe ô tô.","Mở cánh cửa và quan sát tình hình giao thông phía trước, nếu đảm bảo an toàn thì mở cửa ở mức cần thiết để xuống xe ô tô.","Mở cánh cửa hết hành trình và nhanh chóng ra khỏi xe ô tô."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Quan sát tình hình giao thông phía trước, phía sau và phía bên mở cửa xe, mở hé cánh cửa, nếu đảm bảo an toàn thì mở cửa ở mức cần thiết để xuống xe ô tô.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Quan sát tình hình giao thông phía trước, phía sau và phía bên mở cửa xe, mở hé cánh cửa, nếu đảm bảo an toàn thì mở cửa ở mức cần thiết để xuống xe ô tô."},{"id":235,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô qua đường sắt không có rào chắn, không có người điều khiển giao thông, người lái xe phải xử lý như thế nào?","o":["Giảm tốc độ, dừng lại trước vạch dừng, quan sát cả hai phía, nếu không có tàu đi tới, tăng ga nhẹ vượt qua đường sắt.","Nếu thấy có tàu đi tới thì dừng lại trước vạch dừng, chỉ khi tàu đi qua mới được đi.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Giảm tốc độ, dừng lại trước vạch dừng, quan sát cả hai phía, nếu không có tàu đi tới,…; (2) Nếu thấy có tàu đi tới thì dừng lại trước vạch dừng, chỉ khi tàu đi qua mới được đi. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Giảm tốc độ, dừng lại trước vạch dừng, quan sát cả hai phía, nếu không có tàu đi tới, tăng ga nhẹ vượt qua đường sắt; ý 2: Nếu thấy có tàu đi tới thì dừng lại trước vạch dừng, chỉ khi tàu đi qua mới được đi. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":236,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi lái xe ô tô qua đường sắt không có rào chắn, không có người điều khiển giao thông, người lái xe thực hiện thao tác: “giảm tốc độ, dừng lại trước vạch dừng, quan sát cả hai phía, nếu không có tàu đi tới, tăng ga nhẹ vượt qua đường sắt. Nếu thấy có tàu đi tới thì dừng lại trước vạch dừng, chỉ khi tàu đi qua mới được đi” để đảm bảo an toàn là đúng hay không?","o":["Không đúng.","Đúng.","Không cần thiết, vì nếu nhìn thấy tàu còn cách xa, người lái xe có thể tăng số cao, tăng ga để cho xe nhanh chóng vượt qua đường sắt."],"a":2,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Đúng.","ed":"Khi có nhiều loại báo hiệu cùng lúc, trước hết phải nhận diện hiệu lệnh trực tiếp của người điều khiển giao thông rồi mới xét các báo hiệu khác. Với đèn tín hiệu, phải đọc đúng màu/trạng thái và vị trí xe so với vạch dừng. Áp dụng vào điều kiện câu này, cách chấp hành đúng là: Đúng."},{"id":237,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô có hộp số tự động đi vào đường trơn trượt, lầy lội, người lái xe phải xử lý như thế nào để đảm bảo an toàn?","o":["Về số thấp, kết hợp phanh chân để giảm tốc độ.","Giữ nguyên tay số D, kết hợp phanh đỗ để giảm tốc độ.","Về số N (số 0), kết hợp phanh chân để giảm tốc độ."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Về số thấp, kết hợp phanh chân để giảm tốc độ.","ed":"Hộp số thay đổi tỉ số truyền để thay đổi lực kéo và tốc độ, đồng thời tạo khả năng chạy lùi. Có thể hiểu đơn giản: số thấp ưu tiên lực kéo, số cao ưu tiên tốc độ; vì vậy phương án đúng phải nói về thay đổi truyền lực chứ không phải đánh lái hay phanh. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Về số thấp, kết hợp phanh chân để giảm tốc độ."},{"id":238,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi động cơ ô tô đã khởi động, muốn điều chỉnh ghế của người lái, người lái xe phải để cần số ở vị trí nào?","o":["Vị trí N hoặc vị trí P hoặc số 0.","Vị trí D hoặc số 1.","Vị trí R."],"a":1,"img":null,"ee":"Khi động cơ đã nổ mà cần chỉnh ghế, để số ở N/P hoặc số 0 để xe không tự lao đi. Đây là trạng thái không truyền lực kéo ra bánh xe.","ed":"Bộ đề xác định nội dung đúng là: “Vị trí N hoặc vị trí P hoặc số 0”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Vị trí D hoặc số 1” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":239,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô có hộp số tự động, người lái xe sử dụng chân như thế nào là đúng để bảo đảm an toàn?","o":["Không sử dụng chân trái; chân phải điều khiển bàn đạp phanh và bàn đạp ga.","Chân trái điều khiển bàn đạp phanh, chân phải điều khiển bàn đạp ga.","Không sử dụng chân phải; chân trái điều khiển bàn đạp phanh và bàn đạp ga."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Không sử dụng chân trái.","ed":"Hộp số thay đổi tỉ số truyền để thay đổi lực kéo và tốc độ, đồng thời tạo khả năng chạy lùi. Có thể hiểu đơn giản: số thấp ưu tiên lực kéo, số cao ưu tiên tốc độ; vì vậy phương án đúng phải nói về thay đổi truyền lực chứ không phải đánh lái hay phanh. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Không sử dụng chân trái; chân phải điều khiển bàn đạp phanh và bàn đạp ga."},{"id":240,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi tầm nhìn bị hạn chế bởi sương mù hoặc mưa to, người lái xe phải thực hiện các thao tác nào để bảo đảm an toàn?","o":["Tăng tốc độ, chạy gần xe trước, nhìn đèn hậu để định hướng.","Giảm tốc độ, chạy cách xa xe trước với khoảng cách an toàn, bật đèn sương mù và đèn chiếu gần.","Tăng tốc độ, bật đèn pha vượt qua xe chạy trước."],"a":2,"img":null,"ee":"Mưa to/sương mù làm giảm tầm nhìn và tăng quãng phanh. Vì vậy phải giảm tốc, tăng khoảng cách và dùng đèn chiếu gần/đèn sương mù để nhìn rõ mà không gây chói.","ed":"Bộ đề xác định nội dung đúng là: “Giảm tốc độ, chạy cách xa xe trước với khoảng cách an toàn, bật đèn sương mù và đèn chiếu gần”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng tốc độ, chạy gần xe trước, nhìn đèn hậu để định hướng” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":241,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi đèn pha của xe đi ngược chiều gây chói mắt, làm giảm khả năng quan sát trên đường, người lái xe xử lý như thế nào dưới đây để bảo đảm an toàn?","o":["Giảm tốc độ, giữ vững tay lái, nhìn chếch sang lề đường bên phải.","Bật đèn pha chiếu xa và giữ nguyên tốc độ.","Tăng tốc độ, bật đèn pha đối diện xe phía trước."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Giảm tốc độ, giữ vững tay lái, nhìn chếch sang lề đường bên phải.","ed":"Bộ đề xác định nội dung đúng là: “Giảm tốc độ, giữ vững tay lái, nhìn chếch sang lề đường bên phải”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng tốc độ, bật đèn pha đối diện xe phía trước” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":242,"ch":3,"ct":"Kỹ thuật lái xe","q":"Để đạt được hiệu quả phanh cao nhất, người lái xe mô tô phải sử dụng các kỹ năng như thế nào dưới đây?","o":["Sử dụng phanh trước.","Sử dụng phanh sau.","Giảm hết ga, sử dụng đồng thời cả phanh sau và phanh trước."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Giảm hết ga, sử dụng đồng thời cả phanh sau và phanh trước.","ed":"Bộ đề xác định nội dung đúng là: “Giảm hết ga, sử dụng đồng thời cả phanh sau và phanh trước”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Sử dụng phanh trước” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":243,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi lái xe ô tô trên mặt đường có nhiều \"ổ gà\", người lái xe phải thực hiện thao tác như thế nào để bảo đảm an toàn?","o":["Giảm tốc độ, về số thấp và giữ đều ga.","Tăng tốc độ cho xe lướt qua nhanh.","Tăng tốc độ, đánh lái liên tục để tránh \"ổ gà\"."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Giảm tốc độ, về số thấp và giữ đều ga.","ed":"Bộ đề xác định nội dung đúng là: “Giảm tốc độ, về số thấp và giữ đều ga”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng tốc độ, đánh lái liên tục để tránh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":244,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô gặp mưa to hoặc sương mù, người lái xe phải làm gì để bảo đảm an toàn?","o":["Bật đèn chiếu gần và đèn vàng (nếu có), điều khiển gạt nước, điều khiển ô tô đi với tốc độ chậm để có thể quan sát được; tìm chỗ an toàn dừng xe, bật đèn dừng khẩn cấp báo hiệu cho các xe khác biết.","Bật đèn chiếu xa và đèn vàng, điều khiển gạt nước, tăng tốc độ điều khiển ô tô qua khỏi khu vực mưa hoặc sương mù.","Tăng tốc độ, bật đèn pha vượt qua xe chạy phía trước."],"a":1,"img":null,"ee":"Mưa to hoặc sương mù: bật đèn chiếu gần, gạt nước, đi chậm; nếu không còn nhìn đủ an toàn thì tìm chỗ an toàn để dừng và bật cảnh báo. Mục tiêu là “nhìn được - phanh kịp - người khác thấy mình”.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Bật đèn chiếu gần và đèn vàng (nếu có), điều khiển gạt nước, điều khiển ô tô đi với tốc độ chậm để có thể quan sát được; tìm chỗ an toàn dừng xe, bật đèn dừng khẩn cấp báo hiệu cho các xe khác biết."},{"id":245,"ch":3,"ct":"Kỹ thuật lái xe","q":"Điều khiển xe ô tô trong trời mưa, người lái xe phải xử lý như thế nào để bảo đảm an toàn?","o":["Giảm tốc độ, tăng cường quan sát, không nên phanh gấp, không nên tăng ga hay đánh vô lăng đột ngột, bật đèn chiếu gần, mở chế độ gạt nước ở chế độ phù hợp để đảm bảo quan sát.","Phanh gấp khi xe đi vào vũng nước và tăng ga ngay sau khi ra khỏi vũng nước.","Bật đèn chiếu xa, tăng tốc độ điều khiển ô tô qua khỏi khu vực mưa."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Giảm tốc độ, tăng cường quan sát, không nên phanh gấp, không nên tăng ga hay đánh vô lăng đột ngột, bật đèn chiếu gần, mở chế độ gạt nước ở chế độ….","ed":"Bộ đề xác định nội dung đúng là: “Giảm tốc độ, tăng cường quan sát, không nên phanh gấp, không nên tăng ga hay đánh vô lăng đột ngột, bật đèn chiếu gần, mở chế độ gạt nước ở chế độ phù hợp để đảm bảo quan sát”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Phanh gấp khi xe đi vào vũng nước và tăng ga ngay sau khi ra khỏi vũng nước” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":246,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi lùi xe, người lái xe phải xử lý như thế nào để bảo đảm an toàn giao thông?","o":["Quan sát bên trái, bên phải, phía sau xe, có tín hiệu cần thiết và lùi xe với tốc độ phù hợp.","Quan sát phía trước xe và lùi xe với tốc độ nhanh.","Quan sát bên trái và phía trước của xe và lùi xe với tốc độ nhanh."],"a":1,"img":null,"ee":"Lùi xe khó quan sát hơn đi tiến, nên phải nhìn hai bên và phía sau, phát tín hiệu và lùi chậm. Nếu chưa chắc chắn phía sau an toàn thì chưa lùi.","ed":"Quay đầu hoặc lùi xe làm phương tiện cắt qua hướng di chuyển bình thường nên chỉ thực hiện ở nơi tầm nhìn và không gian bảo đảm, không thuộc vị trí bị cấm. Câu hỏi nêu đúng một trường hợp cụ thể; đối chiếu điều kiện đó, đáp án là: Quan sát bên trái, bên phải, phía sau xe, có tín hiệu cần thiết và lùi xe với tốc độ phù hợp."},{"id":247,"ch":3,"ct":"Kỹ thuật lái xe","q":"Điều khiển xe ô tô trong khu vực đông dân cư cần lưu ý điều gì dưới đây?","o":["Giảm tốc độ đến mức an toàn, quan sát, nhường đường cho người đi bộ, giữ khoảng cách an toàn với các xe phía trước.","Đi đúng làn đường quy định, chỉ được chuyển làn đường ở nơi cho phép, nhưng","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Giảm tốc độ đến mức an toàn, quan sát, nhường đường cho người đi bộ, giữ khoảng cách an…; (2) Đi đúng làn đường quy định, chỉ được chuyển làn đường ở nơi cho phép, nhưng. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Giảm tốc độ đến mức an toàn, quan sát, nhường đường cho người đi bộ, giữ khoảng cách an toàn với các xe phía trước; ý 2: Đi đúng làn đường quy định, chỉ được chuyển làn đường ở nơi cho phép, nhưng. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":248,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô nhập vào đường cao tốc người lái xe cần thực hiện như thế nào dưới đây để bảo đảm an toàn giao thông?","o":["Quan sát, phát tín hiệu, nhường đường cho các xe đang chạy trên đường cao tốc, khi đủ điều kiện an toàn thì tăng tốc độ cho xe nhập vào làn đường cao tốc, nếu có làn đường tăng tốc thì phải cho xe chạy trên làn đường đó trước khi cho xe nhập vào làn của đường cao tốc.","Phát tín hiệu, quan sát các xe đang chạy phía trước, nếu bảo đảm các điều kiện an toàn thì tăng tốc độ cho xe nhập ngay vào làn đường cao tốc.","Phát tín hiệu và lái xe nhập vào làn đường tăng tốc, quan sát các xe phía sau đang chạy trên đường cao tốc, khi đủ điều kiện an toàn thì giảm tốc độ, từ từ cho xe nhập vào làn đường cao tốc."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Quan sát, phát tín hiệu, nhường đường cho các xe đang chạy trên đường cao tốc, khi đủ điều kiện an toàn thì tăng tốc độ cho xe nhập vào làn đường cao….","ed":"Các quy tắc nhường đường nhằm tránh hai dòng xe cùng chiếm một điểm xung đột. Hãy xác định xe nào đang ở vị trí phải nhường theo đúng điều kiện câu hỏi rồi mới xét hướng đi. Với dữ kiện của câu này, cách xử lý đúng là: Quan sát, phát tín hiệu, nhường đường cho các xe đang chạy trên đường cao tốc, khi đủ điều kiện an toàn thì tăng tốc độ cho xe nhập vào làn đường cao tốc, nếu có làn đường tăng tốc thì phải cho xe chạy trên làn đường đó…."},{"id":249,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô ra khỏi đường cao tốc người lái xe cần thực hiện như thế nào dưới đây để bảo đảm an toàn giao thông?","o":["Quan sát phía trước để tìm biển báo chỉ dẫn \"lối ra đường cao tốc\", kiểm tra tình trạng giao thông phía sau và bên phải, nếu bảo đảm điều kiện an toàn thì phát tín hiệu và điều khiển xe chuyển dần sang làn bên phải, nếu có làn đường giảm tốc thì phải cho xe di chuyển trên làn đường đó trước khi ra khỏi đường cao tốc.","Quan sát phía trước để tìm biển báo chỉ dẫn \"lối ra đường cao tốc\", trường hợp vượt qua \"lối ra đường cao tốc\" thì phát tín hiệu, di chuyển sang làn đường giảm tốc và lùi xe quay trở lại."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Quan sát phía trước để tìm biển báo chỉ dẫn \"lối ra đường cao tốc\", kiểm tra tình trạng giao thông phía sau và bên phải, nếu bảo đảm điều kiện an toàn thì phát tín hiệu và điều khiển xe….","ed":"Bộ đề xác định nội dung đúng là: “Quan sát phía trước để tìm biển báo chỉ dẫn \"lối ra đường cao tốc\", kiểm tra tình trạng giao thông phía sau và bên phải, nếu bảo đảm điều kiện an toàn thì phát tín hiệu và điều khiển xe chuyển dần sang làn bên phải, nếu có làn…”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Quan sát phía trước để tìm biển báo chỉ dẫn” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":250,"ch":3,"ct":"Kỹ thuật lái xe","q":"Người lái xe được dừng xe, đỗ xe trên làn dừng khẩn cấp của đường cao tốc trong trường hợp nào dưới đây?","o":["Xe gặp sự cố, tai nạn hoặc trường hợp khẩn cấp không thể di chuyển bình thường.","Để nghỉ ngơi, đi vệ sinh, chụp ảnh, làm việc riêng...","Cả hai ý trên."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Xe gặp sự cố, tai nạn hoặc trường hợp khẩn cấp không thể di chuyển bình thường.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Xe gặp sự cố, tai nạn hoặc trường hợp khẩn cấp không thể di chuyển bình thường."},{"id":251,"ch":3,"ct":"Kỹ thuật lái xe","q":"Trên đường đôi muốn vượt xe kéo rơ moóc phía trước, người lái xe phải xử lý như thế nào?","o":["Giữ khoảng cách an toàn, tránh đi vào vị trí điểm mù của xe kéo rơ moóc, bật xi nhan trái đồng thời kết hợp đèn, còi xin vượt.","Khi xe kéo rơ moóc đã có tín hiệu cho vượt (không có chướng ngại vật phía trước và xe đi ngược chiều), thấy đủ điều kiện an toàn thì vượt dứt khoát, không di chuyển song song bên cạnh xe kéo rơ moóc.","Khi vượt qua, phải quan sát gương chiếu hậu bên phải nếu có khoảng trống an","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Giữ khoảng cách an toàn, tránh đi vào vị trí điểm mù của xe kéo rơ moóc, bật xi nhan trái…; 2) Khi xe kéo rơ moóc đã có tín hiệu cho vượt (không có chướng ngại vật phía trước và xe đi…; 3) Khi vượt qua, phải quan sát gương chiếu hậu bên phải nếu có khoảng trống an. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Giữ khoảng cách an toàn, tránh đi vào vị trí điểm mù của xe kéo rơ moóc, bật xi nhan trái đồng thời kết hợp đèn, còi xin vượt; ý 2: Khi xe kéo rơ moóc đã có tín hiệu cho vượt (không có chướng ngại vật phía trước và xe đi ngược chiều), thấy đủ điều kiện an toàn thì vượt dứt khoát,…; ý 3: Khi vượt qua, phải quan sát gương chiếu hậu bên phải nếu có khoảng trống an. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":252,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe ô tô xuống đường dốc dài, độ dốc cao, người lái xe số tự động cần thực hiện các thao tác nào dưới đây để bảo đảm an toàn?","o":["Nhả bàn đạp ga, về số thấp, đạp phanh chân với mức độ phù hợp để giảm tốc độ.","Nhả bàn đạp ga, về số N đạp phanh chân và kéo phanh tay để giảm tốc độ."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Nhả bàn đạp ga, về số thấp, đạp phanh chân với mức độ phù hợp để giảm tốc độ.","ed":"Bộ đề xác định nội dung đúng là: “Nhả bàn đạp ga, về số thấp, đạp phanh chân với mức độ phù hợp để giảm tốc độ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Nhả bàn đạp ga, về số N đạp phanh chân và kéo phanh tay để giảm tốc độ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":253,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi đi từ đường nhánh ra đường chính, người lái xe phải xử lý như thế nào là đúng?","o":["Quan sát, giảm tốc độ, phát tín hiệu, nhường đường cho xe trên đường chính từ bất kỳ hướng nào tới.","Nháy đèn, bấm còi để xe đi trên đường chính biết và tăng tốc độ cho xe đi ra đường chính.","Quan sát xe đang đi trên đường chính, nếu là xe có kích thước lớn hơn thì nhường đường, xe có kích thước nhỏ hơn thì tăng tốc độ cho xe đi ra đường chính."],"a":1,"img":null,"ee":"Tốc độ càng cao thì quãng đường phanh và mức độ va chạm càng lớn, nên phải tuân đúng giới hạn. Vì vậy cách xử lý đúng là: Quan sát, giảm tốc độ, phát tín hiệu, nhường đường cho xe trên đường chính từ bất kỳ hướng nào tới.","ed":"Cấp đường được xét trước hướng trái - phải: xe từ đường nhánh/không ưu tiên phải nhường xe trên đường chính/ưu tiên. Vì vậy cần đọc xem mình đang đi trên loại đường nào rồi mới quyết định. Trong trường hợp của câu này, quy tắc dẫn tới: Quan sát, giảm tốc độ, phát tín hiệu, nhường đường cho xe trên đường chính từ bất kỳ hướng nào tới."},{"id":254,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi đang lái xe mô tô hoặc ô tô, nếu có nhu cầu sử dụng điện thoại để nhắn tin hoặc gọi điện, người lái xe phải thực hiện như thế nào trong các tình huống nêu dưới đây?","o":["Giảm tốc độ để bảo đảm an toàn với xe phía trước và sử dụng điện thoại để liên lạc.","Giảm tốc độ để dừng xe ở nơi cho phép sau đó sử dụng điện thoại để liên lạc.","Tăng tốc độ để cách xa xe phía sau và sử dụng điện thoại để liên lạc."],"a":2,"img":null,"ee":"Cầm điện thoại làm mất tay điều khiển và phân tán mắt khỏi đường. Vì vậy cách xử lý đúng là: Giảm tốc độ để dừng xe ở nơi cho phép sau đó sử dụng điện thoại để liên lạc.","ed":"Phân biệt trước: dừng là đứng yên tạm thời để thực hiện một việc cần thiết; đỗ là đứng yên không giới hạn thời gian theo khái niệm của bộ đề. Sau đó kiểm tra vị trí có thuộc khu vực cấm dừng/đỗ hay có gây che khuất, cản trở không. Trong câu này, quy tắc áp dụng dẫn đến: Giảm tốc độ để dừng xe ở nơi cho phép sau đó sử dụng điện thoại để liên lạc."},{"id":255,"ch":3,"ct":"Kỹ thuật lái xe","q":"Những thói quen nào dưới đây khi điều khiển xe mô tô tay ga tham gia giao thông dễ gây tai nạn nguy hiểm?","o":["Sử dụng còi.","Phanh đồng thời cả phanh trước và phanh sau.","Chỉ sử dụng phanh trước."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Chỉ sử dụng phanh trước.","ed":"Bộ đề xác định nội dung đúng là: “Chỉ sử dụng phanh trước”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Sử dụng còi” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":256,"ch":3,"ct":"Kỹ thuật lái xe","q":"Người ngồi trên xe ô tô cần thực hiện những thao tác mở cửa như thế nào dưới đây để xuống xe để bảo đảm an toàn?","o":["Quan sát phía trước, phía sau và bên phía mở cửa để phát hiện các phương tiện đang di chuyển tới gần, khi đủ điều kiện an toàn, mở hé cửa, sau đó mở ở mức cần thiết để xuống xe.","Quan sát tình hình giao thông phía trước, không cần quan sát phía sau và bên mở cửa; mở cánh cửa hết hành trình và nhanh chóng ra khỏi xe ô tô."],"a":1,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Quan sát phía trước, phía sau và bên phía mở cửa để phát hiện các phương tiện đang di chuyển tới gần, khi đủ điều kiện an toàn, mở hé cửa, sau đó mở ở mức cần thiết để xuống xe.","ed":"Bộ đề xác định nội dung đúng là: “Quan sát phía trước, phía sau và bên phía mở cửa để phát hiện các phương tiện đang di chuyển tới gần, khi đủ điều kiện an toàn, mở hé cửa, sau đó mở ở mức cần thiết để xuống xe”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Quan sát tình hình giao thông phía trước, không cần quan sát phía sau và bên mở cửa; mở cánh cửa hết hành trình và…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":257,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi điều khiển xe mô tô quay đầu, người lái xe cần thực hiện như thế nào để bảo đảm an toàn?","o":["Bật tín hiệu báo rẽ trước khi quay đầu, từ từ giảm tốc độ đến mức có thể dừng lại.","Chỉ quay đầu xe tại những nơi được phép quay đầu.","Quan sát an toàn các phương tiện tới từ phía trước, phía sau, hai bên đồng thời","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Bật tín hiệu báo rẽ trước khi quay đầu, từ từ giảm tốc độ đến mức có thể dừng lại; 2) Chỉ quay đầu xe tại những nơi được phép quay đầu; 3) Quan sát an toàn các phương tiện tới từ phía trước, phía sau, hai bên đồng thời. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bật tín hiệu báo rẽ trước khi quay đầu, từ từ giảm tốc độ đến mức có thể dừng lại; ý 2: Chỉ quay đầu xe tại những nơi được phép quay đầu; ý 3: Quan sát an toàn các phương tiện tới từ phía trước, phía sau, hai bên đồng thời. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":258,"ch":3,"ct":"Kỹ thuật lái xe","q":"Tay ga trên xe mô tô hai bánh có tác dụng gì dưới đây?","o":["Để điều khiển xe chạy về phía trước.","Để điều tiết công suất động cơ qua đó điều khiển tốc độ của xe.","Để điều khiển xe chạy lùi.","Ý 1 và ý 2."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Để điều khiển xe chạy về phía trước; (2) Để điều tiết công suất động cơ qua đó điều khiển tốc độ của xe. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 2.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Để điều khiển xe chạy về phía trước; ý 2: Để điều tiết công suất động cơ qua đó điều khiển tốc độ của xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 2.”."},{"id":259,"ch":3,"ct":"Kỹ thuật lái xe","q":"Gương chiếu hậu của xe mô tô hai bánh có tác dụng gì dưới đây?","o":["Để quan sát an toàn phía bên trái khi chuẩn bị rẽ trái.","Để quan sát an toàn phía bên phải khi chuẩn bị rẽ phải.","Để quan sát an toàn phía sau của bên trái và bên phải trước khi chuyển hướng.","Để quan sát an toàn phía trước cả bên trái và bên phải trước khi chuyển hướng."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Để quan sát an toàn phía sau của bên trái và bên phải trước khi chuyển hướng.","ed":"Người lái phải báo trước ý định, giảm tốc khi cần và chỉ đổi hướng/làn khi không gây trở ngại cho xe khác. Lý do là xe phía sau và hai bên cần thời gian nhận biết và điều chỉnh. Trong điều kiện của câu này, thao tác đúng là: Để quan sát an toàn phía sau của bên trái và bên phải trước khi chuyển hướng."},{"id":260,"ch":3,"ct":"Kỹ thuật lái xe","q":"Để bảo đảm an toàn khi tham gia giao thông, người lái xe mô tô hai bánh cần điều khiển tay ga như thế nào?","o":["Tăng ga thật mạnh, giảm ga từ từ.","Tăng ga thật mạnh, giảm ga thật nhanh.","Tăng ga từ từ, giảm ga thật nhanh.","Tăng ga từ từ, giảm ga từ từ."],"a":3,"img":null,"ee":"Mục tiêu của thao tác đúng là giữ xe ổn định và cho người lái đủ thời gian xử lý. Trong tình huống này cần: Tăng ga từ từ, giảm ga thật nhanh.","ed":"Bộ đề xác định nội dung đúng là: “Tăng ga từ từ, giảm ga thật nhanh”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Tăng ga thật mạnh, giảm ga thật nhanh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":261,"ch":3,"ct":"Kỹ thuật lái xe","q":"Để tránh đổ, ngã khi điều khiển xe mô tô hai bánh ở nơi đường xấu, nhỏ và hẹp, người lái xe cần xử lý như thế nào?","o":["Đi ở tốc độ thấp, quan sát liên tục khoảng cách từ 05 m đến 10 m phía trước để điều chỉnh sớm hướng di chuyển.","Trong quá trình di chuyển không nên dùng phanh trước tránh làm khóa bánh dẫn hướng.","Không được lắc người sang trái hoặc phải nhiều, trọng tâm cơ thể cần trùng với trọng tâm của xe.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Đi ở tốc độ thấp, quan sát liên tục khoảng cách từ 05 m đến 10 m phía trước để điều chỉnh…; 2) Trong quá trình di chuyển không nên dùng phanh trước tránh làm khóa bánh dẫn hướng; 3) Không được lắc người sang trái hoặc phải nhiều, trọng tâm cơ thể cần trùng với trọng tâm…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Đi ở tốc độ thấp, quan sát liên tục khoảng cách từ 05 m đến 10 m phía trước để điều chỉnh sớm hướng di chuyển; ý 2: Trong quá trình di chuyển không nên dùng phanh trước tránh làm khóa bánh dẫn hướng; ý 3: Không được lắc người sang trái hoặc phải nhiều, trọng tâm cơ thể cần trùng với trọng tâm của xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":262,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi lái xe ô tô điện xuống dốc dài, đổ đèo, người lái xe cần chú ý những vấn đề gì để bảo đảm an toàn?","o":["Kiểm tra hệ thống an toàn, pin của xe trước khi xuất phát.","Nhả chân ga để phanh tái sinh hoạt động.","Rà phanh chân để kịp thời xử lý tình huống khẩn cấp.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Kiểm tra hệ thống an toàn, pin của xe trước khi xuất phát; 2) Nhả chân ga để phanh tái sinh hoạt động; 3) Rà phanh chân để kịp thời xử lý tình huống khẩn cấp. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Kiểm tra hệ thống an toàn, pin của xe trước khi xuất phát; ý 2: Nhả chân ga để phanh tái sinh hoạt động; ý 3: Rà phanh chân để kịp thời xử lý tình huống khẩn cấp. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":263,"ch":3,"ct":"Kỹ thuật lái xe","q":"Khi lái xe ô tô điện qua khu vực ngập nước, người lái xe cần phải chú ý những vấn đề gì?","o":["Người lái xe phải tìm hiểu khả năng chìm trong nước của xe để xác định cung đường di chuyển.","Giữ vững tay lái, đi đều ga, tránh không để xe chết máy giữa dòng, không nên dừng xe trên đường ngập nước.","Lái xe tốc độ chậm, không tạo sóng và giữ khoảng cách an toàn với các phương tiện xung quanh, nhất là người đi bộ.","Cả ba ý trên."],"a":4,"img":null,"ee":"Ba ý đều là những trường hợp đúng trong câu này: 1) Người lái xe phải tìm hiểu khả năng chìm trong nước của xe để xác định cung đường di…; 2) Giữ vững tay lái, đi đều ga, tránh không để xe chết máy giữa dòng, không nên dừng xe trên…; 3) Lái xe tốc độ chậm, không tạo sóng và giữ khoảng cách an toàn với các phương tiện xung…. Vì vậy chọn “Cả ba ý trên”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Người lái xe phải tìm hiểu khả năng chìm trong nước của xe để xác định cung đường di chuyển; ý 2: Giữ vững tay lái, đi đều ga, tránh không để xe chết máy giữa dòng, không nên dừng xe trên đường ngập nước; ý 3: Lái xe tốc độ chậm, không tạo sóng và giữ khoảng cách an toàn với các phương tiện xung quanh, nhất là người đi bộ. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả ba ý trên.”."},{"id":264,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Phương pháp kiểm tra mức dầu bôi trơn động cơ nào dưới đây là đúng?","o":["Kiểm tra que thăm dầu trên các-te. Quan sát vệt dầu trên que thăm, mức dầu này phải nằm ở mức tối đa được thể hiện trên que thăm.","Rút que thăm dầu trên các-te. Quan sát vệt dầu trên que thăm, mức dầu này phải nằm ở mức tối thiểu được thể hiện trên que thăm.","Rút que thăm dầu trên các-te, lau sạch que thăm sau đó cắm vào các-te và rút ra quan sát vệt dầu trên que thăm, mức dầu phải nằm trong khoảng vạch mức tối thiểu và tối đa được thể hiện trên que thăm."],"a":3,"img":null,"ee":"Hệ thống bôi trơn đưa dầu đến các chi tiết chuyển động để giảm ma sát và mài mòn; đồng thời dầu còn giúp làm mát và làm sạch.","ed":"Hệ thống bôi trơn đưa dầu tới các bề mặt chuyển động để giảm ma sát, hạn chế mài mòn và hỗ trợ tản nhiệt. Khi câu hỏi hỏi chức năng của hệ thống này, phương án đúng phải xoay quanh việc cung cấp dầu/bôi trơn chứ không phải làm nhiệm vụ của phanh, lái hay nhiên liệu. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Rút que thăm dầu trên các-te, lau sạch que thăm sau đó cắm vào các-te và rút ra quan sát vệt dầu trên que thăm, mức dầu phải nằm trong khoảng vạch mức tối thiểu và tối đa được thể hiện trên que thăm."},{"id":265,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Xe ô tô tham gia giao thông đường bộ phải bảo đảm các quy định về chất lượng, an toàn kỹ thuật và bảo vệ môi trường nào dưới đây?","o":["Kính chắn gió, kính cửa phải là loại kính an toàn, bảo đảm tầm nhìn cho người điều khiển; có đủ hệ thống hãm và hệ thống chuyển hướng có hiệu lực, tay lái xe ô tô ở bên trái của xe, có còi với âm lượng đúng quy chuẩn kỹ thuật.","Có đủ đèn chiếu sáng gần và xa, đèn soi biển số, đèn báo hãm, đèn tín hiệu; có đủ bộ phận giảm thanh, giảm khói, các kết cấu phải đủ độ bền và bảo đảm tính năng vận hành ổn định.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Kính chắn gió, kính cửa phải là loại kính an toàn, bảo đảm tầm nhìn cho người điều khiển; (2) Có đủ đèn chiếu sáng gần và xa, đèn soi biển số, đèn báo hãm, đèn tín hiệu. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Kính chắn gió, kính cửa phải là loại kính an toàn, bảo đảm tầm nhìn cho người điều khiển; có đủ hệ thống hãm và hệ thống chuyển hướng có hiệu lực,…; ý 2: Có đủ đèn chiếu sáng gần và xa, đèn soi biển số, đèn báo hãm, đèn tín hiệu; có đủ bộ phận giảm thanh, giảm khói, các kết cấu phải đủ độ bền và bảo…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":266,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Xe mô tô và xe ô tô tham gia giao thông trên đường bộ có bắt buộc phải đủ bộ phận giảm thanh không?","o":["Không bắt buộc.","Bắt buộc.","Tùy từng trường hợp."],"a":2,"img":null,"ee":"Bộ giảm thanh giúp giảm tiếng ồn khí xả của động cơ. Xe thiếu bộ phận này gây tiếng ồn lớn và không đáp ứng điều kiện kỹ thuật nên bắt buộc phải có.","ed":"Bộ đề xác định nội dung đúng là: “Bắt buộc”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không bắt buộc” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":267,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Xe ô tô tham gia giao thông trên đường bộ phải có đủ các loại đèn nào dưới đây?","o":["Đèn chiếu sáng gần và xa.","Đèn soi biển số, đèn báo hãm và đèn tín hiệu.","Dàn đèn pha trên nóc xe.","Ý 1 và ý 2."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Đèn chiếu sáng gần và xa; (2) Đèn soi biển số, đèn báo hãm và đèn tín hiệu. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 1 và ý 2.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Đèn chiếu sáng gần và xa; ý 2: Đèn soi biển số, đèn báo hãm và đèn tín hiệu. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 1 và ý 2.”."},{"id":268,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Kính chắn gió của xe ô tô phải bảo đảm yêu cầu nào dưới đây?","o":["Là loại kính an toàn, kính nhiều lớp, đúng quy cách, không rạn nứt, bảo đảm hình ảnh quan sát rõ ràng, không bị méo mó.","Là loại kính trong suốt, không rạn nứt, bảo đảm tầm nhìn cho người điều khiển về phía trước mặt và hai bên."],"a":1,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: Là loại kính an toàn, kính nhiều lớp, đúng quy cách, không rạn nứt, bảo đảm hình ảnh quan sát rõ ràng, không bị méo mó. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Là loại kính an toàn, kính nhiều lớp, đúng quy cách, không rạn nứt, bảo đảm hình ảnh quan sát rõ ràng, không bị méo mó”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Là loại kính trong suốt, không rạn nứt, bảo đảm tầm nhìn cho người điều khiển về phía trước mặt và hai bên” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":269,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Bánh xe, lốp lắp cho xe ô tô phải bảo đảm an toàn kỹ thuật như thế nào dưới đây?","o":["Bánh xe phải có kết cấu chắc chắn, lắp đặt đúng quy cách của nhà sản xuât.","Lốp phải đủ số lượng, đủ áp suất, không phồng rộp, đúng cỡ lốp của nhà sản xuất hoặc tài liệu kỹ thuật quy định; lốp trên cùng một trục của xe sử dụng trong điều kiện hoạt động bình thường phải cùng kiểu loại.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bánh xe phải có kết cấu chắc chắn, lắp đặt đúng quy cách của nhà sản xuât; (2) Lốp phải đủ số lượng, đủ áp suất, không phồng rộp, đúng cỡ lốp của nhà sản xuất hoặc tài…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bánh xe phải có kết cấu chắc chắn, lắp đặt đúng quy cách của nhà sản xuât; ý 2: Lốp phải đủ số lượng, đủ áp suất, không phồng rộp, đúng cỡ lốp của nhà sản xuất hoặc tài liệu kỹ thuật quy định; lốp trên cùng một trục của xe sử…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":270,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hệ thống lái trên xe ô tô phải bảo đảm yêu cầu nào dưới đây?","o":["Bảo đảm cho xe chuyển hướng chính xác, điều khiển nhẹ nhàng, an toàn ở mọi vận tốc và tải trọng trong phạm vi tính năng kỹ thuật cho phép của xe.","Khi hoạt động các cơ cấu chuyển động của hệ thống lái không được va chạm với bất kỳ bộ phận nào của xe; khi quay vô lăng lái về bên phải và bên trái thì không được có sự khác biệt đáng kể về lực tác động lên vành tay lái.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bảo đảm cho xe chuyển hướng chính xác, điều khiển nhẹ nhàng, an toàn ở mọi vận tốc và tải…; (2) Khi hoạt động các cơ cấu chuyển động của hệ thống lái không được va chạm với bất kỳ bộ…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bảo đảm cho xe chuyển hướng chính xác, điều khiển nhẹ nhàng, an toàn ở mọi vận tốc và tải trọng trong phạm vi tính năng kỹ thuật cho phép của xe; ý 2: Khi hoạt động các cơ cấu chuyển động của hệ thống lái không được va chạm với bất kỳ bộ phận nào của xe; khi quay vô lăng lái về bên phải và bên trái…. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":271,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Mục đích của bảo dưỡng thường xuyên đối với xe ô tô có tác dụng gì dưới đây?","o":["Bảo dưỡng ô tô thường xuyên làm cho ô tô luôn luôn có tính năng kỹ thuật tốt, giảm cường độ hao mòn của các chi tiết, kéo dài tuổi thọ của xe.","Ngăn ngừa và phát hiện kịp thời các hư hỏng và sai lệch kỹ thuật để khắc phục, giữ gìn được hình thức bên ngoài.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Bảo dưỡng ô tô thường xuyên làm cho ô tô luôn luôn có tính năng kỹ thuật tốt, giảm cường…; (2) Ngăn ngừa và phát hiện kịp thời các hư hỏng và sai lệch kỹ thuật để khắc phục, giữ gìn…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Bảo dưỡng ô tô thường xuyên làm cho ô tô luôn luôn có tính năng kỹ thuật tốt, giảm cường độ hao mòn của các chi tiết, kéo dài tuổi thọ của xe; ý 2: Ngăn ngừa và phát hiện kịp thời các hư hỏng và sai lệch kỹ thuật để khắc phục, giữ gìn được hình thức bên ngoài. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":272,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Trong các nguyên nhân nêu dưới đây, nguyên nhân nào làm động cơ diesel không nổ?","o":["Hết nhiên liệu, lõi lọc nhiên liệu bị tắc, lọc khí bị tắc, nhiên liệu lẫn không khí, tạp chất.","Hết nhiên liệu, lõi lọc nhiên liệu bị tắc, lọc khí bị tắc, nhiên liệu lẫn không khí, không có tia lửa điện.","Hết nhiên liệu, lõi lọc nhiên liệu bị tắc, lọc khí bị tắc, nhiên liệu lẫn không khí và nước, không có tia lửa điện."],"a":1,"img":null,"ee":"Hệ thống nhiên liệu cung cấp nhiên liệu đúng lượng cho động cơ để đốt cháy và sinh công.","ed":"Bộ đề xác định nội dung đúng là: “Hết nhiên liệu, lõi lọc nhiên liệu bị tắc, lọc khí bị tắc, nhiên liệu lẫn không khí, tạp chất”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Hết nhiên liệu, lõi lọc nhiên liệu bị tắc, lọc khí bị tắc, nhiên liệu lẫn không khí, không có tia lửa điện” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":273,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Ống xả lắp trên xe ô tô phải bảo đảm yêu cầu an toàn kỹ thuật nào dưới đây?","o":["Ống xả không được đặt ở vị trí có thể gây cháy xe hoặc ảnh hưởng đến người ngồi trên xe và gây cản trở hoạt động của hệ thống khác.","Miệng thoát khí thải của ống xả không được hướng về phía trước và không được hướng về bên phải theo chiều tiến của xe.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Ống xả không được đặt ở vị trí có thể gây cháy xe hoặc ảnh hưởng đến người ngồi trên xe…; (2) Miệng thoát khí thải của ống xả không được hướng về phía trước và không được hướng về bên…. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Ống xả không được đặt ở vị trí có thể gây cháy xe hoặc ảnh hưởng đến người ngồi trên xe và gây cản trở hoạt động của hệ thống khác; ý 2: Miệng thoát khí thải của ống xả không được hướng về phía trước và không được hướng về bên phải theo chiều tiến của xe. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":274,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Dây đai an toàn lắp trên xe ô tô phải bảo đảm yêu cầu an toàn kỹ thuật nào dưới đây?","o":["Đủ số lượng, lắp đặt chắc chắn không bị rách, đứt, khóa cài đóng, mở nhẹ dây khi giật dây đột ngột.","Đủ số lượng, lắp đặt chắc chắn không bị rách, đứt, khóa cài đóng, mở nhẹ nhàng, không tự mở, không bị kẹt; kéo ra thu vào dễ dàng, cơ cấu hãm mở ra khi giật dây đột ngột.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: Đủ số lượng, lắp đặt chắc chắn không bị rách, đứt, khóa cài đóng, mở nhẹ dây khi giật dây đột ngột. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Đủ số lượng, lắp đặt chắc chắn không bị rách, đứt, khóa cài đóng, mở nhẹ dây khi giật dây đột ngột”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đủ số lượng, lắp đặt chắc chắn không bị rách, đứt, khóa cài đóng, mở nhẹ nhàng, không tự mở, không bị kẹt; kéo ra…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":275,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Thế nào là động cơ 4 kỳ?","o":["Là loại động cơ: để hoàn thành một chu trình công tác của động cơ, pít tông thực hiện 2 (hai) hành trình, trong đó có một lần sinh công.","Là loại động cơ: để hoàn thành một chu trình công tác của động cơ, pít tông thực hiện 4 (bốn) hành trình, trong đó có một lần sinh công."],"a":2,"img":null,"ee":"Động cơ 4 kỳ hoàn thành một chu trình qua 4 hành trình pít-tông và chỉ có một kỳ sinh công. “4 kỳ” là 4 hành trình, không phải 4 lần tạo công.","ed":"Bộ đề xác định nội dung đúng là: “Là loại động cơ: để hoàn thành một chu trình công tác của động cơ, pít tông thực hiện 4 (bốn) hành trình, trong đó có một lần sinh công”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Là loại động cơ: để hoàn thành một chu trình công tác của động cơ, pít tông thực hiện 2 (hai) hành trình, trong đó…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":276,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Công dụng của hệ thống bôi trơn đối với động cơ ô tô?","o":["Cung cấp một lượng dầu bôi trơn đủ và sạch dưới áp suất nhất định đi bôi trơn cho các chi tiết của động cơ để giảm ma sát, giảm mài mòn, làm kín, làm sạch, làm mát và chống gỉ.","Cung cấp một lượng nhiên liệu đầy đủ và sạch để cho động cơ ô tô hoạt động.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hệ thống bôi trơn giống như “dầu bảo vệ” cho động cơ: giảm ma sát, giảm mài mòn, đồng thời hỗ trợ làm mát, làm sạch và chống gỉ.","ed":"Hệ thống bôi trơn đưa dầu tới các bề mặt chuyển động để giảm ma sát, hạn chế mài mòn và hỗ trợ tản nhiệt. Khi câu hỏi hỏi chức năng của hệ thống này, phương án đúng phải xoay quanh việc cung cấp dầu/bôi trơn chứ không phải làm nhiệm vụ của phanh, lái hay nhiên liệu. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Cung cấp một lượng dầu bôi trơn đủ và sạch dưới áp suất nhất định đi bôi trơn cho các chi tiết của động cơ để giảm ma sát, giảm mài mòn, làm kín, làm sạch, làm mát và chống gỉ."},{"id":277,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Niên hạn sử dụng của xe ô tô tải (tính bắt đầu từ năm sản xuất) không quá bao nhiêu năm?","o":["15 năm.","20 năm.","25 năm."],"a":3,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: 25 năm. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “25 năm”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “15 năm” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":278,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Niên hạn sử dụng của xe ô tô chở người trên 8 chỗ ngồi (không kể chỗ của người lái xe) tính bắt đầu từ năm sản xuất không quá bao nhiêu năm?","o":["5 năm.","20 năm.","25 năm."],"a":2,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: 20 năm. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “20 năm”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “25 năm” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":279,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng của động cơ xe ô tô?","o":["Khi làm việc, nhiệt năng được biến đổi thành cơ năng làm trục khủy động cơ quay, truyền lực đến các bánh xe chủ động tạo ra chuyển động tịnh tiến cho xe ô tô.","Khi làm việc, cơ năng được biến đổi thành nhiệt năng và truyền đến các bánh xe chủ động tạo ra chuyển động tịnh tiến cho xe ô tô.","Cả hai ý trên."],"a":1,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: Khi làm việc, nhiệt năng được biến đổi thành cơ năng làm trục khủy động cơ quay, truyền lực đến các bánh xe chủ động tạo ra chuyển động tịnh tiến cho xe ô tô. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Khi làm việc, nhiệt năng được biến đổi thành cơ năng làm trục khủy động cơ quay, truyền lực đến các bánh xe chủ động tạo ra chuyển động tịnh tiến cho xe ô tô”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Khi làm việc, cơ năng được biến đổi thành nhiệt năng và truyền đến các bánh xe chủ động tạo ra chuyển động tịnh…” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":280,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng hệ thống truyền lực của xe ô tô?","o":["Dùng để truyền mô men quay từ động cơ tới các bánh xe chủ động của xe ô tô.","Dùng để thay đổi hướng chuyển động hoặc giữ cho xe ô tô chuyển động ổn định theo hướng xác định.","Dùng để làm giảm tốc độ, dừng chuyển động của xe ô tô."],"a":1,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: Dùng để truyền mô men quay từ động cơ tới các bánh xe chủ động của xe ô tô. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Dùng để truyền mô men quay từ động cơ tới các bánh xe chủ động của xe ô tô”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Dùng để làm giảm tốc độ, dừng chuyển động của xe ô tô” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":281,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng ly hợp (côn) của xe ô tô?","o":["Dùng để truyền mô men xoắn giữa các trục không cùng nằm trên một đường thẳng và góc lệch trục luôn thay đổi trong quá trình xe ô tô chuyển động.","Dùng để truyền hoặc ngắt truyền động từ động cơ đến hộp số của xe ô tô.","Dùng để truyền truyền động từ hộp số đến bánh xe chủ động của ô tô."],"a":2,"img":null,"ee":"Ly hợp là “cầu nối” giữa động cơ và hộp số: đóng để truyền lực, ngắt để sang số/dừng mà động cơ vẫn chạy.","ed":"Ly hợp nối hoặc ngắt dòng truyền lực giữa động cơ và hệ thống truyền lực. Khi đạp/ngắt ly hợp, người lái có thể sang số hoặc dừng xe mà không buộc động cơ tắt; khi đóng ly hợp, lực động cơ lại được truyền tới bánh xe. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Dùng để truyền hoặc ngắt truyền động từ động cơ đến hộp số của xe ô tô."},{"id":282,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng hộp số của xe ô tô?","o":["Truyền và tăng mô men xoắn giữa các trục vuông góc nhau, bảo đảm cho các bánh xe chủ động quay với tốc độ khác nhau khi sức cản chuyển động ở bánh xe hai bên không bằng nhau.","Truyền và thay đổi mô men xoắn giữa các trục không cùng nằm trên một đường thẳng và góc lệch trục luôn thay đổi trong quá trình ô tô chuyển động, chuyển số êm dịu, dễ điều khiển.","Truyền và thay đổi mô men từ động cơ đến bánh xe chủ động, cắt truyền động từ động cơ đến bánh xe chủ động, bảo đảm cho xe ô tô chuyển động lùi."],"a":3,"img":null,"ee":"Hộp số giống như bộ “đổi tỉ số truyền”: giúp xe đổi lực kéo/tốc độ, có số lùi và có thể ngắt truyền động. Nhờ đó cùng một động cơ có thể vừa đề-pa khỏe vừa chạy nhanh.","ed":"Hộp số thay đổi tỉ số truyền để thay đổi lực kéo và tốc độ, đồng thời tạo khả năng chạy lùi. Có thể hiểu đơn giản: số thấp ưu tiên lực kéo, số cao ưu tiên tốc độ; vì vậy phương án đúng phải nói về thay đổi truyền lực chứ không phải đánh lái hay phanh. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Truyền và thay đổi mô men từ động cơ đến bánh xe chủ động, cắt truyền động từ động cơ đến bánh xe chủ động, bảo đảm cho xe ô tô chuyển động lùi."},{"id":283,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng hệ thống lái của xe ô tô?","o":["Dùng để thay đổi mô men từ động cơ tới các bánh xe chủ động khi xe ô tô chuyển động theo hướng xác định.","Dùng để thay đổi mô men giữa các trục vuông góc nhau khi xe ô tô chuyển động theo hướng xác định.","Dùng để thay đổi hướng chuyển động hoặc giữ cho xe ô tô chuyển động ổn định theo hướng xác định."],"a":3,"img":null,"ee":"Hệ thống lái truyền thao tác vô-lăng/tay lái tới bánh dẫn hướng để xe đổi hướng theo ý người lái.","ed":"Hệ thống lái truyền thao tác của người lái tới bánh dẫn hướng để thay đổi hướng chuyển động của xe. Vì vậy chức năng chính là điều khiển hướng, không phải giảm tốc hoặc truyền công suất động cơ. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Dùng để thay đổi hướng chuyển động hoặc giữ cho xe ô tô chuyển động ổn định theo hướng xác định."},{"id":284,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Hãy nêu công dụng hệ thống phanh của xe ô tô?","o":["Dùng để giảm tốc độ, dừng chuyển động của xe ô tô và giữ cho xe ô tô đứng yên trên dốc.","Dùng để thay đổi hướng chuyển động hoặc giữ cho xe ô tô chuyển động ổn định theo hướng xác định.","Dùng để truyền hoặc ngắt truyền động từ động cơ đến bánh xe chủ động của xe ô tô."],"a":1,"img":null,"ee":"Hệ thống phanh tạo lực cản để giảm tốc hoặc dừng xe. Phanh tốt phải tác dụng ổn định và giúp xe không bị lệch hướng khi phanh.","ed":"Bộ đề xác định nội dung đúng là: “Dùng để giảm tốc độ, dừng chuyển động của xe ô tô và giữ cho xe ô tô đứng yên trên dốc”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Dùng để thay đổi hướng chuyển động hoặc giữ cho xe ô tô chuyển động ổn định theo hướng xác định” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":285,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Đèn phanh trên xe mô tô có tác dụng gì dưới đây?","o":["Có tác dụng cảnh báo cho các xe phía sau biết xe đang giảm tốc để chủ động tránh hoặc giảm tốc để tránh va chạm.","Có tác dụng định vị vào ban đêm với các xe từ phía sau tới để tránh va chạm.","Cả hai ý trên."],"a":3,"img":null,"ee":"Hai ý đều đúng: (1) Có tác dụng cảnh báo cho các xe phía sau biết xe đang giảm tốc để chủ động tránh hoặc…; (2) Có tác dụng định vị vào ban đêm với các xe từ phía sau tới để tránh va chạm. Vì câu hỏi gom hai nội dung đúng nên chọn “Cả hai ý trên.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 1: Có tác dụng cảnh báo cho các xe phía sau biết xe đang giảm tốc để chủ động tránh hoặc giảm tốc để tránh va chạm; ý 2: Có tác dụng định vị vào ban đêm với các xe từ phía sau tới để tránh va chạm. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Cả hai ý trên.”."},{"id":286,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây, báo hiệu tình trạng như thế nào của xe ô tô?","o":["Nhiệt độ nước làm mát động cơ quá ngưỡng cho phép.","Áp suất lốp không đủ.","Đang hãm phanh tay.","Cần kiểm tra động cơ."],"a":1,"img":"q286.webp","ee":"Hệ thống làm mát giữ động cơ trong vùng nhiệt độ làm việc, tránh quá nóng nhưng cũng không để máy quá lạnh.","ed":"Hệ thống làm mát giữ nhiệt độ động cơ trong vùng làm việc phù hợp, tránh quá nóng. Vì vậy các phương án nói tới hạ/ổn định nhiệt độ động cơ phù hợp hơn các phương án thuộc chức năng của hệ thống khác. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Nhiệt độ nước làm mát động cơ quá ngưỡng cho phép."},{"id":287,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây, báo hiệu tình trạng như thế nào của xe ô tô?","o":["Báo hiệu hệ thống chống bó cứng khi phanh bị lỗi.","Áp suất lốp không đủ.","Đang hãm phanh tay.","Cần kiểm tra động cơ."],"a":4,"img":"q287.webp","ee":"Hệ thống khởi động quay động cơ từ trạng thái đứng yên để động cơ có thể tự nổ và làm việc.","ed":"Bộ đề xác định nội dung đúng là: “Cần kiểm tra động cơ”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Áp suất lốp không đủ” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":288,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây, báo hiệu tình trạng như thế nào của xe ô tô?","o":["Báo hiệu thiếu dầu phanh.","Áp suất lốp không đủ.","Đang hãm phanh tay.","Sắp hết nhiên liệu."],"a":2,"img":"q288.webp","ee":"Hệ thống khởi động quay động cơ từ trạng thái đứng yên để động cơ có thể tự nổ và làm việc.","ed":"Lốp là phần tiếp xúc trực tiếp với mặt đường nên ảnh hưởng tới độ bám, ổn định và quãng phanh. Áp suất hoặc độ mòn không phù hợp đều làm khả năng kiểm soát xe giảm, vì vậy câu hỏi về lốp thường phải ưu tiên trạng thái bảo đảm bám đường và an toàn. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Áp suất lốp không đủ."},{"id":289,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây, báo hiệu tình trạng như thế nào của xe ô tô?","o":["Báo hiệu hệ thống chống bó cứng phanh bị lỗi.","Áp suất lốp không đủ.","Đang hãm phanh tay.","Sắp hết nhiên liệu."],"a":1,"img":"q289.webp","ee":"Hệ thống phanh tạo lực cản để giảm tốc hoặc dừng xe. Phanh tốt phải tác dụng ổn định và giúp xe không bị lệch hướng khi phanh.","ed":"Bộ đề xác định nội dung đúng là: “Báo hiệu hệ thống chống bó cứng phanh bị lỗi”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Đang hãm phanh tay” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":290,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi khởi động xe ô tô số tự động có trang bị chìa khóa thông minh có cần đạp hết hành trình bàn đạp chân phanh hay không?","o":["Phải đạp hết hành trình bàn đạp chân phanh.","Không cần đạp phanh.","Tùy từng trường hợp."],"a":1,"img":"q290.webp","ee":"Hệ thống phanh tạo lực cản để giảm tốc hoặc dừng xe. Phanh tốt phải tác dụng ổn định và giúp xe không bị lệch hướng khi phanh.","ed":"Bộ đề xác định nội dung đúng là: “Phải đạp hết hành trình bàn đạp chân phanh”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Không cần đạp phanh” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":291,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Ắc quy được trang bị trên xe ô tô có tác dụng gì dưới đây?","o":["Giúp người lái xe kịp thời tạo xung lực tối đa lên hệ thống phanh trong khoảnh khắc đầu tiên của tình huống khẩn cấp.","Ổn định chuyển động của xe ô tô khi đi vào đường vòng.","Hỗ trợ người lái xe khởi hành ngang dốc.","Để tích trữ điện năng, cung cấp cho các phụ tải khi máy phát chưa làm việc."],"a":4,"img":null,"ee":"Ắc quy là nơi tích trữ điện của xe, cấp điện khi khởi động và khi máy phát chưa đủ điện.","ed":"Ắc quy tích trữ điện và cấp điện khi cần, đặc biệt lúc khởi động hoặc khi nguồn phát chưa đáp ứng. Vì vậy đừng nhầm ắc quy với máy phát: một bên chủ yếu tích trữ/cấp điện, bên kia tạo điện khi động cơ làm việc. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Để tích trữ điện năng, cung cấp cho các phụ tải khi máy phát chưa làm việc."},{"id":292,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Máy phát điện được trang bị trên xe ô tô có tác dụng gì dưới đây?","o":["Để phát điện năng cung cấp cho các phụ tải làm việc và nạp điện cho ắc quy.","Ổn định chuyển động của xe ô tô khi đi vào đường vòng.","Hỗ trợ người lái xe khởi hành ngang dốc.","Để tích trữ điện năng và cung cấp điện cho các phụ tải làm việc."],"a":1,"img":null,"ee":"Ắc quy là nơi tích trữ điện của xe, cấp điện khi khởi động và khi máy phát chưa đủ điện.","ed":"Ắc quy tích trữ điện và cấp điện khi cần, đặc biệt lúc khởi động hoặc khi nguồn phát chưa đáp ứng. Vì vậy đừng nhầm ắc quy với máy phát: một bên chủ yếu tích trữ/cấp điện, bên kia tạo điện khi động cơ làm việc. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Để phát điện năng cung cấp cho các phụ tải làm việc và nạp điện cho ắc quy."},{"id":293,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Dây đai an toàn được trang bị trên xe ô tô có tác dụng gì dưới đây?","o":["Ổn định chuyển động của xe ô tô khi đi vào đường vòng.","Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại."],"a":2,"img":null,"ee":"Hiểu theo chức năng thực tế của bộ phận: Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Ổn định chuyển động của xe ô tô khi đi vào đường vòng” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":294,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Túi khí được trang bị trên xe ô tô có tác dụng gì dưới đây?","o":["Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại.","Giảm khả năng va đập của một số bộ phận cơ thể quan trọng với các vật thể trong xe.","Hấp thụ một phần lực va đập lên người lái và hành khách.","Ý 2 và ý 3."],"a":4,"img":null,"ee":"Hai ý đều đúng: (1) Giảm khả năng va đập của một số bộ phận cơ thể quan trọng với các vật thể trong xe; (2) Hấp thụ một phần lực va đập lên người lái và hành khách. Vì câu hỏi gom hai nội dung đúng nên chọn “Ý 2 và ý 3.”.","ed":"Đáp án gộp là đúng vì các ý thành phần mà nó gom lại đều đúng theo bộ câu hỏi: ý 2: Giảm khả năng va đập của một số bộ phận cơ thể quan trọng với các vật thể trong xe; ý 3: Hấp thụ một phần lực va đập lên người lái và hành khách. Khi gặp dạng “Cả hai/Cả ba ý trên”, không nên nhìn ngay đáp án gộp; hãy kiểm tra từng ý riêng. Chỉ khi tất cả các ý được gộp đều đúng mới chọn phương án “Ý 2 và ý 3.”."},{"id":295,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ ô tô đã khởi động, bảng đồng hồ xuất hiện ký hiệu như hình vẽ dưới đây không tắt trong thời gian dài, báo hiệu tình trạng như thế nào của xe ô tô?","o":["Nhiệt độ nước làm mát động cơ quá ngưỡng cho phép.","Áp suất lốp không đủ.","Đang hãm phanh tay.","Hệ thống lái gặp sự cố."],"a":4,"img":"q295.webp","ee":"Hệ thống lái truyền thao tác vô-lăng/tay lái tới bánh dẫn hướng để xe đổi hướng theo ý người lái.","ed":"Hệ thống lái truyền thao tác của người lái tới bánh dẫn hướng để thay đổi hướng chuyển động của xe. Vì vậy chức năng chính là điều khiển hướng, không phải giảm tốc hoặc truyền công suất động cơ. Vì vậy đáp án phù hợp với đúng chức năng được hỏi là: Hệ thống lái gặp sự cố."},{"id":296,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Trên xe ô tô có trang bị thiết bị như hình vẽ dưới đây có tác dụng gì?","o":["Dùng để kích (hay nâng) xe ô tô.","Vặn ốc lắp bánh xe.","Ổn định chuyển động của xe ô tô khi đi vào đường vòng.","Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại."],"a":1,"img":"q296.webp","ee":"Hiểu theo chức năng thực tế của bộ phận: Dùng để kích (hay nâng) xe ô tô. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Dùng để kích (hay nâng) xe ô tô”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Giữ chặt người lái và hành khách trên ghế ngồi khi xe ô tô đột ngột dừng lại” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":297,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Trên xe ô tô có trang bị thiết bị như hình vẽ dưới đây, dùng để làm gì?","o":["Thay lốp xe.","Chữa cháy.","Phá cửa kính xe ô tô trong các trường hợp khẩn cấp.","Vặn ốc để tháo lắp bánh xe."],"a":3,"img":"q297.webp","ee":"Hiểu theo chức năng thực tế của bộ phận: Phá cửa kính xe ô tô trong các trường hợp khẩn cấp. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Phá cửa kính xe ô tô trong các trường hợp khẩn cấp”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Vặn ốc để tháo lắp bánh xe” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":298,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Trên xe ô tô có trang bị thiết bị như hình vẽ dưới đây, dùng để làm gì?","o":["Thay lốp xe.","Chữa cháy trong các trường hợp hỏa hoạn.","Cầm máu cho người bị nạn."],"a":2,"img":"q298.webp","ee":"Hiểu theo chức năng thực tế của bộ phận: Chữa cháy trong các trường hợp hỏa hoạn. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Nguyên tắc chung là ưu tiên bảo vệ người, giảm nguy cơ phát sinh tai nạn thứ cấp và phối hợp với cơ quan chức năng. Vì vậy hành vi đúng phải an toàn, có trách nhiệm và không gây thêm cản trở. Trong câu này, cách xử lý phù hợp là: Chữa cháy trong các trường hợp hỏa hoạn."},{"id":299,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Nút bấm biểu tượng như hình vẽ trên xe ô tô có ý nghĩa như thế nào?","o":["Báo hiệu xin đường cho xe đi thẳng.","Báo hiệu hệ thống phanh bị lỗi.","Báo hiệu xe đang ở tình huống nguy hiểm.","Báo hiệu đến thời gian cần bảo dưỡng."],"a":3,"img":"q299.webp","ee":"Hiểu theo chức năng thực tế của bộ phận: Báo hiệu xe đang ở tình huống nguy hiểm. Liên hệ bộ phận đó với việc truyền lực, điều khiển hoặc bảo đảm an toàn của xe sẽ dễ hiểu hơn học thuộc tên.","ed":"Bộ đề xác định nội dung đúng là: “Báo hiệu xe đang ở tình huống nguy hiểm”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Báo hiệu hệ thống phanh bị lỗi” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":300,"ch":4,"ct":"Cấu tạo và sửa chữa","q":"Khi động cơ đã hoạt động, bảng đồng hồ xuất hiện biểu tượng hình vẽ dưới đây, báo hiệu tình trạng như thế nào của xe?","o":["Báo hiệu hệ thống túi khí đã bật.","Báo hiệu đèn chiếu sáng xa đã bật.","Báo hiệu chế độ lái tiết kiệm nhiên liệu đã bật.","Báo hiệu đèn cảnh báo khoảng cách đã bật."],"a":3,"img":"q300.webp","ee":"Hệ thống nhiên liệu cung cấp nhiên liệu đúng lượng cho động cơ để đốt cháy và sinh công.","ed":"Bộ đề xác định nội dung đúng là: “Báo hiệu chế độ lái tiết kiệm nhiên liệu đã bật”. Cách hiểu là phải giữ đúng đối tượng, điều kiện và phạm vi mà câu hỏi nêu; chỉ cần thay đổi một trong các yếu tố đó thì kết luận có thể khác. Phương án “Báo hiệu hệ thống túi khí đã bật” dễ gây nhầm vì không khớp đầy đủ điều kiện của câu này."},{"id":301,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cấm các loại xe cơ giới đi vào, trừ xe máy hai bánh, xe gắn máy và các loại xe ưu tiên theo quy định?","o":["Biển 1.","Biển 2.","Biển 1 và biển 3.","Cả ba biển."],"a":1,"img":"q301.webp","ee":"Biển 1 cấm ô tô nói chung. Vì xe tải, xe khách, xe con đều là các loại ô tô nên chúng cũng thuộc phạm vi cấm; ngoại lệ của câu là mô tô hai bánh, xe gắn máy và xe ưu tiên.","ed":"Trước hết xác định đối tượng mà biển cấm: biển cấm ô tô nói chung có phạm vi bao gồm các loại ô tô như xe con, xe tải, xe khách. Vì vậy nếu một biển cấm “ô tô” thì không được hiểu là chỉ cấm xe con. Tuy nhiên câu này nêu ngoại lệ cho mô tô hai bánh, xe gắn máy và xe ưu tiên. Đối chiếu hình, biển 1 là biển có đúng phạm vi đó."},{"id":302,"ch":5,"ct":"Báo hiệu đường bộ","q":"Biển nào cấm xe ô tô tải?","o":["Cả ba biển.","Biển 2 và biển 3.","Biển 1 và biển 3.","Biển 1 và biển 2."],"a":4,"img":"q302.webp","ee":"Xe tải bị cấm bởi hai loại biển trong hình: biển cấm ô tô nói chung cũng cấm xe tải vì xe tải là ô tô; biển cấm riêng xe tải thì đương nhiên cũng cấm. Vì vậy chọn Biển 1 và Biển 2.","ed":"Câu hỏi chỉ tập trung vào xe ô tô tải. Khi đọc biển cấm, cần kiểm tra xem biển đó cấm riêng xe tải hay cấm một nhóm rộng hơn có chứa xe tải. Biển cấm ô tô nói chung cũng làm xe tải không được đi vì xe tải là một loại ô tô; biển cấm riêng xe tải đương nhiên cũng cấm xe tải. Trong
